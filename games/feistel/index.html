  /* Character grid: each character and its UTF-8 byte(s) live together in one self-contained

  .bit-cell {
    width: 42px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.7);
    font-family: 'Oswald', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-primary);
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .bit-cell:not(.static):hover { border-color: var(--accent-gold); transform: translateY(-2px); }
  .bit-cell.static { cursor: default; }
  .bit-cell.pending { color: var(--text-muted); border-style: dashed; background: rgba(5,15,25,0.4); }
  .bit-cell.bit-active { color: #fff; background: rgba(0,162,255,0.22); border-color: var(--accent-blue); box-shadow: var(--glow-blue); }
  .bit-cell.bit-active.resolving { animation: resolvePulse 0.5s ease-in-out infinite; }
  @keyframes resolvePulse { 0%, 100% { box-shadow: var(--glow-blue); } 50% { box-shadow: 0 0 16px rgba(0,162,255,0.9), 0 0 28px rgba(0,162,255,0.5); } }
  .bit-cell.bit-worked { color: var(--text-primary); background: rgba(0,162,255,0.07); border-color: rgba(0,162,255,0.35); animation: dimBlink 1.8s ease-in-out infinite; }
  .bit-cell.just-revealed { animation: popIn 0.35s ease; }
  @keyframes dimBlink { 0%, 100% { box-shadow: 0 0 3px rgba(0,162,255,0.2); } 50% { box-shadow: 0 0 9px rgba(0,162,255,0.55); } }
  .bit-cell.key-slice { border-color: var(--accent-gold) !important; box-shadow: var(--glow-gold) !important; color: #fff; }
  .bit-cell.diff-bit { border-color: var(--accent-red) !important; box-shadow: 0 0 10px rgba(255,85,102,0.7), 0 0 20px rgba(255,85,102,0.35) !important; color: #fff; }
  .bit-cell.idx-bit { flex-direction: column; gap: 2px; height: 58px; }
  .bit-cell.idx-bit .idx-sub { font-size: 0.58rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
  .bit-cell.idx-bit.key-slice .idx-sub { color: rgba(255,255,255,0.7); }
  /* Avalanche-effect animation: flipping one S-box probe bit visibly ripples through the
     output. The flipped input bit gets an immediate ring pulse, the S-box arrow it flows
     through pulses a beat later, and each differing output bit lights up in a left-to-right
     cascade (staggered animation-delay set per element) instead of just snapping to red. */
  .bit-cell.flip-pulse { animation: flipPulse 0.6s ease-out; }
  @keyframes flipPulse {
    0% { transform: scale(1.35); box-shadow: 0 0 0 rgba(255,85,102,0); }
    35% { box-shadow: 0 0 16px rgba(255,85,102,0.85), 0 0 30px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  .swap-note.arrow-pulse { animation: arrowPulse 0.5s ease-out; }
  @keyframes arrowPulse {
    0%, 100% { text-shadow: none; }
    50% { color: #fff; text-shadow: 0 0 10px rgba(212,175,55,0.9); }
  }
  .bit-cell.diff-bit.avalanche { animation: avalancheRipple 0.55s ease-out backwards; }
  @keyframes avalancheRipple {
    0% { transform: scale(1.4); box-shadow: 0 0 0 rgba(255,85,102,0); }
    40% { box-shadow: 0 0 18px rgba(255,85,102,0.9), 0 0 34px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  /* A small gold/red spark physically flies from the flipped P bit, via the S-box arrow, to
     each output bit that changed — the same "watch it actually move" idea as the key-schedule
     rotation arc, applied to the avalanche demo so cause -> effect reads as motion, not just
     a color change. Positioned in JS (real screen coordinates), timed to land exactly when
     that bit's ripple glow (.avalanche above) starts. */
  .avalanche-spark {
    position: fixed; width: 11px; height: 11px; border-radius: 50%; left: 0; top: 0;
    background: radial-gradient(circle, #fff 0%, var(--accent-gold) 45%, var(--accent-red) 100%);
    box-shadow: 0 0 8px rgba(255,85,102,0.85), 0 0 16px rgba(212,175,55,0.55);
    pointer-events: none; z-index: 150;
  }
  @media (prefers-reduced-motion: reduce) {
    .bit-cell.flip-pulse, .swap-note.arrow-pulse, .bit-cell.diff-bit.avalanche { animation: none; }
  }

  .bit-cell.wrap-next { border-color: var(--accent-gold); animation: pulseGold 1.2s ease-in-out infinite; }
  .bit-cell.wrap-arc { animation: wrapArc 0.55s cubic-bezier(.4,0,.2,1) both; position: relative; z-index: 5; }
  @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: var(--glow-gold); } }
  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wrapArc {
    0%   { transform: translate(var(--dx), var(--dy)); }
    45%  { transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5 - 34px)); }
    100% { transform: translate(0, 0); }
  }
  .bit-readout { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }
  .bit-readout span { color: var(--accent-gold); font-family: 'Oswald', sans-serif; }
  .bit-equation { text-align: center; font-family: 'Oswald', sans-serif; color: var(--text-secondary); font-size: 0.95rem; margin: 8px 0 4px; letter-spacing: 0.5px; }
  .bit-equation .num { color: var(--accent-gold); }
  .bit-equation.done { color: var(--accent-green); }

  .half-pair { display: flex; justify-content: center; gap: 30px; margin: 10px 0; align-items: flex-start; flex-wrap: wrap; }
  .half-block { text-align: center; }
  .half-block .byte-row { margin: 0; }
  .half-label { font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
  .half-block.left .half-label { color: var(--accent-green); }
  .half-block.right .half-label { color: var(--accent-blue); }

  .op-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
  .op-symbol { font-size: 1.6rem; color: var(--accent-gold); font-family: 'Oswald', sans-serif; }
  .op-eq { font-size: 1.4rem; color: var(--text-muted); }

  /* S-box as a matrix: row = the two high bits of the input, column = the two low bits,
     the cell holds the output. Row/column headers light up for the entry being looked up. */
  .sbox-matrix { display: grid; grid-template-columns: 38px repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 440px; margin: 6px auto 4px; }
  .sm-head { display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.8px; color: var(--text-muted); transition: all 0.3s ease; }
  .sm-head.hl { color: var(--accent-gold); text-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .sm-corner { font-size: 0.6rem; line-height: 1.1; color: var(--text-muted); text-align: center; align-self: center; }
  .sbox-cell { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 4px 2px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.6); transition: all 0.3s ease; }
  .sbox-cell .val { font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: var(--text-secondary); }
  .sbox-cell .bin { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.5px; }
  .sbox-cell.active { background: rgba(212,175,55,0.18); border-color: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-cell.active .val { color: #fff; }
  .sbox-cell.active .bin { color: rgba(255,255,255,0.75); }
  .sbox-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; margin: 8px auto 2px; }
  .sbox-note.ok { color: var(--accent-green); }
  .sbox-note.bad { color: var(--accent-orange); }
  /* In the avalanche demo, the matrix shows both the previous S-box lookup (dashed, muted —
     "where P used to point") and the current one (solid gold, from the existing .hl/.active
     rules) at once, so a bit flip visibly moves the lookup from one matrix cell to another. */
  .sm-head.hl-prev { color: rgba(212,175,55,0.6); text-decoration: underline dashed rgba(212,175,55,0.6); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .sbox-cell.was { border-style: dashed; border-width: 2px; border-color: rgba(212,175,55,0.45); background: rgba(212,175,55,0.05); }
  .sbox-cell.was .val { color: var(--text-primary); }
  /* Small on-screen key so "solid gold = now, dashed = before" isn't only explained in prose. */
  .sbox-legend { display: flex; gap: 18px; justify-content: center; align-items: center; margin: 2px 0 10px; font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .sbox-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
  .sbox-legend-item .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .sbox-legend-item.now { color: var(--accent-gold); }
  .sbox-legend-item.now .dot { background: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-legend-item.prev { color: rgba(212,175,55,0.75); }
  .sbox-legend-item.prev .dot { background: transparent; border: 2px dashed rgba(212,175,55,0.6); }
  .av-history { margin-top: 10px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; }
  .av-hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; font-family: 'Oswald', sans-serif; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--card-border); }
  .av-hist-row:first-child { border-top: none; }
  .av-hist-row.latest { color: var(--accent-gold); background: rgba(212,175,55,0.08); }
  .av-hist-diff { color: var(--text-secondary); flex: none; }
  .av-hist-row.latest .av-hist-diff { color: var(--accent-gold); }

  .round-track { display: flex; justify-content: center; gap: 6px; margin: 2px 0 10px; }
  .round-pip {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-family: 'Oswald', sans-serif; border: 1px solid var(--card-border); color: var(--text-muted);
  }
  .round-pip.done { background: var(--accent-green); border-color: var(--accent-green); color: #04210f; }
  .round-pip.current { background: var(--accent-gold); border-color: var(--accent-gold); color: #2a1d00; box-shadow: var(--glow-gold); }
  .round-track.ks-tabs { gap: 14px; margin: 6px 0 12px; }
  .round-track.ks-tabs .round-pip { width: 38px; height: 38px; font-size: 1.05rem; cursor: pointer; transition: all 0.2s ease; }
  .round-track.ks-tabs .round-pip:hover { border-color: var(--accent-gold); }
  .round-track.ks-tabs .round-pip.attention { border-color: var(--accent-gold); box-shadow: var(--glow-gold); animation: pipBounce 1.1s ease-in-out infinite; }
  @keyframes pipBounce {
    0%, 100% { transform: translateY(0); }
    20% { transform: translateY(-10px); }
    40% { transform: translateY(0); }
    55% { transform: translateY(-5px); }
    70% { transform: translateY(0); }
  }

  .swap-note { text-align: center; color: var(--accent-gold); font-family: 'Oswald', sans-serif; font-size: 0.95rem; margin: 5px 0; letter-spacing: 0.5px; }
  .arrow-swap { display: inline-block; animation: swapPulse 1.4s infinite; }
  @keyframes swapPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .btn-row { display: flex; justify-content: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px;
    padding: 11px 22px; border-radius: 6px; cursor: pointer; border: 1px solid; transition: all 0.25s ease; background: transparent;
  }
  .btn-primary { color: var(--accent-blue); border-color: rgba(0,162,255,0.4); background: rgba(0,162,255,0.1); }
  .btn-primary:hover { border-color: var(--accent-blue); box-shadow: var(--glow-blue); transform: translateY(-2px); }
  .btn-gold { color: var(--accent-gold); border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.1); }
  .btn-gold:hover { border-color: var(--accent-gold); box-shadow: var(--glow-gold); transform: translateY(-2px); }
  .btn-ghost { color: var(--text-muted); border-color: var(--card-border); }
  .btn-ghost:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .nav-hint { flex: 0 0 100%; text-align: center; color: var(--accent-gold); font-size: 0.8rem; line-height: 1.4; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* Detailed-status overlay opened from the map's expand button */
  .overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(2, 8, 14, 0.78); backdrop-filter: blur(3px); animation: ovFade 0.2s ease; }
  .overlay[hidden] { display: none; }
  @keyframes ovFade { from { opacity: 0; } to { opacity: 1; } }
  .overlay-card { width: 100%; max-width: 760px; max-height: min(86vh, 820px); display: flex; flex-direction: column; text-align: left; background: #08192a; border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 0 40px rgba(0,162,255,0.25); animation: popIn 0.25s ease; }
  .overlay-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 10px; }
  .overlay-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-blue); font-size: 1.1rem; }
  .overlay-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }
  .overlay-close { flex: none; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; color: var(--text-secondary); background: transparent; border: 1px solid var(--card-border); border-radius: 6px; transition: all 0.2s ease; }
  .overlay-close:hover { color: var(--accent-gold); border-color: var(--accent-gold); }
  .overlay-progress { height: 3px; margin: 0 20px 6px; background: rgba(0,162,255,0.15); border-radius: 2px; overflow: hidden; }
  .overlay-progress > div { height: 100%; background: #00ff80; transition: width 0.3s ease; }
  .overlay-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 20px; position: relative; }
  .ov-step { display: flex; gap: 14px; padding: 13px 15px; margin-bottom: 10px; border: 1px solid var(--card-border); border-radius: 8px; background: rgba(5,15,25,0.55); }
  .ov-step.done { border-color: rgba(72,187,120,0.4); }
  .ov-step.current { border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(212,175,55,0.25); }
  .ov-step.upcoming { opacity: 0.72; }
  .ov-step.clickable { cursor: pointer; }
  .ov-step.clickable:hover { border-color: #00ff80; }
  .ov-icon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; border: 2px solid var(--card-border); color: var(--text-muted); }
  .ov-step.done .ov-icon { background: #00ff80; border-color: #00ff80; color: #04210f; }
  .ov-step.current .ov-icon { background: var(--accent-gold); border-color: var(--accent-gold); color: #2a1d00; animation: pulseGold 1.4s ease-in-out infinite; }
  .ov-main { flex: 1; min-width: 0; }
  .ov-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ov-name { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.95rem; color: var(--text-secondary); }
  .ov-step.current .ov-name { color: var(--accent-gold); font-weight: 700; }
  .ov-pill { font-family: 'Oswald', sans-serif; font-size: 0.66rem; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--card-border); color: var(--text-muted); }
  .ov-step.done .ov-pill { color: #00ff80; border-color: rgba(0,255,128,0.4); }
  .ov-step.current .ov-pill { color: var(--accent-gold); border-color: rgba(212,175,55,0.5); }
  .ov-what { font-size: 0.86rem; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .ov-result { margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 0.88rem; letter-spacing: 0.4px; color: var(--accent-gold); word-break: break-word; }
  .ov-main .mf-bits { margin-top: 6px; }
  .ov-subs { margin-top: 8px; display: grid; gap: 4px; }
  .ov-sub { display: flex; gap: 8px; align-items: baseline; font-size: 0.82rem; color: var(--text-muted); }
  .ov-sub .ov-sub-ico { flex: none; width: 14px; text-align: center; }
  .ov-sub.done { color: var(--text-secondary); }
  .ov-sub.done .ov-sub-ico { color: #00ff80; }
  .ov-sub.current { color: var(--accent-gold); }
  .ov-sub .ov-sub-val { font-family: 'Oswald', sans-serif; color: var(--accent-gold); letter-spacing: 0.3px; }
  .ov-goto { margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: #00ff80; }

  footer { margin-top: 50px; font-size: 0.85rem; color: var(--text-muted); }
  footer a { color: var(--accent-blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 900px) { h1 { font-size: 2rem; } }
  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    .bit-cell { width: 32px; height: 42px; font-size: 1.05rem; }
    .panel { padding: 18px; }
    .half-pair { gap: 16px; }
    /* The 3-operand XOR equation (R ⊕ K = X) doesn't fit one line on a phone; instead of an
       unpredictable mid-row wrap, stack operand / operator / operand / "=" / result top to
       bottom so it still reads left-to-right as one sequence. */
    .op-row { flex-direction: column; gap: 8px; }
    .op-row .half-block { width: 100%; }
    .algo-list { grid-template-columns: 1fr; }
    .overlay { padding: 10px; }
    .overlay-card { max-height: 92vh; }
    .overlay-head { padding: 14px 16px 8px; }
    .overlay-body { padding: 8px 16px 16px; }
    .ov-step { padding: 11px 12px; gap: 10px; }
  }
  @media (max-width: 480px) { .bit-cell { width: 28px; height: 38px; } .byte-row { gap: 5px; } }

  /* ===== Key centre & channels (same component in the Feistel and SPN games) =====
     Three parties on one diagram: the key centre on top hands the key to Alice and Bob over
     protected (gold, dashed) channels; Alice and Bob are joined by the open (blue) channel,
     which Eve listens to from below. Packets fly between the nodes like in the other lab games. */
  .net { position: relative; height: 340px; margin: 8px 0 4px; border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden;
    background: radial-gradient(circle at 50% 25%, rgba(212,175,55,0.08) 0%, transparent 38%), radial-gradient(circle at 50% 82%, rgba(255,85,102,0.06) 0%, transparent 30%), rgba(5,15,25,0.45); }
  .net-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .net-lines .ln { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .net-lines .ln-key { stroke: rgba(212,175,55,0.75); stroke-dasharray: 7 5; }
  .net-lines .ln-open { stroke: rgba(0,162,255,0.75); }
  .net-lines .ln-eve { stroke: rgba(255,85,102,0.45); stroke-dasharray: 3 4; }
  .net-key .ln-key { stroke-width: 3; animation: netDash 1.1s linear infinite; }
  .net-cipher .ln-open { stroke-width: 3; }
  .net-cipher .ln-key { opacity: 0.45; }
  @keyframes netDash { to { stroke-dashoffset: -24; } }
  .net-lbl { position: absolute; transform: translate(-50%, -50%); z-index: 1; padding: 1px 7px; border-radius: 4px; background: rgba(5,15,25,0.9);
    font-family: 'Oswald', sans-serif; font-size: 0.66rem; letter-spacing: 0.6px; text-transform: uppercase; white-space: nowrap; }
  .net-lbl.key { color: var(--accent-gold); }
  .net-lbl.open { color: var(--accent-blue); }
  .net-node { position: absolute; transform: translate(-50%, -50%); z-index: 2; width: 132px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .nn-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent-blue); color: var(--accent-blue);
    background: rgba(5,20,30,0.95); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.25rem; box-shadow: var(--glow-blue); }
  .nn-kc .nn-icon { width: 62px; height: 52px; border-radius: 12px; border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: var(--glow-gold); font-size: 0.95rem; letter-spacing: 0.5px; }
  .nn-eve .nn-icon { width: 38px; height: 38px; font-size: 0.95rem; border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 10px rgba(255,85,102,0.45); }
  .nn-name { font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); line-height: 1.2; }
  .nn-sub { font-size: 0.62rem; color: var(--text-muted); line-height: 1.15; }
  .nn-name, .nn-sub { text-shadow: 0 0 4px rgba(5,15,25,0.95), 0 0 2px rgba(5,15,25,0.95); }
  .nn-slots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 19px; }
  .nn-chip { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.3px; padding: 1px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .nn-chip.k { color: var(--accent-gold); border-color: rgba(212,175,55,0.6); background: rgba(212,175,55,0.12); }

      'info.toggle': 'ℹ️ How does the cipher work?',
      'info.p1': 'In 1971 at IBM, <span class="highlight-gold">Horst Feistel</span> came up with a scheme that solved a strange problem: how do you build a cipher that decrypts the same way it encrypts, even if its inner "scrambling function" cannot be reversed at all?',
      'info.p2': 'The solution: <span class="highlight">cut the data block in half</span>, scramble one half with a key and mix the result into the other, then swap the halves. Repeat a few times — that is a cipher. Run the very same thing with the keys in reverse order and it decrypts itself.',
      'info.p3': '<span class="highlight-gold">Don Coppersmith</span> later helped bring this idea (through the Lucifer cipher) to the <span class="highlight">DES</span> standard — designing S-boxes resistant to attacks the rest of the world only discovered decades later. In the USSR the same principle was used to build its own standard — <span class="highlight-gold">GOST 28147-89</span>, today known as "Magma" (GOST R 34.12-2015): the same Feistel network, but with 32 rounds and a 256-bit key.',

      'intro.p1': 'The Feistel network (Horst Feistel, IBM, early 1970s) is a way of building block ciphers. The block is split into halves <span class="highlight-green">L</span> and <span class="highlight">R</span>; in each round R is mixed with a subkey and passed through a function F, the result is added (⊕) to L, and then the halves are swapped. The key property: F does not have to be invertible — decryption runs the same scheme with the subkeys in reverse order.',
      'intro.base': 'This is the prototype and basis of <span class="highlight">DES</span> and of Russia\'s <span class="highlight-gold">Magma</span> (GOST 28147-89 / GOST R 34.12-2015): both ciphers are Feistel networks. They differ in block and key size, number of rounds (16 for DES, 32 for Magma), the function F and the S-boxes.',

      'textprep.h': 'Step 1 — preparing the text',
      'textprep.p1': 'Before anything can be encrypted, it has to be prepared: a computer doesn\'t work with letters, only with bits. The UTF-8 standard turns every character into one or more bytes — type a word or phrase and see what comes out of it.',

      'textprep.disclaimerTeaser': '⚠️ Real ciphers process the whole text, not just one byte',
      'textprep.disclaimer': 'Real ciphers process every byte of a message in turn (or in blocks), not just a single byte. Here, for clarity, we take only the one byte you picked from your text and walk the whole Feistel network through it. DES and Russia\'s Magma (GOST 28147-89 / GOST R 34.12-2015) work the same way — both encrypt in 8-byte (64-bit) blocks, not byte by byte.',
      'msg.h': 'Step 2 — plaintext',

      'key.h': 'Step 3 — the shared secret key',
      'key.p': 'The shared secret key is also 8&nbsp;bits. It’s generated not by Alice or Bob but by a third party — the key centre. In the next step it sends the key to both of them, and after that we’ll see how a separate subkey for every round comes from this one key. Click the bits to set the key.',
      'ks.h': 'Step 5 — the key schedule',
      'ks.p1': 'The master key is never used directly in a round: a separate subkey is derived from it for each round. In real DES this is done with permutations and shifts — a 56-bit key yields 16 different 48-bit subkeys. Russia\'s Magma does it differently: its 256-bit key is simply cut into eight 32-bit pieces — more below.',
      'ks.p2': 'Here the rule is simpler: for round r, the key is rotated left by (r × 3) mod 8 bits — every round gets its own shift amount, and the low 4 bits of the result become that round\'s subkey K.',
      'ks.shiftOverview': 'That is why every round has a different shift, even though the key itself is the same:',
      'ks.shiftChip': 'Round {i}: {shift} bits',
      'ks.shiftFixed': 'This formula itself is part of the cipher\'s specification, fixed in advance just like the S-box: it is the same for every key. Take a different master key and the shifts 3/6/1/4 stay exactly the same — only the resulting K1..K4 numbers change.',
      'ks.shiftLine': 'Round {r}: the key needs to rotate left by {shift} bits.',
      'ks.stepHint': 'Each click is one 1-bit rotation step: the leftmost bit moves to the end, and every other bit shifts one position to the left.',

      'ks.result': 'The low 4 bits ({bin}) are subkey K{r} = {val}.',
      'ks.wasPos': 'was {j}',
      'ks.timing': 'All four subkeys can be computed in advance, before the first round even starts: they depend only on the master key, not on the message. Alice and Bob each get the same K1..K4 independently, because they know the same key.',
      'ks.tabsHint': 'The 1–4 buttons switch which round\'s rotation animation is shown — each round has its own number of shift bits. A round\'s subkey counts as determined only once its own rotation is done — to continue, go through all four.',
      'ks.disclaimerTeaser': '⚠️ DES and Magma key schedules are more elaborate',
      'ks.disclaimer': 'In real DES the key schedule is more elaborate: a 56-bit key goes through two permutations (PC-1/PC-2) and is cyclically shifted by 1–2 bits on each of 16 rounds, giving 16 different 48-bit subkeys. Here it\'s one rotation of the whole byte and its low 4 bits, so the principle "one key → different subkeys per round" is visible without extra arithmetic. Magma\'s key is longer — 256 bits — split into eight 32-bit chunks K1…K8: rounds 1–24 cycle through them in that order, rounds 25–32 use the reverse order; unlike DES, the key itself is never shifted or permuted.',
      'sboxprep.h': 'Step 6 — preparing the S-box',
      'sboxprep.p1': 'The S-box is part of the cipher\'s specification, not a secret tied to this particular session. It is fixed once, when the cipher is designed (IBM did this for Lucifer/DES; for Russia\'s Magma the tables are written into the text of GOST R 34.12-2015), and used unchanged for every key and every message afterwards — unlike the subkeys K1..K4, the S-box does not depend on the master key at all.',
      'sboxprep.p2': 'A good S-box first needs to be a permutation: each of the 16 possible outputs is used exactly once, otherwise some information about the input would be lost for good. Second, it needs to be nonlinear: a small change to the input (even one bit) should change the output noticeably and unpredictably. This is called the avalanche effect.',
      'sboxprep.permYes': '✅ Checked: it is a permutation — every value 0–15 appears exactly once',

      'sboxprep.avalancheIntro': 'Let\'s try it on a test value P: there is a demo below — click a bit of P to see how F(P) changes and which matrix cell gets looked up.',

      'sboxprep.disclaimerTeaser': '⚠️ DES and Magma S-boxes are more elaborate too',
      'sboxprep.disclaimer': 'Real DES S-boxes are more elaborate: there are eight of them (one per 6-bit chunk of the expanded block), each mapping 6 bits to 4, and the criteria behind their design (resistance to differential cryptanalysis) were kept secret until the late 1980s. Here it is one 4→4 box, so the ideas of permutation and avalanche are easier to see. Magma also has eight 4→4-bit S-boxes, but the original GOST 28147-89 standard didn\'t fix them — the exact set was treated as extra secret material and could differ between agencies; the modern GOST R 34.12-2015 ("Magma") standard finally fixed one official set.',
      'rounds.h': 'Step 7 — encryption round {r} of {tot}',
      'rounds.intro': 'Every round has three stages: add the right half to the subkey, run the result through the S-box, and add it to the left half — then the halves swap places.',

      'sum.h': '🎓 The key takeaway',
      'sum.p1': 'The main trick of a Feistel network: <span class="highlight">the function F does not have to be reversible</span>. Inside a round the S-box can be as complex and "one-way" as you like — decryption works not because F can be undone, but because <em>the structure itself</em> — "split, scramble, swap" — is reversible when the keys are applied in reverse order.',
      'sum.p2': 'Horst Feistel built this idea into the <span class="highlight-gold">Lucifer</span> cipher at IBM (late 1960s – early 1970s). Later Don Coppersmith helped rework the S-boxes so the cipher would withstand differential cryptanalysis — an attack the scientific community only rediscovered in the late 1980s. The refined Lucifer became the <span class="highlight">DES</span> standard (1977), and the Feistel network itself is still used in dozens of ciphers. In the USSR the same principle produced GOST 28147-89 (adopted in 1989); in 2015 its cipher, under the name "Magma", was included in GOST R 34.12-2015 — Russia\'s counterpart to DES, still a current standard there.',
      'sum.disclaimerTeaser': '⚠️ Real ciphers (DES, Magma) are far bigger in scale',
      'sum.disclaimer': 'This is a very simplified model: the real Lucifer worked on 128-bit blocks, with several interlinked S-boxes and a far more serious key schedule (DES uses 64-bit blocks and 16 rounds). Here it is one byte, one S-box and 4 rounds, so you can see the idea with your own eyes. Magma (Russia\'s GOST 28147-89 / GOST R 34.12-2015) uses this exact same Feistel-network idea, just at a much bigger scale: a 64-bit block, a 256-bit key, and 32 rounds. One difference: in Magma the subkey is added to the right half not with bitwise ⊕ but with addition modulo 2³²; the result then goes through the S-boxes and is rotated left by 11 bits.',

      'x.kd': 'The key is generated and distributed by a third party — the key centre; a cryptographic protection body is responsible for the keys. Alice and Bob receive the same key by a protected route and never send it to each other.',
      'kd.p1': 'The weakest point of a symmetric cipher isn’t the algorithm but the key: the sender and the receiver must have the same one, and nobody else may have it. The key can’t be sent over the same channel as the message — an eavesdropper would get both.',
      'kd.p2': 'In Russia the procedure is set by FAPSI Instruction No. 152 (2001), for cryptographic protection tools (SKZI) that protect restricted information other than state secrets. Keys are generated and distributed by a <b>cryptographic protection body</b> (OKZ): a unit of the organisation, an FSB-licensed company, or even a single appointed person. The OKZ produces the key documents, keeps a per-copy register of them and delivers them to the users on key media — by state courier or a special communication service, or by hand. The key is loaded into the device by an authorised person: an OKZ employee or a trained user. Technically the keys may be prepared by software — the key centre or the network control centre of a protected network — but people are responsible for them. How a key is generated from randomness is shown in the <a class="highlight" href="../cvk/index.html">“Key Generation Center”</a> game.',

      'tx.p2': 'That’s exactly what a cipher’s strength means: seeing the ciphertext, and even knowing how the cipher works, Eve can’t recover the plaintext without the key.',

      'kd.realShort': 'DES in banking: under ANSI X9.17 a key centre sent out keys encrypted under key-encrypting keys, which trusted staff loaded by hand. Magma: keys are produced, registered and delivered by a cryptographic protection body and loaded into the device by an authorised person.',
      'kd.real1': '<b>DES.</b> The banking standard ANSI X9.17 (1985; FIPS 171 in the US) described DES key management through exactly such a key centre (key distribution centre, KDC). The centre sent working keys over the network, but encrypted — under “key-encrypting keys”. The key-encrypting keys themselves never went over the network: trusted staff installed them in the equipment by hand.',

      'game.title': 'Red de Feistel',
      'game.tagline': 'Cómo una sola idea dio origen a DES — y a casi toda la criptografía simétrica',
      'info.toggle': 'ℹ️ ¿Cómo funciona el cifrado?',
      'info.p1': 'En 1971, en IBM, <span class="highlight-gold">Horst Feistel</span> ideó un esquema que resolvía un problema curioso: ¿cómo construir un cifrado que se descifre de la misma manera que se cifró, aunque su «función de mezcla» interna no sea reversible en absoluto?',
      'info.p2': 'La solución: <span class="highlight">cortar el bloque de datos por la mitad</span>, mezclar una mitad con la clave y combinar el resultado con la otra, y luego intercambiar las mitades. Repetirlo varias veces — eso es un cifrado. Hacer lo mismo con las claves en orden inverso y se descifra solo.',
      'info.p3': '<span class="highlight-gold">Don Coppersmith</span> ayudó después a llevar esta idea (a través del cifrado Lucifer) hasta el estándar <span class="highlight">DES</span>, diseñando S-boxes resistentes a ataques que el resto del mundo descubrió décadas más tarde. En la URSS, con el mismo principio se construyó un estándar propio — el <span class="highlight-gold">GOST 28147-89</span>, hoy conocido como «Magma» (GOST R 34.12-2015): la misma red de Feistel, pero con 32 rondas y una clave de 256 bits.',

      'intro.tip': '💡 Cada paso es interactivo: cambia bits y observa cómo varía el resultado.',
      'intro.p1': 'La red de Feistel (Horst Feistel, IBM, principios de los 70) es una forma de construir cifrados de bloque. El bloque se divide en dos mitades, <span class="highlight-green">L</span> y <span class="highlight">R</span>; en cada ronda R se mezcla con una subclave y pasa por una función F, el resultado se suma (⊕) a L y después las mitades se intercambian. La propiedad clave: F no tiene por qué ser invertible — el descifrado usa el mismo esquema con las subclaves en orden inverso.',
      'intro.base': 'Es el prototipo y la base del <span class="highlight">DES</span> y del <span class="highlight-gold">Magma</span> ruso (GOST 28147-89 / GOST R 34.12-2015): ambos cifrados son redes de Feistel. Se distinguen por el tamaño de bloque y de clave, el número de rondas (16 en DES, 32 en Magma), la función F y las S-boxes.',
      'intro.algoTitle': 'Qué se construye sobre la red de Feistel',
      'intro.a1': '<b>Lucifer</b> (IBM, principios de los 70) — antecesor directo del DES',
      'intro.a2': '<b>DES</b> (1977) y <b>3DES</b> — bloque de 64 bits, 16 rondas',
      'intro.a3': '<b>Magma</b> (GOST 28147-89 → GOST R 34.12-2015) — bloque de 64 bits, clave de 256 bits, 32 rondas',
      'intro.a4': '<b>Blowfish</b> (1993), <b>CAST-128</b>, <b>Twofish</b> — cifrados abiertos populares de los años 90',
      'intro.a5': '<b>Camellia</b> — estándar internacional (ISO/IEC), usado en TLS',
      'intro.a6': '<b>KASUMI</b> — el cifrado de las redes móviles 3G',
      'intro.a7': '<b>FF1 / FF3</b> (NIST SP 800-38G) — cifrado que conserva el formato',
      'intro.notFeistel': 'No son redes de Feistel: AES y el «Kuznyechik» ruso (redes de sustitución-permutación).',
      'textprep.h': 'Paso 1 — preparación del texto',
      'textprep.p1': 'Antes de cifrar algo hay que prepararlo: un ordenador no trabaja con letras, solo con bits. El estándar UTF-8 convierte cada carácter en uno o varios bytes — escribe una palabra o frase y mira qué sale.',
      'textprep.counter': '{chars} caracteres · {bytes} bytes',
      'textprep.p2': 'Haz clic en cualquier byte de abajo — ese es el que usaremos de aquí en adelante como texto en claro.',
      'textprep.selectedLabel': '✅ Byte seleccionado del carácter «{ch}»', 'textprep.selectedValue': '{val} · binario {bin}',
      'textprep.empty': 'Escribe el texto',
      'textprep.disclaimerTeaser': '⚠️ Los cifrados reales procesan todo el texto, no solo un byte',
      'textprep.disclaimer': 'Los cifrados reales procesan todos los bytes del mensaje uno tras otro (o en bloques), no un único byte. Aquí, para mayor claridad, tomamos solo el byte que elegiste de tu texto y recorremos con él toda la red de Feistel. El DES y el Magma ruso (GOST 28147-89 / GOST R 34.12-2015) funcionan igual: ambos cifran en bloques de 8 bytes (64 bits), no byte a byte.',
      'msg.h': 'Paso 2 — texto en claro',
      'msg.p': 'Aquí está el byte que elegiste de tu texto — este es el texto en claro que Alicia envía a Bob. ¿Quieres otro byte? Vuelve un paso atrás y elige otro en el texto.',
      'msg.pManual': 'No escribiste texto en el paso anterior, así que no hay ningún byte que elegir. Ajusta el texto en claro a mano — haz clic en los bits de abajo para alternar 0 y 1.',
      'key.h': 'Paso 3 — la clave secreta compartida',
      'key.p': 'La clave secreta compartida también tiene 8&nbsp;bits. No la generan ni Alicia ni Bob, sino un tercero: el centro de claves. En el siguiente paso se la enviará a ambos, y después veremos cómo de esta única clave sale una subclave distinta para cada ronda. Haz clic en los bits para fijar la clave.',
      'ks.h': 'Paso 5 — el calendario de claves',
      'ks.p1': 'La clave maestra nunca se usa directamente en una ronda: de ella se deriva una subclave distinta para cada ronda. En el DES real esto se hace con permutaciones y desplazamientos — de una clave de 56 bits salen 16 subclaves distintas de 48 bits. El Magma ruso lo hace de otra forma: su clave de 256 bits simplemente se corta en ocho trozos de 32 bits — más detalles abajo.',
      'ks.p2': 'Aquí la regla es más simple: para la ronda r, la clave se rota a la izquierda (r × 3) mod 8 bits — cada ronda tiene su propio desplazamiento, y los 4 bits menos significativos del resultado se convierten en la subclave K de esa ronda.',
      'ks.shiftOverview': 'Por eso cada ronda tiene un desplazamiento distinto, aunque la clave sea la misma:',
      'ks.shiftChip': 'Ronda {i}: {shift} bits',
      'ks.shiftFixed': 'Esta fórmula en sí es parte de la especificación del cifrado, fijada de antemano igual que la S-box: es la misma para cualquier clave. Toma otra clave maestra y los desplazamientos 3/6/1/4 seguirán siendo los mismos — solo cambiarán los números K1..K4 resultantes.',
      'ks.shiftLine': 'Ronda {r}: la clave debe rotar a la izquierda {shift} bits.',
      'ks.stepHint': 'Cada clic es un paso de rotación de 1 bit: el bit más a la izquierda pasa al final, y todos los demás se desplazan una posición a la izquierda.',
      'ks.stepProgress': 'Paso {step} de {shift}',
      'ks.stepBtn': 'Desplazar 1 bit →',
      'ks.skipBtn': 'Mostrar el resultado directamente',
      'ks.replayBtn': '↺ Repetir la animación',
      'ks.masterLabel': 'Clave maestra (8 bits)',
      'ks.rotatedLabel': 'Tras rotar {shift} bits',
      'ks.result': 'Los 4 bits menos significativos ({bin}) son la subclave K{r} = {val}.',
      'ks.wasPos': 'era {j}',
      'ks.timing': 'Las cuatro subclaves pueden calcularse de antemano, antes incluso de la primera ronda: dependen solo de la clave maestra, no del mensaje. Alicia y Bob obtienen las mismas K1..K4 de forma independiente, porque conocen la misma clave.',
      'ks.tabsHint': 'Los botones 1–4 cambian de qué ronda se muestra la animación de rotación — cada ronda tiene su propio número de bits de desplazamiento. La subclave de una ronda solo se considera determinada cuando se hace su propio giro — para continuar, recorre las cuatro.',
      'ks.disclaimerTeaser': '⚠️ En el DES y el Magma el calendario de claves es más elaborado',
      'ks.disclaimer': 'En el DES real el calendario de claves es más elaborado: una clave de 56 bits pasa por dos permutaciones (PC-1/PC-2) y se desplaza cíclicamente 1–2 bits en cada una de las 16 rondas, dando 16 subclaves distintas de 48 bits. Aquí hay una sola rotación de todo el byte y sus 4 bits menos significativos, para que se vea el principio «una clave → subclaves distintas por ronda» sin aritmética adicional. La clave del Magma es más larga — 256 bits — dividida en ocho partes de 32 bits K1…K8: las rondas 1–24 las usan en ese mismo orden cíclico, y las rondas 25–32 en orden inverso; a diferencia del DES, aquí la propia clave nunca se rota ni se permuta.',
      'sboxprep.h': 'Paso 6 — preparación de la S-box',
      'sboxprep.p1': 'La S-box es parte de la especificación del propio cifrado, no un secreto de esta sesión concreta. Se fija una sola vez, cuando se diseña el cifrado (IBM lo hizo para Lucifer/DES; en el Magma ruso las tablas están escritas en el texto del GOST R 34.12-2015), y se usa sin cambios para cualquier clave y cualquier mensaje — a diferencia de las subclaves K1..K4, la S-box no depende en absoluto de la clave maestra.',
      'sboxprep.p2': 'Una buena S-box debe ser, primero, una permutación: cada una de las 16 salidas posibles se usa exactamente una vez, o de lo contrario se perdería información sobre la entrada. Segundo, debe ser no lineal: un cambio pequeño en la entrada (incluso un bit) debe cambiar la salida de forma notable e impredecible. A esto se le llama efecto avalancha.',
      'sboxprep.permYes': '✅ Comprobado: es una permutación — cada valor de 0 a 15 aparece una sola vez',
      'sboxprep.permNo': '⚠️ Esta tabla tiene repeticiones — una S-box así perdería información sobre su entrada.',
      'sboxprep.avalancheIntro': 'Probémoslo con un valor de prueba P: hay una demostración abajo — haz clic en un bit de P para ver cómo cambia F(P) y qué celda de la matriz se consulta.',
      'sboxprep.arrow': '↓ S-box',
      'sboxprep.bridge': 'Esta tabla, ya construida, se usa sin cambios en cada ronda: simplemente introducimos el valor actual de X y leemos F(X).',
      'sboxprep.disclaimerTeaser': '⚠️ Las S-boxes del DES y el Magma también son más elaboradas',
      'sboxprep.disclaimer': 'Las S-boxes reales del DES son más elaboradas: hay ocho (una por cada bloque de 6 bits del bloque expandido), cada una convierte 6 bits en 4, y los criterios de su diseño (resistencia al criptoanálisis diferencial) se mantuvieron en secreto hasta finales de los 80. Aquí hay una sola caja 4→4, para que las ideas de permutación y efecto avalancha se vean con más claridad. El Magma también tiene ocho S-boxes de 4→4 bits, pero el GOST 28147-89 original no las fijaba — el conjunto exacto se trataba como secreto adicional y podía variar entre organismos; el estándar moderno GOST R 34.12-2015 («Magma») finalmente fijó un único conjunto oficial.',
      'rounds.h': 'Paso 7 — ronda de cifrado {r} de {tot}',
      'rounds.intro': 'Cada ronda tiene tres etapas: sumar la mitad derecha con la subclave, pasar el resultado por la S-box y sumarlo con la mitad izquierda — después las mitades se intercambian.',
      'rounds.stage.xor1': 'Etapa 1 de 3 — suma con la subclave',
      'rounds.stage.sbox': 'Etapa 2 de 3 — la S-box',
      'rounds.stage.xor2': 'Etapa 3 de 3 — suma con la mitad izquierda',
      'rounds.stage.done': 'Ronda completada',
      'rounds.a': 'Sumamos la mitad derecha <span class="highlight">R{p}</span> y la subclave de la ronda <span class="highlight-gold">K{r}</span> módulo 2 (la operación ⊕, «O exclusivo») — bit a bit:',
      'rounds.bitEq': 'Bit {i} de {tot}: {a} ⊕ {b} = ?',
      'rounds.bitEqDone': '{label} completo: {val}',
      'rounds.xor1.done': 'Resultado: X = R{p} ⊕ K{r} = {x}.',
      'rounds.sboxRecap': 'La S-box ya se preparó en el paso anterior — aquí solo buscamos en la matriz la celda de la entrada X = {x} (fila = 2 bits altos, columna = 2 bits bajos):',
      'rounds.gotF': 'Obtenemos F = {f} (binario {fbin}).',
      'rounds.c': 'Sumamos F con la mitad izquierda <span class="highlight">L{p}</span> de la misma manera, obteniendo la nueva mitad derecha <span class="highlight">R{r}</span> — de nuevo bit a bit:',
      'rounds.swap': '<span class="arrow-swap">⇄</span> Las mitades se intercambian: el antiguo R{p} pasa a ser el nuevo L{r}',
      'rounds.last': 'Esa fue la última ronda. Sigue el intercambio final de mitades y el texto cifrado listo.',
      'cipher.h': 'Paso 8 — el texto cifrado está listo',
      'cipher.p': 'Tras la última ronda las mitades se intercambian una vez más (el intercambio final estándar, como en el DES real; en el Magma el mismo efecto se logra no intercambiando las mitades en la última ronda, la 32) — precisamente por eso el descifrado usa el mismo mecanismo que el cifrado.',
      'cipher.lAfter': 'L (tras el intercambio)', 'cipher.rAfter': 'R (tras el intercambio)',
      'cipher.readout': 'Texto cifrado = <span>{v}</span>',
      'cipher.alice': 'A continuación, Alicia enviará este número a Bob por el canal abierto: es el siguiente paso. Sin la clave no revela nada del mensaje.',
      'dec.h': 'Paso 10 — Bob descifra',
      'dec.p': 'Bob tiene el texto cifrado <span class="highlight">{c}</span> y la misma clave secreta. Ejecuta la misma red de Feistel, pero toma las subclaves en orden inverso: K4, K3, K2, K1.',
      'dec.round': 'Ronda de descifrado {r} de {tot} — se usa la subclave <span class="highlight-gold">K{k}</span> (la misma de la ronda de cifrado homónima, solo que el orden es inverso).',
      'dec.newHalves': '⇄ → nuevas mitades',
      'dec.final': 'Tras el intercambio final de las mitades obtenemos el byte recuperado:',
      'dec.readout': '= <span>{rec}</span>, el mensaje original era <span>{orig}</span>',
      'dec.ok': '✅ ¡Coincide! La red de Feistel se descifró a sí misma — con el mismo esquema, solo que con las subclaves en orden inverso.',
      'dec.bad': '⚠️ No coincide — eso señalaría un error en la demo, no en la idea de Feistel.',
      'sum.h': '🎓 Lo esencial',
      'sum.p1': 'El truco central de la red de Feistel: <span class="highlight">la función F no tiene por qué ser reversible</span>. Dentro de una ronda la S-box puede ser tan compleja y «unidireccional» como se quiera — el descifrado funciona no porque F se pueda deshacer, sino porque <em>la propia estructura</em> — «divide, mezcla, intercambia» — es reversible si se aplican las claves en orden inverso.',
      'sum.p2': 'Horst Feistel incorporó esta idea al cifrado <span class="highlight-gold">Lucifer</span> en IBM (finales de los 60 – principios de los 70). Más tarde, Don Coppersmith ayudó a rediseñar las S-boxes para que el cifrado resistiera el criptoanálisis diferencial — un ataque que la comunidad científica redescubrió solo a finales de los 80. El Lucifer refinado se convirtió en el estándar <span class="highlight">DES</span> (1977), y la red de Feistel se sigue usando en decenas de cifrados. En la URSS, con el mismo principio se creó el GOST 28147-89 (adoptado en 1989); en 2015 su cifrado, con el nombre «Magma», pasó a formar parte del GOST R 34.12-2015 — el equivalente ruso del DES, todavía vigente allí.',
      'sum.disclaimerTeaser': '⚠️ Los cifrados reales (DES, Magma) son mucho más grandes',
      'sum.disclaimer': 'Este es un modelo muy simplificado: el Lucifer real trabajaba con bloques de 128 bits, varias S-boxes interconectadas y un calendario de claves mucho más serio (DES usa bloques de 64 bits y 16 rondas). Aquí hay un byte, una S-box y 4 rondas, para que puedas ver la idea con tus propios ojos. El Magma (GOST 28147-89 / GOST R 34.12-2015 de Rusia) usa exactamente esta misma idea de red de Feistel, solo que a una escala mucho mayor: un bloque de 64 bits, una clave de 256 bits y 32 rondas. Hay una diferencia: en el Magma la subclave se suma a la mitad derecha no con ⊕ bit a bit sino con una suma módulo 2³²; el resultado pasa por las S-boxes y se rota 11 bits a la izquierda.',
      'map.title': 'Mapa del cifrado',

      'sboxprep.demoSub': 'Un bit de entrada cambiado — varios bits de salida cambiados',
      'sboxprep.demoWhy': 'Por qué «avalancha»: igual que una bola de nieve pequeña puede desatar una avalancha entera, cambiar un solo bit de entrada dispara un cambio grande e impredecible en la salida. Eso es bueno para un cifrado: un cambio mínimo no da ninguna pista sobre qué cambiará en el resultado.',
      'sboxprep.demoInstr': 'Haz clic en cualquier bit de P abajo. La matriz muestra qué celda se consulta ahora (resaltado dorado sólido) y cuál se consultaba antes (punteado) — así se ve cómo cambiar un solo bit mueve la búsqueda a una celda completamente distinta.',

      'sboxprep.diffRow': 'El bit {bit} es uno de los dos primeros bits de P, y esos eligen la fila — por eso se movió la fila: {from} → {to}. F(P) cambió {n} de 4 bits.',

      'nav.lockXor': 'Para continuar, suma todos los bits con los botones del formulario.',
      'sboxprep.matrixHint': 'Cómo leerla: la fila son los 2 bits altos de la entrada x, la columna los 2 bajos y la celda contiene S(x). Ej.: x = 0110 → fila 01, columna 10 → S(x) = 11.',
      'x.head': '💡 ¿Qué está pasando aquí?',
      'x.more': 'Más detalles ▾',

      'x.textprep': 'Un cifrado trabaja con bits, no con letras: UTF-8 convierte cada carácter en 1–4 bytes. Ciframos uno de ellos.',
      'x.plain': 'Este es el byte que elegiste en el paso 1: el texto en claro que Alice envía a Bob.',
      'x.key': 'La clave secreta compartida tiene 8 bits. La genera el centro de claves y la envía a Alicia y a Bob. De ella saldrán las subclaves de las rondas.',
      'x.ks': 'Una clave → subclaves distintas: en la ronda r la clave se gira a la izquierda (r × 3) mod 8 bits y los 4 bits bajos son la subclave Kr. La fórmula está fijada de antemano y no depende de la clave.',
      'x.sbox': 'La S-box es una tabla fija de sustitución de 4→4 bits: parte del cifrado, no de la clave. Una buena es una permutación y muestra el efecto avalancha: cambiar un bit de entrada cambia varios bits de salida.',
      'x.rounds': 'Una ronda: R ⊕ K → S-box → ⊕ L → intercambio de mitades. Hacemos cuatro rondas seguidas.',
      'x.roundsFormula': 'Formalmente: L<sub>r</sub> = R<sub>r−1</sub>, R<sub>r</sub> = L<sub>r−1</sub> ⊕ S(R<sub>r−1</sub> ⊕ K<sub>r</sub>).',
      'x.cipher': 'Tras la última ronda las mitades se intercambian una vez más — por eso el descifrado usa el mismo esquema.',

      'x.sumIdea': 'F no tiene por qué ser invertible: lo es la estructura misma — «divide, mezcla, intercambia».',
      'x.sumHist': 'Feistel (IBM, 1971) → Lucifer → DES (1977). En la URSS, con el mismo principio nació el GOST 28147-89, hoy «Magma».',

      'info.short': 'El esquema de Feistel (IBM, 1971): se parte el bloque por la mitad y se mezclan las mitades con una clave una y otra vez. De él salieron Lucifer, DES y el Magma ruso (GOST).',

      'kd.h': 'Paso 4 — entrega de la clave',
      'x.kd': 'La clave la genera y la distribuye un tercero: el centro de claves; de las claves responde un órgano de protección criptográfica. Alicia y Bob reciben la misma clave por una vía protegida y nunca se la envían entre ellos.',
      'kd.p1': 'El punto más débil de un cifrado simétrico no es el algoritmo, sino la clave: el emisor y el receptor deben tener la misma, y nadie más debe tenerla. La clave no puede enviarse por el mismo canal que el mensaje: un espía obtendría ambas cosas.',
      'kd.p2': 'En Rusia el procedimiento lo fija la Instrucción n.º 152 de la FAPSI (2001), para los medios de protección criptográfica (SKZI) que protegen información de acceso restringido que no es secreto de Estado. Las claves las genera y distribuye un <b>órgano de protección criptográfica</b> (OKZ): una unidad de la organización, una empresa con licencia del FSB o incluso una sola persona designada. El OKZ elabora los documentos de clave, lleva un registro de cada ejemplar y los entrega a los usuarios en soportes de clave, por correo de valija oficial o servicio especial de comunicaciones, o en mano. La clave la carga en el equipo una persona autorizada: un empleado del OKZ o un usuario formado. Técnicamente las claves puede prepararlas un programa —el centro de claves o el centro de gestión de una red protegida—, pero de ellas responden personas. Cómo se genera una clave a partir del azar se muestra en el juego <a class="highlight" href="../cvk/index.html">«Centro de generación de claves»</a>.',

  // ===== Crypto core (Feistel network with final swap, DES-style) =====
  // Bijective 4-bit S-box inspired by the first row of DES S1, kept simple so the
  // encrypt/decrypt round trip is easy to verify by eye.
  const SBOX = [14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7];
  const ROUNDS = 4;

  function rotl8(x, n) { n = ((n % 8) + 8) % 8; return ((x << n) | (x >>> (8 - n))) & 0xFF; }
  function roundKeyNibble(masterKey, r) { return rotl8(masterKey, (r * 3) % 8) & 0xF; }
  function F(R4, K4) { return SBOX[(R4 ^ K4) & 0xF]; }

  // keyOrder: round numbers used to pull subkeys — [1,2,3,4] to encrypt, [4,3,2,1] to decrypt.
  function runFeistel(blockByte, masterKey, keyOrder) {
    let L = (blockByte >> 4) & 0xF;
    let R = blockByte & 0xF;
    const trace = [{ round: 0, L, R }];
    keyOrder.forEach((ri, idx) => {
      const K = roundKeyNibble(masterKey, ri);
      const X = (R ^ K) & 0xF;
      const Fv = F(R, K);
      const newL = R;
      const newR = (L ^ Fv) & 0xF;
      trace.push({ round: idx + 1, usedKeyIndex: ri, prevL: L, prevR: R, K, X, Fv, L: newL, R: newR });
      L = newL; R = newR;
    });
    const outByte = ((R << 4) | L) & 0xFF;
    return { outByte, trace, finalSwapped: { L: R, R: L } };
  }

  function bits8(byte) { return byte.toString(2).padStart(8, "0").split("").map(Number); }
  function bits4(nibble) { return nibble.toString(2).padStart(4, "0").split("").map(Number); }
  function bitsToByte(arr) { return arr.reduce((acc, b) => (acc << 1) | b, 0); }
  function bin4(n) { return n.toString(2).padStart(4, "0"); }
  function bin8(n) { return n.toString(2).padStart(8, "0"); }

  // Splits text into its UTF-8 bytes, grouped by character (so a byte can always be traced
  // back to the letter it came from) — Array.from() so multi-code-unit characters (emoji,
  // combining marks) stay a single "character" instead of splitting into surrogate halves.
  const utf8Encoder = new TextEncoder();
  function utf8Groups(text) {
    return Array.from(text).map(ch => ({ ch, bytes: Array.from(utf8Encoder.encode(ch)) }));
  }
  function utf8FlatBytes(groups) {

    groups.forEach((g, gi) => g.bytes.forEach(b => flat.push({ value: b, gi })));

  }
  // Pulls whichever byte is currently selected out of the typed text and makes it the
  // plaintext byte the rest of the demo works with.
  function syncPlaintextFromText() {
    const flat = utf8FlatBytes(utf8Groups(state.textInput));
    if (flat.length === 0) return;
    state.textByteIndex = Math.min(state.textByteIndex, flat.length - 1);
    state.plaintextBits = bits8(flat[state.textByteIndex].value);

  }

  // ===== State =====

    keyBits: bits8(105),
    phase: 0,
    round: 1,
    roundStage: 'xor1',   // 'xor1' -> 'sbox' -> 'xor2' -> 'done'
    revealed: 0,          // bits revealed so far in the current xor1/xor2 stage (0..4)
    xorPending: false,    // true for the suspense between asking for a bit and its value appearing
    xorAuto: false,       // true while the "finish automatically" button is running the remaining bits
    ksRound: 1,
    ksRevealed: { 1: false, 2: false, 3: false, 4: false },
    ksStep: { 1: 0, 2: 0, 3: 0, 4: 0 },

    decRound: 0,
    netBusy: false,       // a key / ciphertext packet is flying on the key-centre diagram

    txFor: null,          // which ciphertext value Alice has sent to Bob

  function keyByte() { return bitsToByte(state.keyBits); }

  // The S-box as a 4x4 matrix: the row is the input's two high bits, the column its two low

  // together with its row and column headers.

  function renderSbox(container, activeIndex, withBinary, prevIndex) {

        cell.title = `x = ${bin4(i)} (${i}) → ${SBOX[i]}`;

      }

  }

  function roundTrack(container, currentRound, totalRounds) {
    const track = el("div", "round-track");

  // ===== Phase renderers =====
  function renderIntro(panel) {
    panel.classList.add("intro-panel");
