  // ===== Square-and-multiply (shared by the RSA and signature games) =====
  // x^e mod n is never computed as e−1 multiplications: the exponent is read bit by bit from
  // the top, every next bit squares the running value, and a 1-bit also multiplies it by x.
  // 17 = 10001₂ -> 4 squarings + 1 multiplication instead of 16 multiplications.
  function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }
  function modpow(x, e, n) { let r = 1, b = x % n; while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e = Math.floor(e / 2); } return r; }
  function mxPlan(x, e, n) {
    const bits = e.toString(2).split("").map(Number);
    const steps = [];
    let v = x % n;
    for (let i = 1; i < bits.length; i++) {
      const sq = (v * v) % n;
      steps.push({ op: 'sq', bit: i, from: v, prod: v * v, to: sq });
      v = sq;
      if (bits[i]) { const m = (v * x) % n; steps.push({ op: 'mul', bit: i, from: v, prod: v * x, to: m }); v = m; }
    }
    return { bits, steps, result: v };
  }
  function mxText(s, x, n) {
    const q = Math.floor(s.prod / n);
    const lhs = s.op === 'sq' ? `${s.from}²` : `${s.from} × ${x}`;
    if (!state.showMath) return `${lhs} mod ${n}`;
    return `${lhs} = ${s.prod}` + (q ? ` = ${q}·${n} + ${s.to}` : "");
  }
  // The exponent ladder: after each action the running value is x^k for some k. A squaring
  // doubles k, a multiplication adds 1, and k climbs to the full exponent: 1 → 2 → 4 → 8 → 16 → 17.
  function expLadder(panel, plan, done, o) {
    const ks = [1];
    plan.steps.forEach(s => ks.push(s.op === 'sq' ? ks[ks.length - 1] * 2 : ks[ks.length - 1] + 1));
    const body = vizBox(panel, null, t('mx.ladderCap', { e: o.eName, v: o.e, k: plan.steps.length }), "ladder-viz");
    const lad = el("div", "ladder" + (ks.length > 9 ? " many" : ""));
    ks.forEach((k, i) => {
      const st = i < done ? "done" : i === done ? "cur" : "plan";
      const col = el("div", "ld-col " + st + (i ? " " + plan.steps[i - 1].op : ""));
      col.dataset.link = "mx" + i;
      col.appendChild(el("div", "ld-v", String(k)));
      const bar = el("div", "ld-bar");
      bar.style.height = Math.max(4, Math.round(k / o.e * 100)) + "%";
      const track = el("div", "ld-track");
      track.appendChild(bar);
      col.appendChild(track);
      col.appendChild(el("div", "ld-op", i ? (plan.steps[i - 1].op === 'sq' ? "×2" : "+1") : "1"));
      lad.appendChild(col);
    });
    body.appendChild(lad);
  }
  // o: { x, e, n, done, xName, eName, onStep(), onAuto(), onSkip(), resLabel, resCls }
  function renderModexp(panel, o) {
    const plan = mxPlan(o.x, o.e, o.n);
    const done = Math.min(o.done, plan.steps.length);
    const finished = done >= plan.steps.length;
    const curBit = finished ? -1 : (done === 0 ? 1 : plan.steps[done].bit);
    panel.appendChild(el("div", "ebit-cap", t('mx.bitsCap', { e: o.eName, v: o.e })));
    const eb = el("div", "ebits");
    plan.bits.forEach((b, i) => {
      const cls = i === 0 ? "done" : finished || i < curBit ? "done" : i === curBit ? "cur" : "";
      eb.appendChild(el("div", "ebit " + cls, String(b)));
    });
    panel.appendChild(eb);
    expLadder(panel, plan, done, o);
    mathToggle(panel);
    const log = el("div", "log");
    const startRow = el("div", "log-row" + (done === 0 ? " cur" : ""));
    startRow.dataset.link = "mx0";
    startRow.appendChild(el("span", "ln-n", "0"));
    startRow.appendChild(el("span", "ln-t", t('mx.start', { x: o.xName })));
    startRow.appendChild(el("span", "ln-r", "→ " + (o.x % o.n)));
    const first = Math.max(0, done - 4);
    if (first === 0) log.appendChild(startRow);
    else log.appendChild(el("div", "log-more", t('mx.more', { n: first + 1 })));
    for (let i = first; i < done; i++) {
      const s = plan.steps[i];
      const row = el("div", "log-row" + (i === done - 1 ? " cur new scroll-focus" : ""));
      row.dataset.link = "mx" + (i + 1);
      row.appendChild(el("span", "ln-n", String(i + 1)));
      row.appendChild(el("span", "ln-t", `<b>${t(s.op === 'sq' ? 'mx.sq' : 'mx.mul', { x: o.xName })}</b> · ${mxText(s, o.x, o.n)}`));
      row.appendChild(el("span", "ln-r", "→ " + s.to));
      log.appendChild(row);
    }
    if (!finished) {
      const s = plan.steps[done];
      const row = el("div", "log-row next");
      row.dataset.link = "mx" + (done + 1);
      row.appendChild(el("span", "ln-n", String(done + 1)));
      row.appendChild(el("span", "ln-t", t(s.op === 'sq' ? 'mx.nextSq' : 'mx.nextMul', { x: o.xName })));
      row.appendChild(el("span", "ln-r", "?"));
      log.appendChild(row);
    }
    panel.appendChild(log);
    panel.appendChild(el("div", "mx-count", t('mx.count', { k: done, tot: plan.steps.length, naive: o.e - 1 })));
    if (finished) {
      const v = el("div", "vals");
      v.appendChild(el("div", "val " + (o.resCls || "ok") + " pop", `<div class="vl">${o.resLabel}</div><div class="vv">${plan.result}</div>`));
      panel.appendChild(v);
    }
    if (!finished) actionRow(panel, [
      { label: t('mx.btn', { k: done + 1, tot: plan.steps.length }), onClick: o.onStep },
      { label: t('btn.auto'), cls: "btn-primary", onClick: o.onAuto },
      { label: t('btn.skip'), cls: "btn-ghost", onClick: o.onSkip },
    ]);
    return { plan, finished };
  }
  // Wires a modexp view to a counter in state[key].
  function modexpView(panel, key, x, e, n, extra) {
    const total = () => mxPlan(x, e, n).steps.length;
    return renderModexp(panel, Object.assign({
      x, e, n, done: state[key],
      onStep: () => { state[key]++; state.focusNext = true; render(); },
      onAuto: () => autoRun(() => { state[key]++; state.focusNext = true; }, () => state[key] >= total(), 380),
      onSkip: () => { state[key] = total(); render(); },
    }, extra));
  }

  // ===== RSA on the textbook key p = 3, q = 11 =====
  // Bob: primes p, q -> n = p·q = 33, φ = (p−1)(q−1) = 20, public e = 3, secret d = 7 (3·7 = 21 = 1·20 + 1).
  // Anyone snaps the padlock: c = m^e mod n; only Bob opens it: m = c^d mod n. The numbers are this small
  // so that every multiplication can be lit on a board of lamps (a product of two numbers below 33 is
  // at most 31·31 = 961 lamps, 30 rows of 33) and divided by 33 in front of the player. Only n = 33 works:
  // for 15, 21, 35 and 39 every e gives d = e (the padlock would be its own key), bigger n don't fit.

  function permViz(panel, dec, sel) {
    const n = N(), e = state.e, d = D();
    const body = vizBox(panel, t(dec ? 'perm.titleDec' : 'perm.title'), t('perm.cap'), "perm-viz");
    body.appendChild(el("p", "pm-lead", t(dec ? 'perm.leadDec' : 'perm.lead')));
    body.appendChild(el("div", "pm-row-lbl", t('perm.rowTop')));
    const wrap = body.appendChild(el("div", "perm-wrap", permSvg(dec, sel, n)));
    scrollTape(wrap, sel);
    body.appendChild(el("div", "pm-row-lbl bot", t('perm.rowBot')));
    const c = modpow(sel, e, n);
    body.appendChild(el("div", "perm-out", dec ? `${c} → ${c}<sup>${d}</sup> mod ${n} = <b class="s">${sel}</b> ✓` : `${sel} → ${sel}<sup>${e}</sup> mod ${n} = <b class="c">${c}</b>`));
    body.appendChild(el("p", "pm-why", dec ? t('perm.whyDec') : t('perm.' + calcKind(sel), calcVars(sel)) + " " + t('perm.whyTail')));
  }

  // ===== Idea: padlocks =====
  // Bob hands out open padlocks to everyone and keeps the only key. Anyone can snap a lock shut,
  // only the key opens it. Each click adds a row: locks handed out (Eve gets one too) → Alice locks
  // a box → the box travels → Bob opens it, Eve can't. Fresh items slide in / the shackle snaps.
  function lockSvg(closed, cls) {
    return `<svg class="lk ${closed ? "closed" : "open"} ${cls || ""}" viewBox="0 0 34 40" aria-hidden="true">` +
      `<g class="shackle"><path d="M10 19 V12 a7 7 0 0 1 14 0 V19"/></g>` +
      `<rect class="body" x="4" y="18" width="26" height="19" rx="4"/><circle class="hole" cx="17" cy="26" r="2.6"/><rect class="hole" x="16" y="27" width="2" height="5" rx="1"/></svg>`;
  }
  function boxSvg(closed, cls) {
    return `<span class="lk-box ${cls || ""}"><svg class="box" viewBox="0 0 46 34" aria-hidden="true"><rect x="2" y="8" width="42" height="24" rx="3"/><path d="M2 15 H44"/></svg>${lockSvg(closed, cls)}</span>`;
  }
  const keySvg = `<svg class="lk-key" viewBox="0 0 40 20" aria-hidden="true"><circle cx="9" cy="10" r="6.5"/><circle class="kh" cx="9" cy="10" r="2.2"/><path d="M15.5 10 H37 M31 10 V15 M35 10 V14"/></svg>`;
  function lockItem(svg, label, cls) { return `<div class="lk-item ${cls || ""}">${svg}<div class="lk-l">${label}</div></div>`; }
  function lockRow(grid, cells, title) {
    if (title) grid.appendChild(el("div", "lk-title", title));
    const row = el("div", "lk-row");
    cells.forEach(c => row.appendChild(el("div", "lk-cell", c || "")));
    grid.appendChild(row);
    return row;
  }
  function renderLocks(panel) {
    const L = state.locks, fresh = k => L.stage === k && L.fresh;
    h2(panel, 'locks.h');
    explainKeys(panel, 'locks');
    const grid = el("div", "lk-grid");
    lockRow(grid, [`<div class="who">${t('net.alice')}</div>`, `<div class="who eve">${t('locks.mid')}</div>`, `<div class="who">${t('net.bob')}</div>`]);
    lockRow(grid, ["", "", `<div class="lk-pair">${lockItem(`<span class="lk-stack">${lockSvg(false)}${lockSvg(false)}${lockSvg(false)}</span>`, t('locks.openLocks'))}${lockItem(keySvg, t('locks.key'), "key")}</div>`], t('locks.row0'));
    if (L.stage >= 1) lockRow(grid, [lockItem(lockSvg(false), t('locks.gotLock'), fresh(1) ? "in-r" : ""), lockItem(lockSvg(false), t('locks.eveLock'), "eve" + (fresh(1) ? " in-r" : "")), lockItem(keySvg, t('locks.keyStays'), "key")], t('locks.row1'));
    if (L.stage >= 2) lockRow(grid, [lockItem(boxSvg(true, fresh(2) ? "snap" : ""), t('locks.snapped'), "ok"), "", ""], t('locks.row2'));
    if (L.stage >= 3) lockRow(grid, ["", lockItem(boxSvg(true), t('locks.eveSees'), "eve" + (fresh(3) ? " in-l" : "")), lockItem(boxSvg(true), t('locks.gotBox'), fresh(3) ? "in-l" : "")], t('locks.row3'));
    if (L.stage >= 4) lockRow(grid, ["", lockItem(`<span class="lk-pair tight">${boxSvg(true)}${lockSvg(false)}</span><span class="lk-x">✗</span>`, t('locks.eveTry'), "eve bad"), lockItem(`<span class="lk-pair tight">${boxSvg(false, fresh(4) ? "unsnap" : "")}<span class="lk-letter${fresh(4) ? " in-up" : ""}">✉</span></span>`, t('locks.opened'), "ok")], t('locks.row4'));
    panel.appendChild(grid);
    L.fresh = false;
    if (L.stage >= 4) {
      note(panel, t('locks.done'), "done");
      panel.appendChild(el("div", "verdict bad pop", t('locks.eveFail')));
      warnKeys(panel, 'locks.real');
    }
    const labels = ['locks.btn0', 'locks.btn1', 'locks.btn2', 'locks.btn3'];
    actionRow(panel, [
      L.stage < 4 ? { label: t(labels[L.stage]), onClick: () => { L.stage++; L.fresh = true; state.focusNext = true; render(); } } : null,
      L.stage > 0 ? { label: t('locks.reset'), cls: "btn-ghost", onClick: () => { L.stage = 0; render(); } } : null,
    ]);
    if (L.stage < 4 && L.stage > 0) grid.lastChild.classList.add("scroll-focus");
  }

  // Bob makes his padlock (n, e) = (33, 3) and his key d = 7 from two secret primes.
  function renderKeys(panel) {
    h2(panel, 'keys.h');
    renderExplain(panel, "why", { short: t('x.keys'), full: [t('keys.p1'), t('keys.p2'), t('keys.p3')] });
    todo(panel, 'keys.todo');
    keyPicker(panel);
    const mk = el("div", "mk-row");
    mk.innerHTML = `<span class="cchip k">🔒 ${state.p}</span><span class="mk-op">×</span><span class="cchip k">🔒 ${state.q}</span><span class="mk-op">=</span><span class="cchip p">${N()}</span>`;
    panel.appendChild(mk);
    panel.appendChild(el("div", "mk-cap", t('keys.mul')));
    const pair = el("div", "mk-pair");
    pair.innerHTML = lockItem(lockSvg(false), `<b>(${N()}, ${state.e})</b><br>${t('keys.lock')}`, "mk-lock") + lockItem(keySvg, `<b>d = ${D()}</b><br>${t('keys.key')}`, "key mk-key");
    panel.appendChild(pair);
    panel.appendChild(el("div", "disclaimer info", t('keys.note')));
    const isDefault = state.p === KEY.p && state.q === KEY.q && state.e === KEY.e;
    actionRow(panel, [isDefault ? null : { label: t('keys.reset'), cls: "btn-ghost", onClick: () => setKey(KEY.p, KEY.q, KEY.e) }]);
  }
  // Bob's choice: p, then q (only pairs that make a real padlock), then e (only those with d ≠ e).
  function keyPicker(panel) {
    const box = el("div", "kp");
    const row = (label, values, cur, pick, ok) => {
      const r = el("div", "kp-row");
      r.appendChild(el("span", "kp-l", label));
      const pk = el("div", "picker kp-pick");
      values.forEach(v => {
        const b = el("button", "pick" + (v === cur ? " on" : ""), String(v));
        b.type = "button";
        b.disabled = !ok(v);
        b.addEventListener("click", () => { if (v !== cur) pick(v); });
        pk.appendChild(b);
      });
      r.appendChild(pk);
      box.appendChild(r);
    };
    const firstQ = p => BOB_PRIMES.find(q => eOptions(p, q).length);
    row("p", BOB_PRIMES, state.p, v => setKey(v, eOptions(v, state.q).length ? state.q : firstQ(v), state.e), v => !!firstQ(v));
    row("q", BOB_PRIMES, state.q, v => setKey(state.p, v, state.e), v => eOptions(state.p, v).length > 0);
    row("e", eOptions(state.p, state.q), state.e, v => setKey(state.p, state.q, v), () => true);
    box.appendChild(el("div", "kp-hint", t('keys.eHint')));
    const lg = el("div", "kp-legend");
    lg.appendChild(el("div", "kp-legend-h", t('keys.legendH')));
    lg.appendChild(el("div", "kp-legend-b", t('keys.legend')));
    box.appendChild(lg);
    panel.appendChild(box);
  }

  function renderPublish(panel) {
    h2(panel, 'pub.h');
    explainKeys(panel, 'pub');
    const done = published() && !state.netBusy, pop = popCls(), key = `(${N()}, ${state.e})`;
    renderNet(panel, {
      alice: done ? [{ cls: "p" + pop, text: key }] : [{ cls: "none", text: "?" }],
      bob: [{ cls: "p", text: key }, { cls: "k", text: `d = ${D()}` }],
      eve: done ? [{ cls: "p" + pop, text: key }, { cls: "no", text: "d = ?" }] : [{ cls: "none", text: "?" }],
    });
    note(panel, t(done ? 'pub.done' : state.netBusy ? 'pub.flying' : 'pub.waiting'), done ? "done" : "");
    actionRow(panel, [{
      label: t(done ? 'btn.netReplay' : 'pub.btn'), cls: done ? "btn-ghost" : "btn-gold",
      onClick: () => netSend([
        { from: "bob", to: "alice", cls: "p", label: key, dur: 1700 },
        { from: "bob", to: "eve", cls: "p", label: key, dur: 1500, delay: 200 },
      ], () => { state.pubFor = keyStr(); }),
    }]);
  }

  // The padlock (33, 3) is public, so anyone can run every number 0…32 through it and draw the tape:
  // one click = one number raised to the power e and divided by n, its line drops to the remainder.
  function renderTape(panel) {
    const n = N(), e = state.e, k = state.tape, done = k >= n;
    h2(panel, 'tape.h');
    explainKeys(panel, 'tape');
    todo(panel, 'tape.todo', { n });
    const body = vizBox(panel, t('tape.title', { n, e }), null, "perm-viz tape-viz");
    body.appendChild(el("div", "pm-row-lbl", t('perm.rowTop')));
    const wrap = body.appendChild(el("div", "perm-wrap", permSvg(false, k ? k - 1 : -1, k)));
    scrollTape(wrap, k - 1);
    body.appendChild(el("div", "pm-row-lbl bot", t('perm.rowBot')));
    if (k) {
      body.appendChild(el("div", "perm-out scroll-focus", t('tape.' + calcKind(k - 1).replace('why', 'calc'), calcVars(k - 1))));
    }
    panel.appendChild(el("div", "counter", `${k} / ${n}<small>${t('tape.count')}</small>`));
    if (done) {
      note(panel, t('tape.done'), "done");
      panel.appendChild(el("div", "disclaimer info", t('tape.fixed')));
    }
    actionRow(panel, [
      { label: t('tape.btn'), onClick: () => { state.tape++; state.focusNext = true; render(); }, disabled: done || !!state.auto },
      { label: t('tape.auto'), cls: "btn-primary", onClick: () => autoRun(() => { state.tape++; }, () => state.tape >= N(), 140), disabled: done },
      { label: t('btn.skip'), cls: "btn-ghost", live: true, onClick: () => skipNow(() => { state.tape = N(); }), disabled: done },
      k && !state.auto ? { label: t('tape.reset'), cls: "btn-ghost", onClick: () => { state.tape = 0; render(); } } : null,
    ]);
  }

  // Alice picks a number and snaps Bob's padlock on it: c = m³ mod 33, on the lamp board.
  function renderEncrypt(panel) {
    h2(panel, 'enc.h');
    explainKeys(panel, 'enc');
    todo(panel, 'enc.todo');
    panel.appendChild(el("div", "pick-label", t('enc.pick')));
    const box = el("div", "picker");
    msgs().forEach(v => {
      const b = el("button", "pick" + (state.m === v ? " on" : ""), String(v));
      b.type = "button";
      b.disabled = !!state.auto || state.busy;
      b.addEventListener("click", () => { if (state.m === v) return; state.m = v; resetFrom(); render(); });
      box.appendChild(b);
    });
    panel.appendChild(box);
    powWalk(panel, 'enc');
    // the verdict waits until the last remainder has landed
    if (encDone() && !state.busy && !state.auto) {
      note(panel, t('enc.done', { c: C(), m: M() }), "done");
      permViz(panel, false, M());
    }
    actionRow(panel, walkButtons('enc'));
  }

  // The ciphertext goes over the open channel; Eve takes a copy.
  function renderSend(panel) {
    h2(panel, 'send.h');
    explainKeys(panel, 'send');
    const done = sent() && !state.netBusy, pop = popCls(), key = `(${N()}, ${state.e})`;
    renderNet(panel, {
      alice: [{ cls: "p", text: key }, { cls: "k", text: `m = ${M()}` }, { cls: "c", text: `c = ${C()}` }],
      bob: [{ cls: "k", text: `d = ${D()}` }].concat(done ? [{ cls: "c" + pop, text: `c = ${C()}` }] : [{ cls: "none", text: "c = ?" }]),
      eve: [{ cls: "p", text: key }].concat(done ? [{ cls: "c" + pop, text: `c = ${C()}` }] : []).concat([{ cls: "no", text: "d = ?" }]),
    });
    note(panel, t(done ? 'tx.done' : state.netBusy ? 'tx.flying' : 'tx.waiting'), done ? "done" : "");
    actionRow(panel, [{
      label: t(done ? 'btn.netReplay' : 'tx.btn'), cls: done ? "btn-ghost" : "btn-gold",
      onClick: () => netSend([
        { from: "alice", to: "bob", cls: "c", label: `c=${C()}`, dur: 1900 },
        { fromMid: true, to: "eve", cls: "ghost", label: "c", dur: 700, delay: 950 },
      ], () => { state.txFor = `${keyStr()},${C()}`; }),
    }]);
  }

  // Bob opens with his key: m = c⁷ mod 33, the same way.
  function renderDecrypt(panel) {
    h2(panel, 'dec.h');
    explainKeys(panel, 'dec');
    todo(panel, 'dec.todo', { d: D() });
    powWalk(panel, 'dec');
    if (decDone() && !state.busy && !state.auto) {
      panel.appendChild(el("div", "verdict ok pop", t('dec.ok', { m: M() })));
      permViz(panel, true, M());
    }
    actionRow(panel, walkButtons('dec'));
  }

  // ===== Eve's attacks, drawn =====
  // Trial division: the number line 2…√n with every prime marked as Eve tests it.
  function divLine(panel) {
    const n = N(), R = Math.floor(Math.sqrt(n)), W = narrow() ? 360 : 600, L = 12, Rr = W - 12, pr = narrow() ? 6 : 7.5;
    const x = v => L + (v - 2) / (R - 2) * (Rr - L);
    const body = vizBox(panel, null, t('fac.lineCap', { r: R }), "div-viz");
    let s = `<svg class="divl" viewBox="0 0 ${W} 74" role="img" aria-label="2 … √n">`;
    s += `<line class="dl-axis" x1="${L}" y1="37" x2="${Rr}" y2="37"/>`;
    for (let v = 2; v <= R; v++) s += `<line class="dl-tick" x1="${x(v).toFixed(1)}" y1="33" x2="${x(v).toFixed(1)}" y2="41"/>`;
    s += `<text class="dl-end" x="${Rr}" y="17">√n ≈ ${R}</text>`;
    SMALL_PRIMES.filter(p => p <= R).forEach((p, i) => {
      const tried = i < state.eveDiv, hit = tried && n % p === 0, cur = i === state.eveDiv - 1;
      const cls = "dl-p" + (tried ? (hit ? " hit" : " miss") : "") + (cur ? " cur" : "");
      const cx = x(p).toFixed(1);
      s += `<g class="${cls}" data-link="fd${p}"><circle cx="${cx}" cy="37" r="${hit ? pr + 2.5 : pr}"/>`;
      if (tried) s += `<text class="dl-mk" x="${cx}" y="${hit ? 41.5 : 40.5}">${hit ? "✓" : "✗"}</text>`;
      s += `<text class="dl-n" x="${cx}" y="${i % 2 ? 66 : 17}">${p}</text></g>`;
    });
    body.appendChild(el("div", null, s + "</svg>"));
  }
  // Guessing: Eve's spotlight runs over the candidates x; each one is encrypted, and the result
  // jumps about on the lower line until it lands exactly on c.
  function spotLight(panel) {
    const n = N(), c = C(), cur = state.guess, found = guessFound(), W = narrow() ? 380 : 600, L = 12, Rr = W - 12;
    const x = v => L + v / (n - 1) * (Rr - L);
    const body = vizBox(panel, null, t('gs.spotCap'), "spot-viz");
    let s = `<svg class="spot${found ? " found" : ""}" viewBox="0 0 ${W} 112" role="img" aria-label="x → x^e mod n">`;
    s += `<defs><radialGradient id="spG"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
    s += `<text class="sp-lbl" x="${L}" y="14">x</text><text class="sp-lbl" x="${L}" y="108">x<tspan baseline-shift="super" font-size="8">${state.e}</tspan> mod ${n}</text>`;
    s += `<line class="sp-axis" x1="${L}" y1="30" x2="${Rr}" y2="30"/><line class="sp-axis" x1="${L}" y1="88" x2="${Rr}" y2="88"/>`;
    if (cur >= 2) s += `<rect class="sp-swept" x="${x(2).toFixed(1)}" y="26" width="${(x(cur) - x(2)).toFixed(1)}" height="8"/>`;
    s += `<g class="sp-c"><path d="M${x(c).toFixed(1)},92 l-6,10 h12 z"/><text x="${Math.min(Math.max(x(c), L + 30), Rr - 30).toFixed(1)}" y="111">c = ${c}</text></g>`;
    for (let g = Math.max(2, cur - 5); g <= cur && cur >= 2; g++) {
      const r = modpow(g, state.e, n), last = g === cur;
      s += `<line class="sp-beam${last ? " last" : ""}" x1="${x(g).toFixed(1)}" y1="30" x2="${x(r).toFixed(1)}" y2="88" style="opacity:${last ? 1 : 0.15 + (g - cur + 5) * 0.08}"/>`;
      if (last) {
        s += `<ellipse class="sp-glow" cx="${x(g).toFixed(1)}" cy="30" rx="26" ry="16" fill="url(#spG)"/>`;
        s += `<circle class="sp-dot" cx="${x(g).toFixed(1)}" cy="30" r="5"/><circle class="sp-dot" cx="${x(r).toFixed(1)}" cy="88" r="5"/>`;
        s += `<text class="sp-x" x="${Math.min(Math.max(x(g), L + 34), Rr - 34).toFixed(1)}" y="16">x = ${g}${r === c ? " ✓" : ""}</text>`;
      }
    }
    body.appendChild(el("div", null, s + "</svg>"));
  }

  function renderFactor(panel) {
    h2(panel, 'fac.h');
    explainKeys(panel, 'fac');
    const n = N();
    const v = vals(panel);
    val(v, "n", n, "public"); val(v, "e", state.e, "public"); val(v, "c", C(), "sent");
    panel.appendChild(el("div", "algo-title", t('fac.title', { n, r: Math.floor(Math.sqrt(n)) })));
    divLine(panel);
    const log = el("div", "log");
    const first = Math.max(0, state.eveDiv - 5);
    if (first > 0) log.appendChild(el("div", "log-more", t('fac.more', { n: first })));
    for (let i = first; i < state.eveDiv; i++) {
      const d = SMALL_PRIMES[i], hit = n % d === 0;
      const row = el("div", "log-row " + (hit ? "hit" : "miss") + (i === state.eveDiv - 1 ? " new scroll-focus" : ""));
      row.dataset.link = "fd" + d;
      row.appendChild(el("span", "ln-n", String(i + 1)));
      row.appendChild(el("span", "ln-t", `${n} / ${d} = ${hit ? n / d : (n / d).toFixed(2)}`));
      row.appendChild(el("span", "ln-r", hit ? "✓" : "✗"));
      log.appendChild(row);
    }
    panel.appendChild(log);
    if (eveFactored()) {
      const p = smallP(), q = n / p;
      panel.appendChild(el("div", "verdict bad pop", t('fac.found', { n, p, q, phi: PHI(), d: D(), m: M() })));
      panel.appendChild(el("div", "algo-title", t('fac.scaleTitle')));
      const tb = el("table", "scale");
      tb.innerHTML = `<tr><th>${t('fac.th1')}</th><th>${t('fac.th2')}</th><th>${t('fac.th3')}</th></tr>` +
        ['toy', 'r129', 'r768', 'r250', 'r2048'].map((k, i) => `<tr class="${i ? "" : "toy"}"><td>${t('fac.r.' + k, { n })}</td><td class="r">${t('fac.y.' + k)}</td><td>${t('fac.c.' + k)}</td></tr>`).join("");
      // size of n as a power of ten: RSA-129 has 129 digits, RSA-768 232, RSA-250 250, 2048 bits 617
      const exps = { toy: Math.log10(n), r129: 128.06, r768: 231.09, r250: 249.33, r2048: 2048 * Math.LOG10E * Math.LN2 };
      logBars(panel, {
        rows: ['toy', 'r129', 'r768', 'r250', 'r2048'].map(k => ({
          label: t('fac.r.' + k, { n }), exp: exps[k], toy: k === 'toy',
          value: k === 'toy' ? `n = ${n}` : `n ≈ 10<sup>${Math.floor(exps[k])}</sup>`,
          note: (t('fac.y.' + k) !== '—' ? t('fac.y.' + k) + ' · ' : '') + (k === 'r2048' ? '✓ ' : '✗ ') + t('fac.c.' + k),
        })),
        axis: t('fac.scaleAxis'), cap: t('fac.scaleCap'), table: tb,
      });
      warnKeys(panel, 'fac.real');
    }
    const step = () => { state.eveDiv++; state.focusNext = true; };
    actionRow(panel, [
      { label: t('fac.btn', { d: SMALL_PRIMES[state.eveDiv] || "" }), onClick: () => { step(); render(); }, disabled: eveFactored() },
      { label: t('btn.auto'), cls: "btn-primary", onClick: () => autoRun(step, eveFactored, 260), disabled: eveFactored() },
      { label: t('btn.skip'), cls: "btn-ghost", live: true, onClick: () => skipNow(() => { state.eveDiv = eveDivTarget(); }), disabled: eveFactored() },
    ]);
  }

  function renderGuess(panel) {
    h2(panel, 'gs.h');
    explainKeys(panel, 'gs');
    const n = N(), c = C();
    panel.appendChild(el("div", "eq", `<span class="x">x</span><sup>${state.e}</sup> mod ${n} = <span class="c">${c}</span> ?<small>${t('gs.eq')}</small>`));
    const cur = state.guess, found = guessFound();
    spotLight(panel);
    const shown = [];
    for (let x = Math.max(2, cur - 3); x <= cur; x++) shown.push(x);
    const log = el("div", "log");
    if (cur >= 2) shown.forEach(x => {
      const r = modpow(x, state.e, n), hit = r === c;
      const row = el("div", "log-row " + (hit ? "hit" : "miss") + (x === cur ? " scroll-focus" : ""));
      row.appendChild(el("span", "ln-n", "x"));
      row.appendChild(el("span", "ln-t", `${x}<sup>${state.e}</sup> mod ${n} = ${r}`));
      row.appendChild(el("span", "ln-r", hit ? "✓" : "✗"));
      log.appendChild(row);
    });
    panel.appendChild(log);
    panel.appendChild(el("div", "counter", `${Math.max(0, cur - 1)}<small>${t('gs.tries')}</small>`));
    if (found) {
      panel.appendChild(el("div", "verdict bad pop", t('gs.found', { m: M(), k: M() - 1 })));
      warnKeys(panel, 'gs.real');
    }
    actionRow(panel, [
      { label: t('gs.btn'), onClick: () => { state.guess++; state.focusNext = true; render(); }, disabled: found },
      { label: t('gs.auto'), cls: "btn-primary", onClick: () => autoRun(() => { state.guess = Math.min(M(), state.guess + Math.max(1, Math.ceil(M() / 60))); }, guessFound, 40), disabled: found },
      { label: t('btn.skip'), cls: "btn-ghost", live: true, onClick: () => skipNow(() => { state.guess = M(); }), disabled: found },
    ]);
  }

  function renderSummary(panel) {
    h2(panel, 'sum.h');
    renderExplain(panel, "idea", { head: t('x.headIdea'), short: t('x.sumIdea'), full: [t('sum.p1')] });
    renderExplain(panel, "history", { head: t('x.headHist'), short: t('x.sumHist'), full: [t('sum.p2'), t('sum.p3')] });
    panel.appendChild(el("div", "disclaimer ru", t('sum.ru')));
    warnKeys(panel, 'sum.real');
    panel.appendChild(el("div", "disclaimer info", t('sum.next')));
    summaryButtons(panel, () => { state.phase = 1; state.locks.stage = 0; state.tape = 0; resetFrom(); state.pubFor = null; });
  }

  const PHASES = [
    { name: 'intro', render: renderIntro },
    { name: 'locks', sec: 'idea', render: renderLocks, lock: () => state.locks.stage < 4 ? 'nav.lockLocks' : null,
      map: (b) => mapDetail(b, t('map.locks.' + state.locks.stage)) },
    { name: 'keys', sec: 'proto', render: renderKeys, map: (b) => mapDetail(b, `(${N()}, ${state.e}) · d = 🔒`) },
    { name: 'publish', sec: 'proto', render: renderPublish, lock: () => published() ? null : 'nav.lockPub',
      map: (b) => mapDetail(b, published() ? t('map.pubDone') : t('map.pubWait')) },
    { name: 'tape', sec: 'proto', render: renderTape, lock: () => state.tape >= N() ? null : 'nav.lockTape',
      map: (b) => mapDetail(b, state.tape >= N() ? t('map.tapeDone') : `${state.tape} / ${N()}`) },
    { name: 'encrypt', sec: 'proto', render: renderEncrypt, lock: () => encDone() ? null : 'nav.lockMx',
      map: (b) => mapDetail(b, encDone() ? `${M()} → c = ${C()}` : t('map.mx', { k: Math.ceil(stage('enc') / 2) })) },
    { name: 'send', sec: 'proto', render: renderSend, lock: () => sent() ? null : 'nav.lockTx',
      map: (b) => mapDetail(b, sent() ? t('map.txDone', { c: C() }) : t('map.txWait')) },
    { name: 'decrypt', sec: 'proto', render: renderDecrypt, lock: () => decDone() ? null : 'nav.lockMx',
      map: (b) => mapDetail(b, decDone() ? t('map.decDone', { m: M() }) : t('map.mx', { k: Math.ceil(stage('dec') / 2) })) },
    { name: 'factor', sec: 'attack', render: renderFactor, lock: () => eveFactored() ? null : 'nav.lockFac',
      map: (b) => mapDetail(b, eveFactored() ? `${N()} = ${smallP()} × ${N() / smallP()}` : t('map.facWait')) },
    { name: 'guess', sec: 'attack', render: renderGuess, lock: () => guessFound() ? null : 'nav.lockGuess',
      map: (b) => mapDetail(b, guessFound() ? t('map.gsDone', { m: M() }) : t('map.gsWait')) },
    { name: 'summary', sec: 'end', render: renderSummary },
  ];

  // ===== Engine (shared by the public-key games: Diffie–Hellman, RSA, signatures) =====
  // Same skeleton as the Feistel and SPN games: a fixed-height step card on the left, the
  // protocol map on the right, Back/Next below, "💡 What's going on?" accordions inside each
  // step. A game supplies I18N (with the common strings patched in), `state` and PHASES = [{ name, render(panel),
  // lock() -> hint key | null, map(body, status), enter(), enterBack() }, ...]; phase 0 is the
  // intro and is left off the map.

  let currentLang = 'ru';
  function t(key, vars) {
    const dict = I18N[currentLang] || I18N.ru;
    let str = dict[key] !== undefined ? dict[key] : (I18N.ru[key] !== undefined ? I18N.ru[key] : key);
    // a game may supply tVars(): the current numbers (n, e, …) every string can use without passing them
    const base = typeof tVars === "function" ? tVars() : null;
    const all = base ? Object.assign({}, base, vars) : vars;
    if (all) for (const k in all) if (str.indexOf('{' + k + '}') >= 0) str = str.split('{' + k + '}').join(all[k]);
    return str;
  }
  function applyLanguage(lang) {
    if (!I18N[lang]) lang = 'ru';
    currentLang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = t('meta.title');
    document.querySelectorAll('[data-i18n]').forEach(e => { e.innerHTML = t(e.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.langBtn === lang); });
    try { localStorage.setItem('ludusLang', lang); } catch (e) {}
    const expandBtn = document.getElementById('mapExpand');
    expandBtn.title = t('map.expandTitle'); expandBtn.setAttribute('aria-label', t('map.expandTitle'));
    renderInfo();
    render();
  }
  function initLanguage() {
    let saved = null;
    saved = 'zh';
    if (!saved) { const browserLang = (navigator.language || 'ru').slice(0, 2); saved = I18N[browserLang] ? browserLang : 'ru'; }
    applyLanguage(saved);
  }

  // ===== Small helpers =====
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function esc(str) { return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function curPhase() { return PHASES[state.phase]; }
  let animToken = 0;
  function later(ms, fn) { const tok = animToken; setTimeout(() => { if (tok === animToken) fn(); }, reducedMotion() ? Math.min(ms, 30) : ms); }
  function cancelAnims() { animToken++; state.busy = false; state.auto = null; }
  // "Show the result right away": stops any auto-run or animation and jumps to the end at once
  function skipNow(finish) { cancelAnims(); finish(); state.fx = null; render(); }
  function reducedMotion() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  // Runs stepFn() every `ms` until done() is true; the nav stays locked meanwhile.
  function autoRun(stepFn, done, ms) {
    if (state.auto || done()) return;
    state.auto = true;
    const tick = () => {
      if (done()) { state.auto = null; render(); return; }
      stepFn(); render();
      later(ms || 260, tick);
    };
    tick();
  }
  function ensureVisible(node) {
    setTimeout(() => {
      const holder = node.closest(".panel");
      if (!holder) return;
      const h = holder.getBoundingClientRect(), n = node.getBoundingClientRect();
      if (n.bottom > h.bottom) holder.scrollTop += n.bottom - h.bottom + 8;
    }, 320);
  }
  // A glowing spark flying from one element to another.
  function spark(from, to, delay, dur) {
    if (!from || !to || reducedMotion() || typeof document.body.animate !== "function") return;
    const c = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
    const s = c(from.getBoundingClientRect()), d = c(to.getBoundingClientRect());
    const sp = el("div", "avalanche-spark");
    sp.style.left = s.x + "px"; sp.style.top = s.y + "px";
    document.body.appendChild(sp);
    try {
      const a = sp.animate([
        { transform: "translate(-50%, -50%) scale(0.6)", opacity: 0.95 },
        { transform: `translate(calc(-50% + ${d.x - s.x}px), calc(-50% + ${d.y - s.y}px)) scale(0.4)`, opacity: 0.15 },
      ], { duration: dur || 500, delay: delay || 0, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
      a.onfinish = () => sp.remove(); a.oncancel = () => sp.remove();
    } catch (e) { sp.remove(); }
  }

  // ===== Visualizations: a picture with an optional title and a one-line caption =====
  function vizBox(container, title, cap, cls) {
    const box = el("figure", "viz" + (cls ? " " + cls : ""));
    if (title) box.appendChild(el("div", "viz-title", title));
    const body = el("div", "viz-body");
    box.appendChild(body);
    if (cap) box.appendChild(el("figcaption", "viz-cap", cap));
    container.appendChild(box);
    return body;
  }
  // Linked highlight: everything in the step card that shares a data-link token lights up
  // together (a row of arithmetic and its element in the picture). Hover on a desktop, tap to
  // pin on a phone; the pin survives re-renders of the same step.
  let linkPinned = null;
  function linkSet(root, keys, on) {
    keys.split(" ").forEach(k => root.querySelectorAll(`[data-link~="${k}"]`).forEach(x => x.classList.toggle("lnk", on)));
  }
  function linkApplyPinned() { if (linkPinned) linkSet(document.getElementById("stepPanel"), linkPinned, true); }
  (function () {
    const root = document.getElementById("stepPanel");
    const target = e => { const x = e.target.closest && e.target.closest("[data-link]"); return x && root.contains(x) ? x : null; };
    root.addEventListener("pointerover", e => { const x = target(e); if (x && e.pointerType !== "touch") linkSet(root, x.dataset.link, true); });
    root.addEventListener("pointerout", e => { const x = target(e); if (x && e.pointerType !== "touch") { linkSet(root, x.dataset.link, false); linkApplyPinned(); } });
    root.addEventListener("click", e => {
      const x = target(e);
      if (!x || e.target.closest("button")) return;
      if (linkPinned) linkSet(root, linkPinned, false);
      linkPinned = linkPinned === x.dataset.link ? null : x.dataset.link;
      linkApplyPinned();
    });
  })();

  // Scale chart: one horizontal bar per row on a log scale (powers of ten), the toy example of
  // the game highlighted, the value and a note written out next to each bar. The original
  // table stays one click away. o: { rows: [{ label, value, note, exp, toy }], axis, cap, table }
  function logBars(panel, o) {
    const body = vizBox(panel, null, o.cap, "lb-viz");
    const step = 100, max = Math.ceil(Math.max.apply(null, o.rows.map(r => r.exp)) / step) * step;
    const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
    const grid = ticks.map(v => `<i style="left:${v / max * 100}%"></i>`).join("");
    const chart = el("div", "lb");
    o.rows.forEach(r => {
      const row = el("div", "lb-row" + (r.toy ? " toy" : ""));
      row.innerHTML = `<div class="lb-head"><span class="lb-l">${r.label}</span><span class="lb-v">${r.value}</span></div>` +
        `<div class="lb-track">${grid}<div class="lb-bar" style="width:${Math.max(0.6, r.exp / max * 100).toFixed(2)}%"></div></div>` +
        (r.note ? `<div class="lb-note">${r.note}</div>` : "");
      row.title = `${r.label.replace(/<[^>]+>/g, "")}: ${r.value.replace(/<sup>/g, "^").replace(/<[^>]+>/g, "")}`;
      chart.appendChild(row);
    });
    chart.appendChild(el("div", "lb-axis", ticks.map(v => `<span style="left:${v / max * 100}%">10<sup>${v}</sup></span>`).join("")));
    chart.appendChild(el("div", "lb-axis-t", o.axis));
    body.appendChild(chart);
    const tg = el("div", "math-toggle");
    const b = el("button", "math-btn", t(state.scaleTable ? 'x.tableHide' : 'x.tableShow'));
    b.type = "button";
    b.addEventListener("click", () => { state.scaleTable = !state.scaleTable; render(); });
    tg.appendChild(b);
    body.appendChild(tg);
    if (state.scaleTable) body.appendChild(o.table);
  }

  // ===== Explanation accordions =====
  function detailBlock(shortHtml, fullList, key) {
    const body = el("div", "explain-body");
    body.appendChild(el("div", "explain-short", shortHtml));
    if (!fullList || !fullList.length) return body;
    const wrap = el("div", "detail" + (state.more[key] ? " full" : ""));
    const more = el("button", "explain-more", t(state.more[key] ? 'x.less' : 'x.more'));
    more.type = "button";
    const coll = el("div", "x-collapse"), inner = el("div", "x-inner"), full = el("div", "explain-full");
    fullList.forEach(h => full.appendChild(el("p", null, h)));
    inner.appendChild(full); coll.appendChild(inner);
    more.addEventListener("click", (e) => {
      e.stopPropagation();
      const on = wrap.classList.toggle("full");
      state.more[key] = on;
      more.textContent = t(on ? 'x.less' : 'x.more');
      if (on) ensureVisible(wrap);
    });
    wrap.appendChild(more); wrap.appendChild(coll);
    body.appendChild(wrap);
    return body;
  }
  // opts: { head, short, full: [html...], kind: 'warn' | undefined }
  function renderExplain(panel, id, opts) {
    const key = curPhase().name + ":" + id;
    const box = el("div", "explain" + (opts.kind === "warn" ? " warn" : "") + (state.explain[key] ? " open" : ""));
    const head = el("div", "explain-head");
    head.setAttribute("role", "button"); head.tabIndex = 0;
    head.setAttribute("aria-expanded", state.explain[key] ? "true" : "false");
    head.appendChild(el("span", null, opts.head || t('x.head')));
    head.appendChild(el("span", "explain-arrow", "▸"));
    const coll = el("div", "x-collapse"), inner = el("div", "x-inner");
    inner.appendChild(detailBlock(opts.short, opts.full, key + ":more"));
    coll.appendChild(inner);
    const toggle = () => {
      const on = box.classList.toggle("open");
      state.explain[key] = on;
      head.setAttribute("aria-expanded", on ? "true" : "false");
      if (on) ensureVisible(box);
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    box.appendChild(head); box.appendChild(coll);
    panel.appendChild(box);
  }
  // A short "what's happening" box built from i18n keys: x.<name> (gist) and <name>.p1.. (full).
  function explainKeys(panel, name, id, kind) {
    const full = [];
    for (let i = 1; I18N.ru[name + '.p' + i] !== undefined; i++) full.push(t(name + '.p' + i));
    renderExplain(panel, id || "why", { head: kind === 'warn' ? t(name + '.teaser') : t('x.head'), short: t(kind === 'warn' ? name + '.short' : 'x.' + name), full, kind });
  }
  function warnKeys(panel, base, id) {
    const full = [];
    for (let i = 1; I18N.ru[base + i] !== undefined; i++) full.push(t(base + i));
    renderExplain(panel, id || base, { head: t(base + 'Teaser'), short: t(base + 'Short'), full, kind: "warn" });
  }
  function renderInfo() {
    const inner = document.getElementById("infoInner");
    inner.innerHTML = "";
    const full = [];
    for (let i = 1; I18N.ru['info.p' + i] !== undefined; i++) full.push(t('info.p' + i));
    inner.appendChild(detailBlock(t('info.short'), full, "info"));
  }
  // A row of action buttons stuck to the bottom of the step card.
  // list: [{ label, cls: 'btn-gold' | 'btn-primary' | 'btn-ghost', onClick, disabled }]
  function actionRow(panel, list, sticky) {
    const row = el("div", "btn-row" + (sticky === false ? "" : " sticky-actions"));
    // A button that is disabled by its own logic (its job is done) is left out entirely, so a
    // finished step doesn't keep a row of dead buttons over its result.
    list = list.filter(b => b && !b.disabled);
    if (!list.length) return null;
    list.forEach(b => {
      const x = el("button", "btn " + (b.cls || "btn-gold"), b.label);
      x.type = "button";
      // a `live` button (e.g. "show the result right away") stays usable while an auto-run plays
      x.disabled = b.live ? !!state.netBusy : state.busy || !!state.auto || state.netBusy;
      if (b.live) {
        // during an auto-run the card is redrawn every few dozen ms, so a click (press + release on
        // the same button) would often get lost: a live button acts already on the press
        let fired = false;
        const go = e => { if (fired) return; fired = true; e.preventDefault(); b.onClick(e); };
        x.addEventListener("pointerdown", e => { if (e.button === 0) go(e); });
        x.addEventListener("click", go);
      } else x.addEventListener("click", b.onClick);
      row.appendChild(x);
    });
    panel.appendChild(row);
    return row;
  }
  // Full arithmetic (the division with remainder) is hidden by default: rows read
  // "8 × 5 mod 23 → 17". The toggle reveals "8 × 5 = 40 = 1·23 + 17".
  function mathToggle(panel) {
    const row = el("div", "math-toggle");
    const b = el("button", "math-btn", t(state.showMath ? 'x.mathHide' : 'x.mathShow'));
    b.type = "button";
    b.addEventListener("click", () => { state.showMath = !state.showMath; render(); });
    row.appendChild(b);
    panel.appendChild(row);
  }
  function h2(panel, key, vars) { panel.appendChild(el("h2", null, t(key, vars))); }
  function para(panel, key, vars, cls) { panel.appendChild(el("p", cls || null, t(key, vars))); }
  function note(panel, html, kind) { panel.appendChild(el("div", "bit-equation" + (kind ? " " + kind : ""), html)); }

  // ===== Network diagram: Alice, Bob, Eve and (optionally) a party on top =====
  // 'listen': Eve taps the open channel from below. 'middle': Eve sits ON the channel, so
  // every packet goes through her. The top node is either the crossed-out key centre of the
  // symmetric games (ghost) or a certificate authority.
  const NET_LAYOUTS = {
    listen: { alice: [15, 52], bob: [85, 52], eve: [50, 84], top: [50, 17] },
    middle: { alice: [13, 42], bob: [87, 42], eve: [50, 42], top: [50, 17] },
    flat: { alice: [15, 34], bob: [85, 34], eve: [50, 76], top: [50, 10] },   // 'listen' without a top node
  };
  // o: { layout, top: { icon, name, sub, ghost }, alice|bob|eve|topChips: [{ cls, text }], label }
  function renderNet(container, o) {
    const lay = (o.layout || 'listen') === 'listen' && !o.top ? 'flat' : (o.layout || 'listen');
    const L = NET_LAYOUTS[lay];
    const net = el("div", "net net-" + lay + (o.top && o.top.ghost ? " has-ghost" : ""));
    net.dataset.layout = lay;
    const line = (a, b, cls) => `<line class="ln ${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
    let svg = '<svg class="net-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">';
    if (o.top) svg += line(L.top, L.alice, o.top.ghost ? "ln-ghost" : "ln-key") + line(L.top, L.bob, o.top.ghost ? "ln-ghost" : "ln-key");
    if (lay !== 'middle') svg += line(L.alice, L.bob, "ln-open") + line([50, L.alice[1]], L.eve, "ln-eve");
    else svg += line(L.alice, L.eve, "ln-open ln-mitm") + line(L.eve, L.bob, "ln-open ln-mitm");
    net.innerHTML = svg + '</svg>';
    if (o.label !== false) {
      const l = el("div", "net-lbl open", o.label || t('net.openCh'));
      l.style.left = (lay === 'middle' ? 31 : 50) + "%"; l.style.top = (L.alice[1] - 7) + "%";
      net.appendChild(l);
    }
    const node = (id, icon, name, sub, extra) => {
      const n = el("div", "net-node nn-" + id + (extra ? " " + extra : ""));
      n.dataset.node = id;
      n.style.left = L[id][0] + "%"; n.style.top = L[id][1] + "%";
      n.innerHTML = `<div class="nn-icon">${icon}</div><div class="nn-name">${name}</div>` + (sub ? `<div class="nn-sub">${sub}</div>` : "");
      const slots = el("div", "nn-slots");
      (o[id === 'top' ? 'topChips' : id] || []).forEach(c => slots.appendChild(el("span", "nn-chip " + c.cls, c.text)));
      n.appendChild(slots);
      net.appendChild(n);
    };
    if (o.top) node("top", o.top.icon, o.top.name, o.top.sub, o.top.ghost ? "ghost" : "ca");
    node("alice", t('net.aliceIcon'), t('net.alice'));
    node("bob", t('net.bobIcon'), t('net.bob'));
    node("eve", t('net.eveIcon'), t('net.eve'), null, lay === 'middle' ? "active" : "");
    container.appendChild(net);
    return net;
  }
  // packets: [{ from, to, fromMid, cls, label, dur, delay }]
  function netFly(list, onDone) {
    const net = document.querySelector(".net");
    let end = 0;
    if (net && !reducedMotion()) {
      const L = NET_LAYOUTS[net.dataset.layout];
      const r0 = net.getBoundingClientRect();
      const at = id => { const r = net.querySelector(`[data-node="${id}"] .nn-icon`).getBoundingClientRect(); return { x: r.left + r.width / 2 - r0.left, y: r.top + r.height / 2 - r0.top }; };
      list.forEach(p => {
        const a = p.fromMid ? { x: r0.width * 0.5, y: r0.height * L.alice[1] / 100 } : at(p.from), b = at(p.to);
        const d = el("div", "net-packet " + p.cls, p.label);
        d.style.left = a.x + "px"; d.style.top = a.y + "px";
        net.appendChild(d);
        end = Math.max(end, (p.delay || 0) + p.dur);
        if (typeof d.animate !== "function") { d.remove(); return; }
        const move = `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px))`;
        const anim = d.animate([
          { transform: "translate(-50%, -50%) scale(0.5)", opacity: 0 },
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.12 },
          { transform: move + " scale(1)", opacity: 1, offset: 0.9 },
          { transform: move + " scale(0.4)", opacity: 0 },
        ], { duration: p.dur, delay: p.delay || 0, easing: "ease-in-out", fill: "forwards" });
        anim.onfinish = anim.oncancel = () => d.remove();
      });
    }
    setTimeout(onDone, reducedMotion() ? 30 : end + 60);
  }
  function netSend(packets, onArrive) {
    if (state.netBusy) return;
    const name = curPhase().name;
    state.netBusy = true;
    render();
    requestAnimationFrame(() => netFly(packets, () => {
      state.netBusy = false;
      if (curPhase().name === name) { onArrive(); state.netPop = true; }
      render();
    }));
  }
  function popCls() { const p = state.netPop ? " pop" : ""; return p; }

  // ===== Sections =====
  // The steps are not one sequence: an idea on a simple example (not part of the protocol), the
  // protocol itself, Eve's attacks on it and, where there is one, the defence. Each phase names
  // its section in `sec`; the intro has none and the summary is 'end'.
  function secInfo(idx) {
    const sec = PHASES[idx].sec;
    if (!sec || sec === 'end') return null;
    const same = PHASES.map((p, i) => i).filter(i => PHASES[i].sec === sec);
    return { sec, i: same.indexOf(idx) + 1, n: same.length };
  }
  // Only the protocol is a sequence of steps, so only its phases are numbered ("Step 2 — …").
  function stepNo(idx) { const si = secInfo(idx); return si && si.sec === 'proto' ? si.i : null; }
  function phaseTitle(idx) { const n = stepNo(idx), name = t('phase.' + PHASES[idx].name); return n ? t('x.stepN', { n }) + name : name; }
  function secBadge(panel) {
    const si = secInfo(state.phase);
    if (!si) return;
    panel.insertBefore(el("div", "sec-badge sec-" + si.sec, `<span>${t('sec.' + si.sec)}</span>` + (si.sec === 'proto' ? `<b>${t('x.stepOf', { i: si.i, n: si.n })}</b>` : "")), panel.firstChild);
    const n = stepNo(state.phase), head = panel.querySelector("h2");
    if (n && head) head.textContent = t('x.stepN', { n }) + head.textContent;
  }

  // ===== Navigation =====
  function nextLock() {
    if (state.busy || state.auto || state.netBusy) return "busy";
    const ph = curPhase();
    return ph.lock ? ph.lock() : null;
  }
  function goNext() {
    if (nextLock() || state.phase >= PHASES.length - 1) return;
    cancelAnims();
    state.phase++;
    if (curPhase().enter) curPhase().enter();
    render();
  }
  function goBack() {
    if (state.busy || state.auto || state.netBusy || state.phase === 0) return;
    cancelAnims();
    state.phase--;
    if (curPhase().enterBack) curPhase().enterBack();
    render();
  }
  // After Next/Back the step card and the Back/Next row should be on screen together: scroll the
  // window to the top of the screen (the header above it scrolls away).
  function showGameWindow() {
    const g = document.querySelector(".main-layout"), r = g.getBoundingClientRect();
    if (r.top < 0 || r.bottom > window.innerHeight) g.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function renderNav(nav) {
    nav.innerHTML = "";
    const backBtn = el("button", "btn btn-ghost nav-back", t('btn.back'));
    backBtn.disabled = state.phase === 0 || state.busy || !!state.auto || state.netBusy;
    backBtn.addEventListener("click", () => { goBack(); showGameWindow(); });
    nav.appendChild(backBtn);
    if (state.phase < PHASES.length - 1) {
      const nextBtn = el("button", "btn btn-primary nav-next", t('btn.next'));
      const lock = nextLock();
      nextBtn.disabled = !!lock;
      nextBtn.addEventListener("click", () => { goNext(); showGameWindow(); });
      nav.appendChild(nextBtn);
      if (lock && lock !== "busy") nav.appendChild(el("div", "nav-hint", t(lock)));
    }
  }
  function renderDots() {
    const dots = document.getElementById("stepDots");
    dots.innerHTML = "";
    let grp = null, last;
    PHASES.forEach((p, i) => {
      if (!grp || p.sec !== last) { grp = el("div", "dot-grp" + (p.sec ? " sec-" + p.sec : "")); dots.appendChild(grp); last = p.sec; }
      grp.appendChild(el("div", "step-dot" + (i < state.phase ? " done" : i === state.phase ? " current" : "")));
    });
    document.getElementById("stepLabel").textContent = phaseTitle(state.phase);
  }

  // ===== Side map =====
  function mapNodes() { return PHASES.map((p, idx) => ({ p, idx })).filter(n => n.idx > 0); }
  function nodeStatus(n) { return state.phase < n.idx ? 'upcoming' : state.phase > n.idx ? 'done' : 'current'; }
  function jumpTo(idx) {
    if (idx === state.phase || state.busy || state.auto || state.netBusy) return;
    cancelAnims();
    state.phase = idx;
    if (curPhase().enterBack) curPhase().enterBack();
    render();
  }
  function mapDetail(body, text) { body.appendChild(el("div", "map-detail", text)); }
  let lastMapFocus = -1, mapGlideUntil = 0;
  function renderMap() {
    const body = document.getElementById("mapBody");
    const prevTop = body.scrollTop;
    body.innerHTML = "";
    let focusRow = null, focusIdx = -1, grp = null, lastSec;
    const nodes = mapNodes();
    nodes.forEach((n, i) => {
      const sec = n.p.sec;
      if (sec !== lastSec) {
        grp = el("div", "map-group sec-" + (sec || "none"));
        if (sec && sec !== 'end') grp.appendChild(el("div", "map-sec", t('sec.' + sec)));
        body.appendChild(grp);
        lastSec = sec;
      }
      const status = nodeStatus(n);
      const row = el("div", "map-node " + status);
      const dotCol = el("div", "map-dot-col");
      dotCol.appendChild(el("div", "map-dot"));
      if (i < nodes.length - 1 && nodes[i + 1].p.sec === sec) dotCol.appendChild(el("div", "map-line"));
      row.appendChild(dotCol);
      const b = el("div", "map-body");
      b.appendChild(el("div", "map-label", phaseTitle(n.idx)));
      if (status !== 'upcoming' && n.p.map) n.p.map(b, status);
      row.appendChild(b);
      if (status === 'done') { row.classList.add("clickable"); row.addEventListener("click", () => jumpTo(n.idx)); }
      if (status === 'current') { focusRow = row; focusIdx = i; }
      grp.appendChild(row);
    });
    body.scrollTop = prevTop;
    if (focusRow && focusIdx !== lastMapFocus) { lastMapFocus = focusIdx; mapGlideUntil = performance.now() + 700; }
    if (focusRow && performance.now() < mapGlideUntil) {
      const centred = focusRow.offsetTop + focusRow.offsetHeight / 2 - body.clientHeight / 2;
      body.scrollTo({ top: Math.max(0, centred), behavior: "smooth" });
    }
  }

  // ===== Detailed-status overlay =====
  const overlayEl = document.getElementById("mapOverlay");
  let overlayOpen = false, overlayReturnFocus = null;
  function renderOverlay(scrollToCurrent) {
    const body = document.getElementById("ovBody");
    const prevTop = body.scrollTop;
    body.innerHTML = "";
    let done = 0, currentEl = null, lastSec;
    const nodes = mapNodes();
    nodes.forEach((n, i) => {
      if (n.p.sec !== lastSec) {
        lastSec = n.p.sec;
        if (lastSec && lastSec !== 'end') body.appendChild(el("div", "ov-sec sec-" + lastSec, `<div class="ov-sec-h">${t('sec.' + lastSec)}</div><div class="ov-sec-d">${t('secd.' + lastSec)}</div>`));
      }
      const status = nodeStatus(n);
      if (status === "done") done++;
      const card = el("div", "ov-step " + status);
      const si = secInfo(n.idx);
      card.appendChild(el("div", "ov-icon", status === "done" ? "✓" : status === "current" ? "▶" : si && si.sec === 'proto' ? String(si.i) : "•"));
      const main = el("div", "ov-main");
      const top = el("div", "ov-top");
      top.appendChild(el("div", "ov-name", phaseTitle(n.idx)));
      top.appendChild(el("div", "ov-pill", t('map.st.' + status)));
      main.appendChild(top);
      main.appendChild(el("div", "ov-what", t('map.d.' + n.p.name)));
      if (status !== 'upcoming' && n.p.map) n.p.map(main, status);
      if (status === "done") {
        main.appendChild(el("div", "ov-goto", t('map.goto')));
        card.classList.add("clickable");
        card.tabIndex = 0; card.setAttribute("role", "button");
        const go = () => { closeOverlay(); jumpTo(n.idx); };
        card.addEventListener("click", go);
        card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      }
      card.appendChild(main);
      if (status === "current") currentEl = card;
      body.appendChild(card);
    });
    document.getElementById("ovTitle").textContent = t('map.detailTitle');
    document.getElementById("ovSub").textContent = t('map.progressAll', { done, tot: nodes.length });
    document.getElementById("ovBar").style.width = Math.round(done / nodes.length * 100) + "%";
    const closeBtn = document.getElementById("ovClose");
    closeBtn.title = t('map.close'); closeBtn.setAttribute("aria-label", t('map.close'));
    body.scrollTop = prevTop;
    if (scrollToCurrent && currentEl) body.scrollTop = Math.max(0, currentEl.offsetTop - 70);
  }
  function openOverlay() {
    overlayOpen = true;
    overlayReturnFocus = document.activeElement;
    overlayEl.hidden = false;
    document.body.style.overflow = "hidden";
    renderOverlay(true);
    document.getElementById("ovClose").focus();
  }
  function closeOverlay() {
    if (!overlayOpen) return;
    overlayOpen = false;
    overlayEl.hidden = true;
    document.body.style.overflow = "";
    if (overlayReturnFocus && overlayReturnFocus.focus) overlayReturnFocus.focus();
  }

  // The summary step only offers a replay; "back to the lab" lives in the bottom navigation.
  function summaryButtons(panel, restart) {
    const btnRow = el("div", "btn-row");
    const restartBtn = el("button", "btn btn-primary", t('btn.retry'));
    restartBtn.addEventListener("click", () => { cancelAnims(); restart(); render(); });
    btnRow.appendChild(restartBtn);
    panel.appendChild(btnRow);
  }

  // ===== Follow what a button changed =====
  // After a click inside the step card, whatever the click added or changed (a verdict, a result,
  // a new row) may land below the visible part of the card. Each render compares the card's blocks
  // with the previous render and, if the change ends below the fold, scrolls the card down to it,
  // without pushing the start of a newly added block above the top. Only clicks inside the card
  // turn this on; Next/Back, the language switch and the map turn it off, so they never scroll it.
  let followChanges = false, prevStepKey = "";
  const sigOf = c => c.className + "|" + c.textContent.replace(/\s+/g, " ").trim();
  function cardBlocks(panel) {
    if (!panel) return [];
    const body = panel.querySelector(":scope > .panel-body") || panel;
    return [...body.children].filter(c => !c.classList.contains("sticky-actions"));
  }
  function blockSigs(panel) { return cardBlocks(panel).map(c => ({ cls: c.className, sig: sigOf(c) })); }
  function revealChanges(panel, prev) {
    const kids = cardBlocks(panel);
    const changed = kids.filter((c, i) => !prev[i] || prev[i].sig !== sigOf(c));
    if (!changed.length) return;
    // a block that was there before and only grew (same kind at the same place) is "modified";
    // anything else is new, and the first new block's top must stay in view
    const firstNew = changed.find(c => { const i = kids.indexOf(c); return !prev[i] || prev[i].cls !== c.className; });
    const h = panel.getBoundingClientRect(), sticky = panel.querySelector(".sticky-actions");
    const visTop = h.top + 8, visBot = (sticky ? sticky.getBoundingClientRect().top : h.bottom) - 8;
    const end = changed[changed.length - 1].getBoundingClientRect().bottom;
    let by = end - visBot;
    if (firstNew) by = Math.min(by, firstNew.getBoundingClientRect().top - visTop);
    if (by <= 2) return;
    glideTo(panel, panel.scrollTop + by);
  }
  // A smooth scroll is cut short when the card is re-rendered mid-way (auto-runs re-render often),
  // so the target is remembered for a moment and the next render of the same step carries on to it.
  let glide = null;
  function glideTo(panel, to) {
    glide = { to, step: String(state.phase), until: Date.now() + 900 };
    if (reducedMotion() || typeof panel.scrollTo !== "function") panel.scrollTop = to;
    else panel.scrollTo({ top: to, behavior: "smooth" });
  }
  function resumeGlide(panel, stepKey) {
    if (!glide || glide.step !== stepKey || Date.now() > glide.until) { glide = null; return; }
    if (panel.scrollTop < glide.to - 2) glideTo(panel, glide.to);
  }
  document.addEventListener("click", (e) => {
    const hit = e.target.closest ? e.target.closest("button, a, .tgl, [data-lang-btn]") : null;
    if (!hit) return;
    followChanges = !!(hit.closest("#stepPanel") && !hit.closest(".explain"));
  }, true);

  let lastStepKey = "";
  function render() {
    renderDots();
    const panel = el("div", "panel");
    curPhase().render(panel);
    secBadge(panel);
    const last = panel.lastElementChild;
    if (last && last.classList.contains("sticky-actions")) {
      const body = el("div", "panel-body");
      while (panel.firstChild !== last) body.appendChild(panel.firstChild);
      panel.insertBefore(body, last);
      panel.classList.add("has-actions");
    }
    state.netPop = false;
    const holder = document.getElementById("stepPanel");
    const prevScroll = holder.firstElementChild ? holder.firstElementChild.scrollTop : 0;
    const prevSigs = blockSigs(holder.firstElementChild);
    holder.innerHTML = "";
    holder.appendChild(panel);
    const stepKey = String(state.phase);
    if (stepKey !== lastStepKey) linkPinned = null;
    linkApplyPinned();
    panel.scrollTop = stepKey === lastStepKey ? prevScroll : 0;
    lastStepKey = stepKey;
    // Keep the line being worked on in view inside the card.
    const focus = panel.querySelectorAll(".scroll-focus");
    if (focus.length && (state.busy || state.auto || state.focusNext)) {
      const h = panel.getBoundingClientRect();
      const f = focus[focus.length - 1].getBoundingClientRect();
      const sticky = panel.querySelector(".sticky-actions");
      const bottomPad = (sticky ? sticky.offsetHeight : 0) + 8;
      if (f.bottom > h.bottom - bottomPad) panel.scrollTop += f.bottom - (h.bottom - bottomPad);
      else if (f.top < h.top) panel.scrollTop -= h.top - f.top + 8;
    }
    state.focusNext = false;
    if (stepKey === prevStepKey) resumeGlide(panel, stepKey); else glide = null;
    if (followChanges && stepKey === prevStepKey) revealChanges(panel, prevSigs);
    prevStepKey = stepKey;
    renderNav(document.getElementById("navRow"));
    renderMap();
    renderTerm();
    if (overlayOpen) renderOverlay(false);
  }

  // ===== "How it looks for real": a terminal under the game, collapsed until clicked =====
  // A game may supply TERM = { tabs: [[id, titleKey]], notes: { id: key }, steps: { phaseName: { id: [lines] } } }.
  // Lines of every step up to the current one are shown; the current step's lines are lit.
  // A line is a command ("$ …", "host# …"), output, "@key" (a translated "# comment") or "!…" (highlighted).
  const term = { open: false, tab: null };
  function renderTerm() {
    const box = document.getElementById("term");
    if (!box || typeof TERM === "undefined") return;
    if (!term.tab) term.tab = TERM.tabs[0][0];
    box.hidden = false;
    box.classList.toggle("open", term.open);
    document.getElementById("termTitle").textContent = t('term.title');
    document.getElementById("termSub").textContent = t('term.sub');
    const tgl = document.getElementById("termTgl"), win = document.getElementById("termWin");
    tgl.setAttribute("aria-expanded", term.open ? "true" : "false");
    win.hidden = !term.open;
    if (!term.open) return;
    const tabs = document.getElementById("termTabs");
    tabs.innerHTML = "";
    TERM.tabs.forEach(([id, key]) => {
      const b = el("button", "term-tab" + (term.tab === id ? " on" : ""), esc(t(key)));
      b.type = "button";
      b.addEventListener("click", () => { term.tab = id; renderTerm(); });
      tabs.appendChild(b);
    });
    const body = document.getElementById("termBody");
    body.innerHTML = "";
    let any = false;
    PHASES.slice(0, state.phase + 1).forEach((ph, k) => {
      const lines = (TERM.steps[ph.name] || {})[term.tab] || [];
      lines.forEach(line => {
        let cls = "ln", txt = line;
        if (txt[0] === "!") { cls += " hl"; txt = txt.slice(1); }
        if (txt[0] === "@") { cls += " cmt"; txt = "# " + t(txt.slice(1)); }
        else if (/^\$ |^[\w-]+(\([\w-]+\))?# /.test(txt)) cls += " cmd";
        else if (txt.startsWith("# ")) cls += " cmt";
        if (k === state.phase) cls += " now";
        body.appendChild(el("span", cls, esc(t(txt))));
        any = true;
      });
    });
    if (!any) body.appendChild(el("span", "empty", esc(t('term.empty'))));
    body.appendChild(el("span", "caret"));
    body.scrollTop = body.scrollHeight;
    document.getElementById("termNote").textContent = t(TERM.notes[term.tab]);
  }
  (function () {
    const tgl = document.getElementById("termTgl");
    if (tgl) tgl.addEventListener("click", () => { term.open = !term.open; renderTerm(); });
  })();

  document.getElementById("infoToggle").addEventListener("click", function () { this.classList.toggle("open"); });
  document.getElementById("mapExpand").addEventListener("click", openOverlay);
  document.getElementById("ovClose").addEventListener("click", closeOverlay);
  overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closeOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (!overlayOpen) return;
    if (e.key === "Escape") { closeOverlay(); return; }
    if (e.key !== "Tab") return;
    const f = Array.from(overlayEl.querySelectorAll('button:not([disabled]), [tabindex="0"]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => applyLanguage(btn.dataset.langBtn)));
  initLanguage();

})();
</script>
</body>
</html>
