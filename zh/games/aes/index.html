  .byte-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .bit-cell {
    width: 42px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.7);
    font-family: 'Oswald', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-primary);
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .bit-cell:not(.static):hover { border-color: var(--accent-gold); transform: translateY(-2px); }
  .bit-cell.static { cursor: default; }
  .bit-cell.pending { color: var(--text-muted); border-style: dashed; background: rgba(5,15,25,0.4); }
  .bit-cell.bit-active { color: #fff; background: rgba(0,162,255,0.22); border-color: var(--accent-blue); box-shadow: var(--glow-blue); }
  .bit-cell.bit-active.resolving { animation: resolvePulse 0.5s ease-in-out infinite; }
  @keyframes resolvePulse { 0%, 100% { box-shadow: var(--glow-blue); } 50% { box-shadow: 0 0 16px rgba(0,162,255,0.9), 0 0 28px rgba(0,162,255,0.5); } }
  .bit-cell.bit-worked { color: var(--text-primary); background: rgba(0,162,255,0.07); border-color: rgba(0,162,255,0.35); animation: dimBlink 1.8s ease-in-out infinite; }
  .bit-cell.just-revealed { animation: popIn 0.35s ease; }
  @keyframes dimBlink { 0%, 100% { box-shadow: 0 0 3px rgba(0,162,255,0.2); } 50% { box-shadow: 0 0 9px rgba(0,162,255,0.55); } }
  .bit-cell.key-slice { border-color: var(--accent-gold) !important; box-shadow: var(--glow-gold) !important; color: #fff; }
  .bit-cell.diff-bit { border-color: var(--accent-red) !important; box-shadow: 0 0 10px rgba(255,85,102,0.7), 0 0 20px rgba(255,85,102,0.35) !important; color: #fff; }
  .bit-cell.idx-bit { flex-direction: column; gap: 2px; height: 58px; }
  .bit-cell.idx-bit .idx-sub { font-size: 0.58rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
  .bit-cell.idx-bit.key-slice .idx-sub { color: rgba(255,255,255,0.7); }
  /* Avalanche-effect animation: flipping one S-box probe bit visibly ripples through the
     output. The flipped input bit gets an immediate ring pulse, the S-box arrow it flows
     through pulses a beat later, and each differing output bit lights up in a left-to-right
     cascade (staggered animation-delay set per element) instead of just snapping to red. */
  .bit-cell.flip-pulse { animation: flipPulse 0.6s ease-out; }
  @keyframes flipPulse {
    0% { transform: scale(1.35); box-shadow: 0 0 0 rgba(255,85,102,0); }
    35% { box-shadow: 0 0 16px rgba(255,85,102,0.85), 0 0 30px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  .swap-note.arrow-pulse { animation: arrowPulse 0.5s ease-out; }
  @keyframes arrowPulse {
    0%, 100% { text-shadow: none; }
    50% { color: #fff; text-shadow: 0 0 10px rgba(212,175,55,0.9); }
  }
  .bit-cell.diff-bit.avalanche { animation: avalancheRipple 0.55s ease-out backwards; }
  @keyframes avalancheRipple {
    0% { transform: scale(1.4); box-shadow: 0 0 0 rgba(255,85,102,0); }
    40% { box-shadow: 0 0 18px rgba(255,85,102,0.9), 0 0 34px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  /* A small gold/red spark physically flies from the flipped P bit, via the S-box arrow, to
     each output bit that changed — the same "watch it actually move" idea as the key-schedule
     rotation arc, applied to the avalanche demo so cause -> effect reads as motion, not just
     a color change. Positioned in JS (real screen coordinates), timed to land exactly when
     that bit's ripple glow (.avalanche above) starts. */
  .avalanche-spark {
    position: fixed; width: 11px; height: 11px; border-radius: 50%; left: 0; top: 0;
    background: radial-gradient(circle, #fff 0%, var(--accent-gold) 45%, var(--accent-red) 100%);
    box-shadow: 0 0 8px rgba(255,85,102,0.85), 0 0 16px rgba(212,175,55,0.55);
    pointer-events: none; z-index: 150;
  }
  @media (prefers-reduced-motion: reduce) {
    .bit-cell.flip-pulse, .swap-note.arrow-pulse, .bit-cell.diff-bit.avalanche { animation: none; }
  }

  .bit-cell.wrap-next { border-color: var(--accent-gold); animation: pulseGold 1.2s ease-in-out infinite; }
  .bit-cell.wrap-arc { animation: wrapArc 0.55s cubic-bezier(.4,0,.2,1) both; position: relative; z-index: 5; }
  @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: var(--glow-gold); } }
  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wrapArc {
    0%   { transform: translate(var(--dx), var(--dy)); }
    45%  { transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5 - 34px)); }
    100% { transform: translate(0, 0); }
  }
  .bit-readout { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }
  .bit-readout span { color: var(--accent-gold); font-family: 'Oswald', sans-serif; }
  .bit-equation { text-align: center; font-family: 'Oswald', sans-serif; color: var(--text-secondary); font-size: 0.95rem; margin: 8px 0 4px; letter-spacing: 0.5px; }
  .bit-equation .num { color: var(--accent-gold); }
  .bit-equation.done { color: var(--accent-green); }

  .half-pair { display: flex; justify-content: center; gap: 30px; margin: 10px 0; align-items: flex-start; flex-wrap: wrap; }
  .half-block { text-align: center; }
  .half-block .byte-row { margin: 0; }
  .half-label { font-family: 'Oswald', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
  .half-block.left .half-label { color: var(--accent-green); }
  .half-block.right .half-label { color: var(--accent-blue); }

  .op-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
  .op-symbol { font-size: 1.6rem; color: var(--accent-gold); font-family: 'Oswald', sans-serif; }
  .op-eq { font-size: 1.4rem; color: var(--text-muted); }

  /* S-box as a matrix: row = the two high bits of the input, column = the two low bits,
     the cell holds the output. Row/column headers light up for the entry being looked up. */
  .sbox-matrix { display: grid; grid-template-columns: 38px repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 440px; margin: 6px auto 4px; }
  .sm-head { display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.8px; color: var(--text-muted); transition: all 0.3s ease; }
  .sm-head.hl { color: var(--accent-gold); text-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .sm-corner { font-size: 0.6rem; line-height: 1.1; color: var(--text-muted); text-align: center; align-self: center; }
  .sbox-cell { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 4px 2px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.6); transition: all 0.3s ease; }
  .sbox-cell .val { font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: var(--text-secondary); }
  .sbox-cell .bin { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.5px; }
  .sbox-cell.active { background: rgba(212,175,55,0.18); border-color: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-cell.active .val { color: #fff; }
  .sbox-cell.active .bin { color: rgba(255,255,255,0.75); }
  .sbox-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; margin: 8px auto 2px; }
  .sbox-note.ok { color: var(--accent-green); }
  .sbox-note.bad { color: var(--accent-orange); }
  /* In the avalanche demo, the matrix shows both the previous S-box lookup (dashed, muted —
     "where P used to point") and the current one (solid gold, from the existing .hl/.active
     rules) at once, so a bit flip visibly moves the lookup from one matrix cell to another. */
  .sm-head.hl-prev { color: rgba(212,175,55,0.6); text-decoration: underline dashed rgba(212,175,55,0.6); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .sbox-cell.was { border-style: dashed; border-width: 2px; border-color: rgba(212,175,55,0.45); background: rgba(212,175,55,0.05); }
  .sbox-cell.was .val { color: var(--text-primary); }
  /* Small on-screen key so "solid gold = now, dashed = before" isn't only explained in prose. */
  .sbox-legend { display: flex; gap: 18px; justify-content: center; align-items: center; margin: 2px 0 10px; font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .sbox-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
  .sbox-legend-item .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .sbox-legend-item.now { color: var(--accent-gold); }
  .sbox-legend-item.now .dot { background: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-legend-item.prev { color: rgba(212,175,55,0.75); }
  .sbox-legend-item.prev .dot { background: transparent; border: 2px dashed rgba(212,175,55,0.6); }
  .av-history { margin-top: 10px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; }
  .av-hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; font-family: 'Oswald', sans-serif; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--card-border); }
  .av-hist-row:first-child { border-top: none; }
  .av-hist-row.latest { color: var(--accent-gold); background: rgba(212,175,55,0.08); }
  .av-hist-diff { color: var(--text-secondary); flex: none; }
  .av-hist-row.latest .av-hist-diff { color: var(--accent-gold); }

  .round-track { display: flex; justify-content: center; gap: 6px; margin: 2px 0 10px; }
  .round-pip {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-family: 'Oswald', sans-serif; border: 1px solid var(--card-border); color: var(--text-muted);
  }
  .round-pip.done { background: var(--accent-green); border-color: var(--accent-green); color: #04210f; }
  .round-pip.current { background: var(--accent-gold); border-color: var(--accent-gold); color: #2a1d00; box-shadow: var(--glow-gold); }
  .round-track.ks-tabs { gap: 14px; margin: 6px 0 12px; }
  .round-track.ks-tabs .round-pip { width: 38px; height: 38px; font-size: 1.05rem; cursor: pointer; transition: all 0.2s ease; }
  .round-track.ks-tabs .round-pip:hover { border-color: var(--accent-gold); }
  .round-track.ks-tabs .round-pip.attention { border-color: var(--accent-gold); box-shadow: var(--glow-gold); animation: pipBounce 1.1s ease-in-out infinite; }
  @keyframes pipBounce {
    0%, 100% { transform: translateY(0); }
    20% { transform: translateY(-10px); }
    40% { transform: translateY(0); }
    55% { transform: translateY(-5px); }
    70% { transform: translateY(0); }
  }

  .swap-note { text-align: center; color: var(--accent-gold); font-family: 'Oswald', sans-serif; font-size: 0.95rem; margin: 5px 0; letter-spacing: 0.5px; }
  .arrow-swap { display: inline-block; animation: swapPulse 1.4s infinite; }
  @keyframes swapPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .btn-row { display: flex; justify-content: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px;
    padding: 11px 22px; border-radius: 6px; cursor: pointer; border: 1px solid; transition: all 0.25s ease; background: transparent;
  }
  .btn-primary { color: var(--accent-blue); border-color: rgba(0,162,255,0.4); background: rgba(0,162,255,0.1); }
  .btn-primary:hover { border-color: var(--accent-blue); box-shadow: var(--glow-blue); transform: translateY(-2px); }
  .btn-gold { color: var(--accent-gold); border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.1); }
  .btn-gold:hover { border-color: var(--accent-gold); box-shadow: var(--glow-gold); transform: translateY(-2px); }
  .btn-ghost { color: var(--text-muted); border-color: var(--card-border); }
  .btn-ghost:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .nav-hint { flex: 0 0 100%; text-align: center; color: var(--accent-gold); font-size: 0.8rem; line-height: 1.4; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* Detailed-status overlay opened from the map's expand button */
  .overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(2, 8, 14, 0.78); backdrop-filter: blur(3px); animation: ovFade 0.2s ease; }
  .overlay[hidden] { display: none; }
  @keyframes ovFade { from { opacity: 0; } to { opacity: 1; } }
  .overlay-card { width: 100%; max-width: 760px; max-height: min(86vh, 820px); display: flex; flex-direction: column; text-align: left; background: #08192a; border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 0 40px rgba(0,162,255,0.25); animation: popIn 0.25s ease; }
  .overlay-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 10px; }
  .overlay-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-blue); font-size: 1.1rem; }
  .overlay-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }
  .overlay-close { flex: none; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; color: var(--text-secondary); background: transparent; border: 1px solid var(--card-border); border-radius: 6px; transition: all 0.2s ease; }
  .overlay-close:hover { color: var(--accent-gold); border-color: var(--accent-gold); }
  .overlay-progress { height: 3px; margin: 0 20px 6px; background: rgba(0,162,255,0.15); border-radius: 2px; overflow: hidden; }
  .overlay-progress > div { height: 100%; background: #00ff80; transition: width 0.3s ease; }
  .overlay-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 20px; position: relative; }
  .ov-step { display: flex; gap: 14px; padding: 13px 15px; margin-bottom: 10px; border: 1px solid var(--card-border); border-radius: 8px; background: rgba(5,15,25,0.55); }
  .ov-step.done { border-color: rgba(72,187,120,0.4); }
  .ov-step.current { border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(212,175,55,0.25); }
  .ov-step.upcoming { opacity: 0.72; }
  .ov-step.clickable { cursor: pointer; }
  .ov-step.clickable:hover { border-color: #00ff80; }
  .ov-icon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; border: 2px solid var(--card-border); color: var(--text-muted); }
  .ov-step.done .ov-icon { background: #00ff80; border-color: #00ff80; color: #04210f; }
  .ov-step.current .ov-icon { background: var(--accent-gold); border-color: var(--accent-gold); color: #2a1d00; animation: pulseGold 1.4s ease-in-out infinite; }
  .ov-main { flex: 1; min-width: 0; }
  .ov-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ov-name { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.95rem; color: var(--text-secondary); }
  .ov-step.current .ov-name { color: var(--accent-gold); font-weight: 700; }
  .ov-pill { font-family: 'Oswald', sans-serif; font-size: 0.66rem; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--card-border); color: var(--text-muted); }
  .ov-step.done .ov-pill { color: #00ff80; border-color: rgba(0,255,128,0.4); }
  .ov-step.current .ov-pill { color: var(--accent-gold); border-color: rgba(212,175,55,0.5); }
  .ov-what { font-size: 0.86rem; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .ov-result { margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 0.88rem; letter-spacing: 0.4px; color: var(--accent-gold); word-break: break-word; }
  .ov-main .mf-bits { margin-top: 6px; }
  .ov-subs { margin-top: 8px; display: grid; gap: 4px; }
  .ov-sub { display: flex; gap: 8px; align-items: baseline; font-size: 0.82rem; color: var(--text-muted); }
  .ov-sub .ov-sub-ico { flex: none; width: 14px; text-align: center; }
  .ov-sub.done { color: var(--text-secondary); }
  .ov-sub.done .ov-sub-ico { color: #00ff80; }
  .ov-sub.current { color: var(--accent-gold); }
  .ov-sub .ov-sub-val { font-family: 'Oswald', sans-serif; color: var(--accent-gold); letter-spacing: 0.3px; }
  .ov-goto { margin-top: 8px; font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: #00ff80; }

  footer { margin-top: 50px; font-size: 0.85rem; color: var(--text-muted); }
  footer a { color: var(--accent-blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 900px) { h1 { font-size: 2rem; } }
  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    .bit-cell { width: 32px; height: 42px; font-size: 1.05rem; }
    .panel { padding: 18px; }
    .half-pair { gap: 16px; }
    /* The 3-operand XOR equation (R ⊕ K = X) doesn't fit one line on a phone; instead of an
       unpredictable mid-row wrap, stack operand / operator / operand / "=" / result top to
       bottom so it still reads left-to-right as one sequence. */
    .op-row { flex-direction: column; gap: 8px; }
    .op-row .half-block { width: 100%; }
    .algo-list { grid-template-columns: 1fr; }
    .overlay { padding: 10px; }
    .overlay-card { max-height: 92vh; }
    .overlay-head { padding: 14px 16px 8px; }
    .overlay-body { padding: 8px 16px 16px; }
    .ov-step { padding: 11px 12px; gap: 10px; }
  }
  @media (max-width: 480px) { .bit-cell { width: 28px; height: 38px; } .byte-row { gap: 5px; } }

  /* ===================== AES / SPN-specific ===================== */
  .center { text-align: center; }
  .panel p.small, .df-box p.small { font-size: 0.88rem; margin: 4px 0 8px; }
  .wrap-arc { animation: wrapArc 0.6s cubic-bezier(.4,0,.2,1) both; position: relative; z-index: 5; }

  /* The 2x2 state matrix: nibbles are laid out column by column (index = 2*col + row),
     each cell shows its 4 bits big and the decimal value small, plus an optional tag (s0, k3…). */
  .mx-block { text-align: center; }
  .mx-block .half-label { margin-bottom: 6px; }
  .mx { display: inline-grid; grid-template-columns: repeat(2, 78px); gap: 8px; padding: 8px; border: 1px solid var(--card-border); border-radius: 10px; background: rgba(5,15,25,0.45); }
  .nib {
    position: relative; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    border: 1px solid var(--card-border); border-radius: 7px; background: rgba(5,15,25,0.8);
    font-family: 'Oswald', sans-serif; transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .nib .nb { font-size: 1.08rem; letter-spacing: 1.5px; color: var(--text-primary); font-weight: 500; line-height: 1.2; }
  .nib .nd { font-size: 0.66rem; color: var(--text-muted); line-height: 1.2; }
  .nib .ntag { position: absolute; top: 2px; left: 5px; font-size: 0.56rem; color: var(--text-muted); letter-spacing: 0.3px; line-height: 1.2; }
  .nib.pending { border-style: dashed; background: rgba(5,15,25,0.35); }
  .nib.pending .nb { color: var(--text-muted); }
  .nib.active { color: #fff; border-color: var(--accent-blue); background: rgba(0,162,255,0.22); box-shadow: var(--glow-blue); animation: resolvePulse 0.5s ease-in-out infinite; }
  .nib.worked { border-color: rgba(0,162,255,0.35); background: rgba(0,162,255,0.07); }
  .nib.src { border-color: var(--accent-gold); box-shadow: var(--glow-gold); }
  .nib.target { border-color: var(--accent-gold); animation: pulseGold 1.2s ease-in-out infinite; }
  .nib.col-hl { border-color: var(--accent-blue); box-shadow: 0 0 9px rgba(0,162,255,0.55); background: rgba(0,162,255,0.1); }
  .nib.just-revealed { animation: popIn 0.35s ease; }
  .nib.pop-late { animation: popIn 0.35s ease 0.45s backwards; }
  .op-arrow { font-size: 1.5rem; color: var(--accent-gold); font-family: 'Oswald', sans-serif; }

  /* ShiftRow: the matrix with a label per row ("row 2 · shift 1 ←") */
  .mx-with-rows { display: inline-flex; gap: 12px; align-items: flex-end; }
  .mx-rowlabels { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .mx-rowlabel { height: 60px; display: flex; align-items: center; justify-content: flex-end; font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 0.4px; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; }
  .mx-rowlabel.r1 { color: var(--accent-gold); }
  .shift-stage { text-align: center; margin: 6px 0; }

  /* Real AES ShiftRows on a 4x4 grid */
  .real-box { margin-top: 10px; padding: 10px 14px 12px; border: 1px dashed var(--card-border); border-radius: 8px; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .real-text { flex: 1 1 260px; text-align: left; }
  .real-text .algo-title { margin-top: 2px; }

      'info.toggle': 'ℹ️ How does the cipher work?',
      'info.short': 'AES (Rijndael, 2001) is a substitution–permutation network: every round transforms the whole block by substitution, mixing and key addition. Russia’s cipher of the same type is Kuznyechik (GOST R 34.12-2015).',
      'info.p1': 'In 1997 NIST announced an open competition to replace the ageing DES. It was won by <span class="highlight-gold">Rijndael</span>, designed by the Belgians Joan Daemen and Vincent Rijmen, which became the <span class="highlight">AES</span> standard (FIPS 197) in 2001. Today AES protects HTTPS, Wi-Fi, disks and messengers.',

      'intro.h': 'The idea of a substitution–permutation network',
      'intro.p1': 'A substitution–permutation network (SP-network, SPN) is the second main design for block ciphers, alongside the Feistel network. The block isn’t split into halves: every round transforms <span class="highlight">the whole block</span> with layers of operations — S-box substitution, permutation and mixing, and adding the round key. That’s why every operation must be invertible: decryption runs through them in reverse order.',

      'intro.cmpS': 'SPN: a round changes the whole block',
      'intro.base': 'This design underlies <span class="highlight">AES</span> (a 4×4 byte matrix, 10/12/14 rounds) and Russia’s <span class="highlight-gold">Kuznyechik</span> (GOST R 34.12-2015: 128-bit block, 9 rounds plus a final key addition). The game uses the teaching cipher <b>Mini-AES</b>: the same operations on a 2×2 matrix of nibbles (16 bits) and 2 rounds.',

      'ks.p2': 'The first word of each new key (w4 and w8) takes an extra step: the previous word first goes through the S-box, then the round constant Rcon is added (0001 for K1, 0010 for K2). The S-box makes the schedule nonlinear: round keys can’t be expressed from the master key with XORs alone. And Rcon is different in every round, so rounds never become identical copies of each other — otherwise the cipher would be open to so-called slide attacks.',

      'ks.disclaimerShort': 'AES-128 builds 11 keys of 128 bits with the same chain (plus RotWord); Kuznyechik derives its round keys with 32 rounds of a Feistel network.',
      'ks.disclaimer': 'In AES-128 the key is 4 words of 32 bits, and the same chain produces 44 words (11 round keys). For the first word of each key, the previous word is first rotated by one byte (RotWord), then each of its bytes goes through the S-box (SubWord), and Rcon is added. In Mini-AES a word is a single nibble, so there’s nothing to rotate inside it. Kuznyechik (GOST R 34.12-2015) does it differently: the 256-bit key directly gives the first two round keys, and the other eight come from 32 rounds of a Feistel network with constants — a Feistel network running inside an SPN cipher.',

      'x.sbox': 'The S-box is a fixed 4 → 4-bit substitution table, part of the cipher itself. It’s invertible: decryption reads it backwards.',
      'sbox.p1': 'The S-box replaces each nibble with another one from a fixed table. The table is part of the cipher’s specification, not of the key: it’s the same for everyone. It’s the only nonlinear operation in AES — without it the cipher would reduce to a system of linear equations and be easy to break.',

      'sum.h': '🎓 What matters here',
      'x.headIdea': '🎓 The main idea',
      'x.sumIdea': 'In an SPN every round changes the whole block, and every operation is invertible. Substitution confuses, shifting and mixing diffuse, and the key is added in between.',
      'sum.p1': 'The Feistel network and the SPN solve the same problem differently. Feistel allows the round function to be non-invertible, but a round only changes half the block. An SPN demands invertibility from every operation, but a round processes the whole block: the S-box provides nonlinearity (“confusion”), ShiftRow and MixColumn spread changes across the block (“diffusion”), and AddRoundKey mixes in the key. Roughly speaking, one SPN round does the work of about two Feistel rounds: AES-128 has 10 rounds, DES has 16. Still, each cipher’s exact round count is chosen with a safety margin against known attacks.',
      'x.headHist': '📜 Square → Rijndael → AES · Kuznyechik',
      'x.sumHist': 'Square (1997) → Rijndael (1998) → AES (2001). In Russia, Kuznyechik (2015) is built on the same design.',
      'sum.p2': 'In 1997 Joan Daemen, Lars Knudsen and Vincent Rijmen published the <span class="highlight-gold">Square</span> cipher — together with an attack on it, the “square attack” (later called the integral attack). A year later Daemen and Rijmen submitted <span class="highlight-gold">Rijndael</span>, a development of Square, to the NIST competition. In 2000 it won over Serpent, Twofish, RC6 and MARS, and in 2001 it became the <span class="highlight">AES</span> standard (FIPS 197). In 2015 Russia adopted GOST R 34.12-2015 with two ciphers: Magma (a Feistel network, formerly GOST 28147-89) and the new <span class="highlight-gold">Kuznyechik</span> — an SPN with a 128-bit block.',
      'sum.disclaimerTeaser': '⚠️ The real AES and Kuznyechik are much larger',
      'sum.disclaimerShort': 'AES: 128-bit block (4×4 bytes), 10/12/14 rounds, field GF(2⁸). Kuznyechik: 128 bits, 9 rounds + a final key addition. Here: 16 bits and 2 rounds.',
      'sum.disclaimer': 'Mini-AES is a teaching model and doesn’t protect data: a 16-bit key can be brute-forced instantly. In real AES the 128-bit block sits in a 4×4 byte matrix, a 128/192/256-bit key gives 10/12/14 rounds, and all multiplications happen in the field GF(2⁸) with the rule x⁸ = x⁴ + x³ + x + 1. MixColumns multiplies a 4-byte column by a matrix of the numbers 2, 3, 1, 1. Kuznyechik (GOST R 34.12-2015): 128-bit block, 256-bit key, 10 round keys: 9 rounds of key addition (X), byte substitution (S) and a linear transformation (L) that mixes all 16 bytes of the block at once, followed by a final addition of the tenth key.',

      'x.kd': 'The key is generated and distributed by a third party — the key centre; a cryptographic protection body is responsible for the keys. Alice and Bob receive the same key by a protected route and never send it to each other.',
      'kd.p1': 'The weakest point of a symmetric cipher isn’t the algorithm but the key: the sender and the receiver must have the same one, and nobody else may have it. The key can’t be sent over the same channel as the message — an eavesdropper would get both.',
      'kd.p2': 'In Russia the procedure is set by FAPSI Instruction No. 152 (2001), for cryptographic protection tools (SKZI) that protect restricted information other than state secrets. Keys are generated and distributed by a <b>cryptographic protection body</b> (OKZ): a unit of the organisation, an FSB-licensed company, or even a single appointed person. The OKZ produces the key documents, keeps a per-copy register of them and delivers them to the users on key media — by state courier or a special communication service, or by hand. The key is loaded into the device by an authorised person: an OKZ employee or a trained user. Technically the keys may be prepared by software — the key centre or the network control centre of a protected network — but people are responsible for them. How a key is generated from randomness is shown in the <a class="highlight" href="../cvk/">“Key Generation Center”</a> game.',
      'kd.p3': 'Note that no key travels between Alice and Bob at all. Later only the ciphertext goes over the open channel — and even if Eve intercepts it, she won’t get the key.',
      'kd.waiting': 'So far only the key centre has the key.',
      'kd.flying': 'The key is on its way by protected delivery…',
      'kd.done': '✅ The key is loaded into Alice’s and Bob’s cipher devices. It never went over the open channel — Eve has nothing to intercept.',
      'kd.btn': '▶ Send out the key',
      'tx.h': 'Step 9 — sending the ciphertext',
      'x.tx': 'Alice sends Bob only the ciphertext — over the open channel. Eve can take a copy, but without the key it’s just a number.',
      'tx.p1': 'An open channel is the internet, the radio, a phone line — anything sent over it can be seen by outsiders. So only the ciphertext goes over it. Bob already has the key: the key centre sent it in advance.',
      'tx.p2': 'That’s exactly what a cipher’s strength means: seeing the ciphertext, and even knowing how the cipher works, Eve can’t recover the plaintext without the key.',
      'tx.waiting': 'So far only Alice has the ciphertext.',
      'tx.flying': 'The ciphertext travels over the open channel — Eve takes a copy…',
      'tx.done': '✅ Bob has received the ciphertext. Eve has a copy, but no key.',
      'tx.btn': '▶ Send the ciphertext to Bob',
      'tx.modeTeaser': '⚠️ Real messages aren’t encrypted like this',
      'tx.modeShort': 'We sent a single block. A long message is encrypted with AES in a mode (GCM, CTR, CBC): if each block were encrypted on its own, identical pieces of text would give identical ciphertext.',
      'tx.mode1': 'The simplest way is the electronic codebook mode (ECB): each block is encrypted separately with the same key. It leaks the structure of the message: identical plaintext blocks turn into identical ciphertext blocks. Eve can’t read the text, but she can see where it repeats. The famous example is a picture of a penguin encrypted in ECB — the penguin is still clearly visible.',
      'tx.mode2': 'That’s why AES is always used in a mode. In CTR mode the cipher encrypts the values of a counter, producing a stream of bits that is ⊕-ed with the text — much like the <a class="highlight" href="../vernamcipher/">Vernam cipher</a>. GCM adds an integrity check on top: Bob will notice if Eve has changed the ciphertext. HTTPS usually runs on AES-GCM, Wi-Fi on the related CCM mode. Modes for Kuznyechik and Magma are defined in GOST R 34.13-2015.',
      'nav.lockKd': 'To continue, send the key out to Alice and Bob.',
      'nav.lockTx': 'To continue, send the ciphertext to Bob.',
      'map.kdDone': 'Alice ✓ · Bob ✓',
      'map.kdWait': 'not sent out yet',
      'map.txDone': 'delivered to Bob ✓',
      'map.txWait': 'not sent yet',
      'map.d.keydelivery': 'The key centre sends the key to Alice and Bob by a protected route; a cryptographic protection body is responsible for the keys.',
      'map.d.transmit': 'Alice sends the ciphertext to Bob over the open channel; Eve sees only the ciphertext.',
      'kd.realTeaser': '⚠️ AES on the internet has no key centre',
      'kd.realShort': 'AES on the internet: the parties derive a session key automatically with a protocol (TLS), no people involved. AES in US government communications and Kuznyechik in Russian SKZI: keys are produced, registered and delivered by a cryptographic authority and loaded into the device by a person.',
      'kd.real1': '<b>AES in everyday life</b> (HTTPS, Wi-Fi, messengers). There’s no key centre: on every connection the parties derive a shared key themselves with a key-exchange protocol (such as Diffie–Hellman in TLS), and it lives only for that session. No people are involved.',
      'kd.real2': '<b>AES in protected US communications.</b> Keys for NSA-approved cipher devices are issued by the NSA’s central system (EKMS, now KMI). In each unit the keying material is managed by a responsible person — the COMSEC custodian — and the key is loaded into the cipher device with a special fill device.',
      'kd.real3': '<b>Kuznyechik</b> (GOST R 34.12-2015). Like Magma, it runs inside certified cryptographic devices (SKZI), and key handling is governed by FAPSI Instruction No. 152: key documents are produced and registered by a cryptographic protection body, delivered on key media by state courier, a special communication service or by hand, and the key is loaded into the device by an authorised person. The cipher standard itself doesn’t describe this — these are operating rules.',

  // The 2x2 matrix. Cells are appended row by row for the grid, but each one is identified by

        const cell = el("div", "nib" + (shown ? "" : " pending") + (o.cls ? o.cls(i) : ""),
          shown ? nibHtml(vals[i], tag) : (tag ? `<span class="ntag">${tag}</span>` : "") + `<span class="nb">${o.placeholder !== undefined ? o.placeholder : "?"}</span>`);
        cell.dataset.i = i;

  function pairChars(groups, flat, start) {
    const gis = [];

    return gis.map(gi => groups[gi].ch === "\n" ? "↵" : groups[gi].ch).join("");
  }
  function renderTextPrep(panel) {

      results.innerHTML = "";

        card.appendChild(bytesRow);

  // Step 2: the block's 4 nibbles physically fly, one per click, into the matrix — column by column.

  // ===== Key schedule =====
  function ksFormula(j) {

  function stepKs(all) {

      grid.appendChild(el("div", "ks-rowlbl", `K${r}`));

  function stepArk() {

  }
  function renderArkStage(panel, g, sIn, sOut) {

    panel.appendChild(el("p", "small", t('ark.lead', { r: g.r })));

    renderMatrix(row, sIn, { label: t('lbl.state'), id: "mxIn", tag: i => `s${i}`, cls: opCls });
    row.appendChild(el("div", "op-symbol", "⊕"));
    renderMatrix(row, k, { label: `K${g.r}`, id: "mxKey", tag: i => `k${i}`, cls: opCls });
    row.appendChild(el("div", "op-eq", "="));
    const outBlock = renderMatrix(row, sOut, { label: t('lbl.result'), id: "mxOut", tag: i => `s'${i}`, shown: i => i < p,
      cls: i => i === doing ? " active" : (fxIs('cell') && i === p - 1 ? " just-revealed" : "") });
    panel.appendChild(row);
    const ci = state.busy ? p : p - 1;
    if (ci >= 0 && ci < 4) {
      outBlock.classList.add("scroll-focus");   // on a phone the operands stack vertically: keep the result in view
      panel.appendChild(el("div", "wb-title", t('ark.cell', { i: ci })));
      xorStack(panel, [{ label: `s${ci}`, v: sIn[ci] }, { label: `k${ci}`, v: k[ci] }], { label: `s'${ci}`, v: sOut[ci], hidden: state.busy }, { pop: fxIs('cell') }).classList.add("scroll-focus");
    } else {
      panel.appendChild(el("div", "bit-readout", t('ark.hint')));
    }
    stageButtons(panel, stepArk, 'ark.btn', 4);
  }

  function stepSub() {
    if (state.busy || prog() >= 4) return;
    const i = prog(), fast = !!state.auto, d = fast ? 230 : 450;
    state.busy = true;
    render();
    requestAnimationFrame(() => {
      const sb = document.querySelector("#sbStage .sbox-cell.active");
      spark(cellEl("mxIn", i), sb, 0, d);
      spark(sb, cellEl("mxOut", i), d, d);
    });
    later(2 * d + (fast ? 60 : 150), () => { setProg(i + 1); fx = 'cell'; settle(stepSub, 4); });
  }
  function renderSubStage(panel, g, sIn, sOut) {
    const p = prog(), doing = state.busy ? p : -1;
    renderExplain(panel, "what", { head: t('x.head'), short: t('x.sub'), full: [t('sub.p1'), t('sub.p2')] });
    const row = el("div", "op-row");
    renderMatrix(row, sIn, { label: t('lbl.state'), id: "mxIn", tag: i => `s${i}`, cls: i => i === doing ? " active" : i < p ? " worked" : "" });
    row.appendChild(el("div", "op-arrow", "→"));
    renderMatrix(row, sOut, { label: t('lbl.result'), id: "mxOut", tag: i => `s'${i}`, shown: i => i < p,
      cls: i => i === doing ? " active" : (fxIs('cell') && i === p - 1 ? " just-revealed" : "") });
    panel.appendChild(row);
    const ci = state.busy ? p : p - 1;
    const look = ci >= 0 && ci < 4 ? sIn[ci] : -1;
    const sbWrap = el("div");
    sbWrap.id = "sbStage";
    sbWrap.className = "scroll-focus";
    sbWrap.appendChild(el("div", "sub-arrow", t('sub.arrow')));
    renderSbox(sbWrap, look, true, "compact");
    panel.appendChild(sbWrap);
    if (look >= 0) {
      panel.appendChild(el("div", "bit-equation scroll-focus" + (state.busy ? "" : " done"), t('sub.cell', { i: ci, x: bin4(look), r: bin2(look >> 2), c: bin2(look & 3), y: state.busy ? "?" : bin4(SBOX[look]), yd: state.busy ? "?" : SBOX[look] })));
    } else {
      panel.appendChild(el("div", "bit-readout", t('sub.hint')));
    }
    stageButtons(panel, stepSub, 'sub.btn', 4);
  }

  // ShiftRow: row 2 rotates left by one — the left nibble arcs over to the end of the row,
  // exactly like a key bit wrapping around in the Feistel key schedule.
  function stepShift() {
    if (prog() >= 1) return;
    const before = captureRects();
    setProg(1);
    render();
    playFlip(before, { arc: new Set(["c1"]), dur: 550 });
  }
  function toggleAes44() {
    const before = captureRects();
    state.aes44 = !state.aes44;
    render();
    const arc = new Set();
    for (let r = 1; r < 4; r++) for (let c = 0; c < r; c++) arc.add("g" + (r + 4 * c));
    playFlip(before, { arc, dur: 550 });
  }
  function renderShiftStage(panel, g, sIn) {
    const done = prog() >= 1;
    renderExplain(panel, "what", { head: t('x.head'), short: t('x.shift'), full: [t('shift.p1'), t('shift.p2')] });
    const perm = done ? [0, 3, 2, 1] : [0, 1, 2, 3];
    const wrap = el("div", "mx-with-rows");
    const labels = el("div", "mx-rowlabels");
    labels.append(el("div", "mx-rowlabel", t('shift.row0')), el("div", "mx-rowlabel r1", t('shift.row1')));
    wrap.appendChild(labels);
    renderMatrix(wrap, perm.map(q => sIn[q]), {
      label: done ? t('shift.after') : t('lbl.state'), id: "mxShift",
      tag: i => `s${perm[i]}`, fid: i => "c" + perm[i],
      cls: i => (!done && i === 1 ? " target" : "") + (i % 2 === 1 ? " src" : ""),
    });
    const stage = el("div", "shift-stage");
    stage.appendChild(wrap);
    panel.appendChild(stage);
    panel.appendChild(el("div", "bit-equation" + (done ? " done" : ""), t(done ? 'shift.done' : 'shift.todo')));

    const box = el("div", "real-box");
    const txt = el("div", "real-text");
    txt.appendChild(el("div", "algo-title", t('shift.realTitle')));
    txt.appendChild(el("p", "small", t('shift.realP')));
    box.appendChild(txt);
    const g44 = el("div", "g44");
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const srcCol = state.aes44 ? (c + r) % 4 : c;
      const idx = r + 4 * srcCol;
      const cell = el("div", `g44c r${r} c${srcCol}`, String(idx));
      cell.dataset.fid = "g" + idx;
      g44.appendChild(cell);
    }
    box.appendChild(g44);
    const tb = el("button", "btn btn-ghost aes44-btn", t(state.aes44 ? 'shift.realBack' : 'shift.realBtn'));
    tb.addEventListener("click", toggleAes44);
    txt.appendChild(tb);
    panel.appendChild(box);

    const row = el("div", "btn-row sticky-actions");
    if (!done) {
      const b = el("button", "btn btn-gold step-btn", t('shift.btn'));
      b.addEventListener("click", stepShift);
      row.appendChild(b);
    } else {
      const re = el("button", "btn btn-ghost replay-btn", t('btn.replay'));
      re.addEventListener("click", () => { setProg(0); render(); });
      row.appendChild(re);
    }
    panel.appendChild(row);
  }

  // MixColumn, one output cell at a time: every output nibble = coefA·a ⊕ coefB·b where (a, b)
  // is its column and (coefA, coefB) the matching row of (3 2 / 2 3). ×2 is shown as a real
  // left shift (the top bit drops into an "overflow" box, a 0 enters on the right, and an
  // overflow is folded back with ⊕ 0011); ×3 = ×2 ⊕ itself; then the two terms are added.
  function mixPlan(sIn, cell) {
    const col = cell >> 1, row = cell & 1;
    const a = sIn[2 * col], b = sIn[2 * col + 1];
    const [ca, cb] = MIXM[row];
    const na = `s${2 * col}`, nb = `s${2 * col + 1}`;
    const da = xtime(a), db = xtime(b);
    const ta = ca === 3 ? da ^ a : da, tb = cb === 3 ? db ^ b : db;
    const steps = [{ k: 'dbl', x: a, name: na, res: da }];
    if (ca === 3) steps.push({ k: 'add', x: a, name: na, d: da, res: ta });
    steps.push({ k: 'dbl', x: b, name: nb, res: db });
    if (cb === 3) steps.push({ k: 'add', x: b, name: nb, d: db, res: tb });
    steps.push({ k: 'sum', ca, cb, na, nb, ta, tb, res: ta ^ tb });
    return { col, row, a, b, ca, cb, na, nb, steps, out: ta ^ tb };
  }
  // Which output cell the workbench shows, and how many of its 4 steps are already done.
  function mixView() {
    const p = prog();
    if (p >= 16) return { cell: 3, sub: 4, complete: true };
    if (p > 0 && p % 4 === 0 && !state.mixShowNext) return { cell: p / 4 - 1, sub: 4, complete: true };
    return { cell: p >> 2, sub: p & 3, complete: false };
  }
  function stepMix() {
    if (state.busy || prog() >= 16) return;
    const v = mixView();
    if (v.complete) {
      state.mixShowNext = true;
      render();
      if (state.auto) later(300, stepMix);
      return;
    }
    const sIn = trace()[state.stage];
    const st = mixPlan(sIn, v.cell).steps[v.sub];
    const fast = !!state.auto;
    const before = captureRects();
    state.busy = true;
    setProg(prog() + 1);
    state.mixShowNext = false;
    fx = 'mix'; fxLine = v.sub;
    render();
    if (st.k === 'dbl') playFlip(before, { arc: new Set([`m${v.cell}${v.sub}b0`]), dur: fast ? 260 : 480 });
    const wait = fast ? (st.k === 'dbl' ? 700 : 520) : (st.k === 'dbl' ? 1500 : 1000);
    later(wait, () => {
      state.busy = false;
      const cellEnd = prog() % 4 === 0;
      const cont = !!state.auto && prog() < 16 && !(state.auto === 'cell' && cellEnd);
      if (!cont) state.auto = null;
      render();
      if (cont) stepMix();
    });
  }
  function renderDblBody(line, st, done, fidp, animate) {
    const bits = bits4(st.x);
    const r = el("div", "shift-row");
    const ovf = el("div", "ovf");
    ovf.appendChild(el("span", "ovf-lbl", t('mix.ovf')));
    const cells = el("div", "byte-row");
    if (!done) {
      bits.forEach((b, k) => {
        const c = el("div", "bit-cell static" + (k === 0 ? " wrap-next" : ""), String(b));
        c.dataset.fid = `${fidp}b${k}`;
        cells.appendChild(c);
      });
    } else {
      const top = el("div", "bit-cell static carry", String(bits[0]));
      top.dataset.fid = `${fidp}b0`;
      ovf.appendChild(top);
      [1, 2, 3].forEach(k => {
        const c = el("div", "bit-cell static", String(bits[k]));
        c.dataset.fid = `${fidp}b${k}`;
        cells.appendChild(c);
      });
      cells.appendChild(el("div", "bit-cell static" + (animate ? " new0" : ""), "0"));
    }
    r.append(ovf, cells);
    line.appendChild(r);
    if (done) {
      const after = el("div", animate ? "fade-late" : "");
      if (bits[0]) {
        after.appendChild(el("div", "wb-note warn", t('mix.ovfYes')));
        xorStack(after, [{ label: t('mix.shifted'), v: (st.x << 1) & 0xF }, { label: "0011", v: 3 }], { label: `2·${st.name}`, v: st.res }, { pop: animate, delay: 650 });
      } else {
        after.appendChild(el("div", "wb-note", t('mix.ovfNo', { name: st.name, v: bin4(st.res), vd: st.res })));
      }
      line.appendChild(after);
    }
  }
  function renderMixStage(panel, g, sIn, sOut) {
    renderExplain(panel, "what", { head: t('x.head'), short: t('x.mix'), full: [t('mix.p1'), t('mix.p2'), t('mix.p3')] });
    const p = prog(), v = mixView(), plan = mixPlan(sIn, v.cell), doneCells = p >> 2, allDone = p >= 16;
    const row = el("div", "op-row");
    const cm = el("div", "mx-block");
    cm.appendChild(el("div", "half-label", t('mix.matrixLbl')));
    const coef = el("div", "coef sm");
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) coef.appendChild(el("span", r === plan.row && !allDone ? "hl" : "", String(MIXM[r][c])));
    cm.appendChild(coef);
    row.appendChild(cm);
    row.appendChild(el("div", "op-symbol", "×"));
    renderMatrix(row, sIn, { label: t('lbl.state'), id: "mxIn", small: true, tag: i => `s${i}`, cls: i => !allDone && (i >> 1) === plan.col ? " col-hl" : "" });
    row.appendChild(el("div", "op-eq", "="));
    renderMatrix(row, sOut, { label: t('lbl.result'), id: "mxOut", small: true, tag: i => `s'${i}`, shown: i => i < doneCells,
      cls: i => (!allDone && !v.complete && i === v.cell) ? " target" : (fxIs('mix') && p % 4 === 0 && i === doneCells - 1 ? " just-revealed" : "") });
    panel.appendChild(row);

    const o = `s'${v.cell}`;
    panel.appendChild(el("div", "mixform", t('mix.formula', { o, ca: plan.ca, na: plan.na, cb: plan.cb, nb: plan.nb }) +
      `<span class="vals">${plan.ca}·${bin4(plan.a)} ⊕ ${plan.cb}·${bin4(plan.b)}</span>`));

    const wb = el("div", "wb");
    plan.steps.forEach((st, j) => {
      const status = j < v.sub ? "done" : j === v.sub ? "active" : "future";
      const animate = fxIs('mix') && j === fxLine && status === "done";
      const latest = status === "done" && j === v.sub - 1;
      const line = el("div", "wb-line " + status + (status === "done" && !latest ? " compact" : ""));
      let title;
      if (st.k === 'dbl') title = t('mix.t.dbl', { name: st.name, v: bin4(st.x) });
      else if (st.k === 'add') title = t('mix.t.add', { name: st.name });
      else title = t('mix.t.sum', { o, ca: st.ca, na: st.na, cb: st.cb, nb: st.nb });
      line.appendChild(el("div", "wb-title", title + (status === "done" && !latest ? `<span class="wb-val">= ${bin4(st.res)} (${st.res})</span>` : "")));
      if (status === "active" || latest) {
        const isDone = status === "done";
        if (st.k === 'dbl') renderDblBody(line, st, isDone, `m${v.cell}${j}`, animate);
        else if (st.k === 'add') xorStack(line, [{ label: `2·${st.name}`, v: st.d }, { label: st.name, v: st.x }], { label: `3·${st.name}`, v: st.res, hidden: !isDone }, { pop: animate });
        else xorStack(line, [{ label: `${st.ca}·${st.na}`, v: st.ta }, { label: `${st.cb}·${st.nb}`, v: st.tb }], { label: o, v: st.res, hidden: !isDone }, { pop: animate });
      }
      if (status === "active" || latest) line.classList.add("scroll-focus");
      wb.appendChild(line);
    });
    panel.appendChild(wb);
    if (v.complete) panel.appendChild(el("div", "bit-equation done", t('mix.cellDone', { o, v: bin4(plan.out), vd: plan.out })));
    if (allDone) panel.appendChild(el("div", "disclaimer success", t('mix.allDone')));

    const btns = el("div", "btn-row sticky-actions");
    if (!allDone) {
      const busy = state.busy || !!state.auto;
      const one = el("button", "btn btn-gold step-btn", v.complete ? t('mix.btnNextCell', { o: `s'${doneCells}` }) : t('mix.btnStep'));
      one.disabled = busy; one.addEventListener("click", stepMix);
      btns.appendChild(one);
      if (!v.complete) {
        const cellBtn = el("button", "btn btn-primary auto-cell-btn", t('mix.btnCell'));
        cellBtn.disabled = busy; cellBtn.addEventListener("click", () => { state.auto = 'cell'; stepMix(); });
        btns.appendChild(cellBtn);
      }
      const allBtn = el("button", "btn btn-primary auto-btn", t('mix.btnAll'));
      allBtn.disabled = busy; allBtn.addEventListener("click", () => { state.auto = 'all'; stepMix(); });
      btns.appendChild(allBtn);
    } else {
      const re = el("button", "btn btn-ghost replay-btn", t('btn.replay'));
      re.addEventListener("click", () => { cancelAnims(); setProg(0); state.mixShowNext = false; render(); });
      btns.appendChild(re);
    }
    panel.appendChild(btns);
  }

  function renderRounds(panel) {
    const g = STAGES[state.stage];
    const tr = trace();
    const sIn = tr[state.stage], sOut = tr[state.stage + 1];
    panel.appendChild(el("h2", null, g.r === 0 ? t('rounds.h0') : t('rounds.h', { r: g.r, tot: 2 })));
    const head = el("div", "round-head");
    const track = el("div", "round-track");
    for (let r = 0; r <= 2; r++) track.appendChild(el("div", "round-pip" + (r < g.r ? " done" : r === g.r ? " current" : ""), String(r)));
    head.appendChild(track);
    head.appendChild(el("div", "round-sep"));
    const chips = el("div", "op-chips");
    STAGES.forEach((s, i) => {
      if (s.r !== g.r) return;
      const done = i < state.stage || (i === state.stage && prog() >= stageFull(i));
      chips.appendChild(el("span", "op-chip" + (i === state.stage ? " current" : done ? " done" : ""), opChip(s)));
    });
    head.appendChild(chips);
    panel.appendChild(head);
    if (g.r === 2) panel.appendChild(el("div", "op-note", t('rounds.noMix')));
    const ops = STAGES.filter(s => s.r === g.r);
    panel.appendChild(el("div", "stage-label", t('rounds.opOf', { a: ops.indexOf(g) + 1, b: ops.length, name: t('op.name.' + g.op) })));
    if (g.op === 'ark') renderArkStage(panel, g, sIn, sOut);
    else if (g.op === 'sub') renderSubStage(panel, g, sIn, sOut);
    else if (g.op === 'shift') renderShiftStage(panel, g, sIn);
    else renderMixStage(panel, g, sIn, sOut);
    if (state.stage === STAGES.length - 1 && prog() >= 4) {
      const last = panel.querySelector(".sticky-actions");
      panel.insertBefore(el("div", "disclaimer info", t('rounds.last')), last);
    }
  }

  // ===== Ciphertext + diffusion check =====
  function avgDiffusion() {
    const pn = plainNibbles(), c0 = cipherNibbles(pn);
    let total = 0;
    for (let bit = 0; bit < 16; bit++) {
      const m = pn.slice(); m[bit >> 2] ^= 8 >> (bit & 3);
      const c1 = cipherNibbles(m);
      c0.forEach((v, i) => { total += bits4(v ^ c1[i]).filter(Boolean).length; });
    }
    return (total / 16).toFixed(1);
  }
  function renderCipher(panel) {
    panel.appendChild(el("h2", null, t('cipher.h')));
    renderExplain(panel, "read", { head: t('x.head'), short: t('x.cipher'), full: [t('cipher.p')] });
    const c = cipherNibbles();
    const cb = [(c[0] << 4) | c[1], (c[2] << 4) | c[3]];
    const row = el("div", "op-row");
    renderMatrix(row, c, { label: t('cipher.matrix'), tag: i => `c${i}` });
    row.appendChild(el("div", "op-arrow", "→"));
    const bytesBox = el("div", "tb");
    cb.forEach(b => staticByte(bytesBox, b, true));
    row.appendChild(bytesBox);
    panel.appendChild(row);
    panel.appendChild(el("div", "bit-readout", t('cipher.readout', { a: cb[0], b: cb[1] })));

    const box = el("div", "df-box");
    box.appendChild(el("div", "algo-title", t('df.title')));
    box.appendChild(el("p", "small", t('df.p')));
    const pn = plainNibbles();
    const pbits = [].concat(...pn.map(bits4));
    const just = fxIs('df');
    box.appendChild(el("div", "half-label center", t('df.plain')));
    const prow = el("div", "bits16");
    prow.id = "dfPlain";
    for (let n = 0; n < 4; n++) {
      const grp = el("div", "grp");
      for (let k = 0; k < 4; k++) {
        const i = 4 * n + k, flipped = i === state.dfFlip;
        const cell = el("div", "bit-cell sm" + (flipped ? " diff-bit" : "") + (flipped && just ? " flip-pulse" : ""), String(pbits[i] ^ (flipped ? 1 : 0)));
        cell.addEventListener("click", () => { state.dfFlip = state.dfFlip === i ? -1 : i; fx = 'df'; render(); });
        grp.appendChild(cell);
      }
      prow.appendChild(grp);
    }
    box.appendChild(prow);
    if (state.dfFlip < 0) {
      box.appendChild(el("div", "bit-readout", t('df.empty')));
    } else {
      const mod = pn.slice(); mod[state.dfFlip >> 2] ^= 8 >> (state.dfFlip & 3);
      const ta = trace(pn), tb = trace(mod);
      const chain = el("div", "df-chain");
      ta.forEach((sa, k) => {
        const sb = tb[k];
        const st = el("div", "df-st");
        st.appendChild(el("div", "df-lbl", k === 0 ? "P" : opChip(STAGES[k - 1])));
        const mm = miniMatrix(sb, i => sa[i] !== sb[i]);
        if (just) mm.querySelectorAll(".d").forEach(d => { d.classList.add("df-pop"); d.style.animationDelay = (k * 170) + "ms"; });
        st.appendChild(mm);
        chain.appendChild(st);
        if (k < ta.length - 1) chain.appendChild(el("div", "df-arr", "→"));
      });
      box.appendChild(chain);
      const ca = ta[ta.length - 1], cm = tb[tb.length - 1];
      let nb = 0, nn = 0;
      ca.forEach((v, i) => { const x = v ^ cm[i]; if (x) nn++; nb += bits4(x).filter(Boolean).length; });
      box.appendChild(el("div", "bit-equation done", t('df.res', { b: state.dfFlip + 1, n: nb, m: nn })));
    }
    box.appendChild(el("div", "map-detail center", t('df.avg', { avg: avgDiffusion() })));
    renderExplain(box, "dfnote", { head: t('df.noteHead'), short: t('df.noteShort'), full: [t('df.note'), t('df.note2')] });
    panel.appendChild(box);
  }

  // ===== Decryption =====
  function stepDec(all) {
    if (state.decStep >= 8) return;
    const d = state.decStep;
    state.decStep = all ? 8 : d + 1;
    fx = 'dec';
    render();
    if (all) return;
    const g = DSTAGES[d];
    requestAnimationFrame(() => {
      for (let i = 0; i < 4; i++) {
        const out = cellEl("mxOut", i);
        if (g.op === 'ishift') spark(cellEl("mxIn", [0, 3, 2, 1][i]), out, i * 60, 520);
        else if (g.op === 'imix') { spark(cellEl("mxIn", i & 2), out, i * 60, 520); spark(cellEl("mxIn", (i & 2) + 1), out, i * 60 + 40, 520); }
        else spark(cellEl("mxIn", i), out, i * 60, 520);
      }
    });
  }
  function renderDecrypt(panel) {
    panel.appendChild(el("h2", null, t('dec.h')));
    renderExplain(panel, "how", { head: t('x.head'), short: t('x.dec'), full: [t('dec.p')] });
    const dt = decTrace();
    const chips = el("div", "op-chips");
    DSTAGES.forEach((g, i) => chips.appendChild(el("span", "op-chip" + (state.decRunning && i < state.decStep ? " done" : state.decRunning && i === state.decStep ? " current" : ""), opChip(g))));
    panel.appendChild(chips);
    if (!state.decRunning) {
      const row = el("div", "op-row");
      renderMatrix(row, dt[0], { label: t('dec.cipherLabel'), tag: i => `c${i}` });
      panel.appendChild(row);
      const b = el("button", "btn btn-gold dec-start", t('dec.start'));
      b.addEventListener("click", () => { state.decRunning = true; state.decStep = 0; render(); });
      const br = el("div", "btn-row sticky-actions"); br.appendChild(b); panel.appendChild(br);
      return;
    }
    if (state.decStep === 0) {
      const row = el("div", "op-row");
      renderMatrix(row, dt[0], { label: t('dec.cipherLabel'), tag: i => `c${i}` });
      panel.appendChild(row);
    } else {
      const d = state.decStep - 1, g = DSTAGES[d];

  function renderSummary(panel) {

  // ===== Key centre & channels (same component in the Feistel and SPN games) =====
  // The key is never sent between Alice and Bob: a third party, the key centre, hands the
  // same key to both of them over protected channels before any message is exchanged. Only
  // the ciphertext travels over the open channel, where Eve can copy it but can't use it.
  // Each game supplies netKeyValue() / netCipherValue() — short display strings that also

  const NET_POS = { kc: [50, 25], alice: [15, 60], bob: [85, 60], eve: [50, 82] };
  function netReduced() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  function keyDelivered() { return state.kdFor === netKeyValue(); }

  // o: { focus: 'key' | 'cipher', kc|alice|bob|eve: [{ cls, text }, ...] }
  function renderNet(container, o) {
    const net = el("div", "net net-" + o.focus);
    const line = (a, b, cls) => `<line class="ln ${cls}" x1="${NET_POS[a][0]}" y1="${NET_POS[a][1]}" x2="${NET_POS[b][0]}" y2="${NET_POS[b][1]}"/>`;

      line("kc", "alice", "ln-key") + line("kc", "bob", "ln-key") + line("alice", "bob", "ln-open") +
      `<line class="ln ln-eve" x1="50" y1="${NET_POS.alice[1]}" x2="50" y2="${NET_POS.eve[1]}"/></svg>`;
    const label = (text, x, y, cls) => { const l = el("div", "net-lbl " + cls, text); l.style.left = x + "%"; l.style.top = y + "%"; net.appendChild(l); };
    label(t('net.keyCh'), (NET_POS.kc[0] + NET_POS.alice[0]) / 2, (NET_POS.kc[1] + NET_POS.alice[1]) / 2, "key");
    label(t('net.keyCh'), (NET_POS.kc[0] + NET_POS.bob[0]) / 2, (NET_POS.kc[1] + NET_POS.bob[1]) / 2, "key");
    label(t('net.openCh'), 50, NET_POS.alice[1] - 6, "open");
    const node = (id, icon, name, sub) => {
      const n = el("div", "net-node nn-" + id);

  }

  // Flies packets between node icons (or from a point on the open channel, for Eve's copy).
  function netFly(list, onDone) {
    const net = document.querySelector(".net");
    let end = 0;
    if (net && !netReduced()) {
      const r0 = net.getBoundingClientRect();
      const at = id => { const r = net.querySelector(`[data-node="${id}"] .nn-icon`).getBoundingClientRect(); return { x: r.left + r.width / 2 - r0.left, y: r.top + r.height / 2 - r0.top }; };
      list.forEach(p => {
        const a = p.fromMid ? { x: r0.width * 0.5, y: r0.height * NET_POS.alice[1] / 100 } : at(p.from), b = at(p.to);
        const d = el("div", "net-packet " + p.cls, p.label);
        d.style.left = a.x + "px"; d.style.top = a.y + "px";
        net.appendChild(d);
        end = Math.max(end, (p.delay || 0) + p.dur);
        if (typeof d.animate !== "function") { d.remove(); return; }
        const move = `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px))`;
        const anim = d.animate([
          { transform: "translate(-50%, -50%) scale(0.5)", opacity: 0 },
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.12 },
          { transform: move + " scale(1)", opacity: 1, offset: 0.9 },
          { transform: move + " scale(0.4)", opacity: 0 },
        ], { duration: p.dur, delay: p.delay || 0, easing: "ease-in-out", fill: "both" });
        anim.onfinish = anim.oncancel = () => d.remove();

    }
    setTimeout(onDone, end + 60);

  function netSend(phaseName, packets, onArrive) {

    render();
    requestAnimationFrame(() => netFly(packets, () => {

      if (PHASES[state.phase] === phaseName) { onArrive(); state.netPop = true; }
      render();
    }));
  }
  function deliverKey() {
    netSend("keydelivery", [
      { from: "kc", to: "alice", cls: "k", label: "K", dur: 1500 },

  }
  function sendCipher() {

  function netKeyValue() { return `${bitsToByte(state.keyBits[0])}, ${bitsToByte(state.keyBits[1])}`; }
  function netCipherValue() { const c = cipherNibbles(); return `${(c[0] << 4) | c[1]}, ${(c[2] << 4) | c[3]}`; }

  // ===== Navigation =====
  function enterPhase(name) {
    if (name === 'rounds') { state.stage = 0; state.mixShowNext = false; }
    if (name === 'decrypt') { state.decRunning = false; state.decStep = 0; }
  }
  function enterPhaseFromBack(name) {
    if (name === 'rounds') { state.stage = STAGES.length - 1; state.mixShowNext = false; }
  }
  function nextLock() {
    const name = PHASES[state.phase];
    if (state.busy || state.auto || state.netBusy) return "busy";
    if (name === "state" && state.layoutStep < 4) return "layout";
    if (name === "keydelivery" && !keyDelivered()) return "kd";
    if (name === "transmit" && !cipherSent()) return "tx";
    if (name === "keyschedule" && state.ksDone < 8) return "ks";
    if (name === "rounds" && prog() < stageFull(state.stage)) return "stage";
    return null;
  }
  function goNext() {
    if (nextLock()) return;
    cancelAnims();
    if (PHASES[state.phase] === "rounds" && state.stage < STAGES.length - 1) {
      state.stage++; state.mixShowNext = false; render(); return;
    }
    if (state.phase < PHASES.length - 1) {
      state.phase++;
      enterPhase(PHASES[state.phase]);
      render();
    }
  }
  function goBack() {
    if (state.busy || state.auto || state.netBusy) return;
    cancelAnims();
    if (PHASES[state.phase] === "rounds" && state.stage > 0) {
      state.stage--; state.mixShowNext = false; render(); return;
    }
    if (state.phase > 0) {
      state.phase--;
      enterPhaseFromBack(PHASES[state.phase]);
      render();
    }
  }
  function renderNav(nav) {

    backBtn.disabled = state.phase === 0 || state.busy || !!state.auto || state.netBusy;
    backBtn.addEventListener("click", goBack);
    nav.appendChild(backBtn);
    const isLast = state.phase === PHASES.length - 1;
    const isDecrypt = PHASES[state.phase] === "decrypt";
    const decDone = state.decRunning && state.decStep >= DSTAGES.length;
    if (!isLast && (!isDecrypt || decDone)) {

  function renderDots() {

  }

  // ===== Side map =====
  const MAP_NODES = [
    { type: 'phase', name: 'textprep' }, { type: 'phase', name: 'state' }, { type: 'phase', name: 'key' }, { type: 'phase', name: 'keydelivery' },
    { type: 'phase', name: 'keyschedule' }, { type: 'phase', name: 'sbox' },
    { type: 'round', round: 0 }, { type: 'round', round: 1 }, { type: 'round', round: 2 },
    { type: 'phase', name: 'cipher' }, { type: 'phase', name: 'transmit' }, { type: 'phase', name: 'decrypt' }, { type: 'phase', name: 'summary' },
  ];
  MAP_NODES.forEach(n => { if (n.type === 'phase') n.idx = PHASES.indexOf(n.name); });
  function lastStageOfRound(r) { let k = -1; STAGES.forEach((s, i) => { if (s.r === r) k = i; }); return k; }
  function stageStatus(i) {
    if (state.phase < ROUNDS_PHASE_IDX) return 'upcoming';
    if (state.phase > ROUNDS_PHASE_IDX) return 'done';
    if (i < state.stage) return 'done';
    if (i > state.stage) return 'upcoming';
    return state.progs[i] >= stageFull(i) ? 'done' : 'current';
  }
  function statusOfPhaseNode(idx) { return state.phase < idx ? 'upcoming' : state.phase > idx ? 'done' : 'current'; }
  function statusOfRoundNode(r) {
    if (state.phase < ROUNDS_PHASE_IDX) return 'upcoming';
    if (state.phase > ROUNDS_PHASE_IDX) return 'done';
    const cur = STAGES[state.stage].r;
    if (r < cur) return 'done';
    if (r > cur) return 'upcoming';

  function nodeLabel(node) { return node.type === 'round' ? t('map.round', { r: node.round }) : t('phase.' + node.name); }

    cancelAnims();
    state.phase = idx;
    enterPhaseFromBack(PHASES[state.phase]);
    render();
  }

    });
    return row;
  }
  function appendMapVisual(bodyEl, node, status) {

    if (status === "upcoming") return;

  // ===== Detailed-status overlay =====

  let overlayOpen = false, overlayReturnFocus = null;

  function appendOverlayDetail(main, node, status) {

      if (status === "done") done++;
      const card = el("div", "ov-step " + status);
      card.appendChild(el("div", "ov-icon", status === "done" ? "✓" : status === "current" ? "▶" : String(i + 1)));
      const main = el("div", "ov-main");
      const top = el("div", "ov-top");
      top.appendChild(el("div", "ov-name", `${i + 1}. ${nodeLabel(node)}`));
      top.appendChild(el("div", "ov-pill", t('map.st.' + status)));
      main.appendChild(top);
      main.appendChild(el("div", "ov-what", t(node.type === 'round' ? 'map.d.r' + node.round : 'map.d.' + node.name)));
      appendOverlayDetail(main, node, status);
      if (status === "done") {
        main.appendChild(el("div", "ov-goto", t('map.goto')));
        card.classList.add("clickable");
        card.tabIndex = 0; card.setAttribute("role", "button");
        const go = () => { closeOverlay(); if (node.type === 'round') jumpToRound(node.round); else jumpToPhase(node.idx); };
        card.addEventListener("click", go);
        card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      }
      card.appendChild(main);
      if (status === "current") currentEl = card;
      body.appendChild(card);
    });
    document.getElementById("ovTitle").textContent = t('map.detailTitle');
    document.getElementById("ovSub").textContent = t('map.progressAll', { done, tot: MAP_NODES.length });
    document.getElementById("ovBar").style.width = Math.round(done / MAP_NODES.length * 100) + "%";
    const closeBtn = document.getElementById("ovClose");
    closeBtn.title = t('map.close'); closeBtn.setAttribute("aria-label", t('map.close'));
    body.scrollTop = prevTop;
    if (scrollToCurrent && currentEl) body.scrollTop = Math.max(0, currentEl.offsetTop - 70);
  }
  function openOverlay() {
    overlayOpen = true;
    overlayReturnFocus = document.activeElement;
    overlayEl.hidden = false;
    document.body.style.overflow = "hidden";
    renderOverlay(true);
    document.getElementById("ovClose").focus();
  }
  function closeOverlay() {
    if (!overlayOpen) return;
    overlayOpen = false;
    overlayEl.hidden = true;
    document.body.style.overflow = "";
    if (overlayReturnFocus && overlayReturnFocus.focus) overlayReturnFocus.focus();
  }

  let lastStepKey = "";
  function render() {
    curFx = fx; fx = null;
    renderDots();
    const panel = el("div", "panel");
    RENDERERS[state.phase](panel);
    const holder = document.getElementById("stepPanel");
    const prevScroll = holder.firstElementChild ? holder.firstElementChild.scrollTop : 0;
    holder.innerHTML = "";
    holder.appendChild(panel);
    // A new step starts at the top of the card; re-renders inside a step keep the scroll.
    const stepKey = [state.phase, state.phase === ROUNDS_PHASE_IDX ? state.stage : -1, state.decRunning ? 1 : 0].join(":");
    panel.scrollTop = stepKey === lastStepKey ? prevScroll : 0;
    lastStepKey = stepKey;
    // Keep the line being worked on (MixColumn workbench) in view inside the card.
    const focus = panel.querySelectorAll(".scroll-focus");
    if (focus.length && (curFx || state.busy || PHASES[state.phase] === "rounds")) {
      const h = panel.getBoundingClientRect();
      const top = focus[0].getBoundingClientRect().top, bottom = focus[focus.length - 1].getBoundingClientRect().bottom;
      const sticky = panel.querySelector(".sticky-actions");
      const bottomPad = (sticky ? sticky.offsetHeight : 0) + 8;
      let delta = 0;
      if (bottom > h.bottom - bottomPad) delta = bottom - (h.bottom - bottomPad);
      delta = Math.min(delta, top - h.top - 8);       // never push the start of the focus out the top
      if (top < h.top) delta = top - h.top - 8;
      if (delta) panel.scrollTop += delta;
    }
    renderNav(document.getElementById("navRow"));
    renderMap();
    if (overlayOpen) renderOverlay(false);
  }

  document.getElementById("infoToggle").addEventListener("click", function () { this.classList.toggle("open"); });
  document.getElementById("mapExpand").addEventListener("click", openOverlay);
  document.getElementById("ovClose").addEventListener("click", closeOverlay);
  overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closeOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (!overlayOpen) return;
    if (e.key === "Escape") { closeOverlay(); return; }
    if (e.key !== "Tab") return;
    const f = Array.from(overlayEl.querySelectorAll('button:not([disabled]), [tabindex="0"]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => applyLanguage(btn.dataset.langBtn)));
  initLanguage();
})();
</script>
</body>
</html>
