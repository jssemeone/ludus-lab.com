    const halves = el("div", "half-pair compact");
    renderHalf(halves, "L", "left", [1, 0, 1, 1]);
    renderHalf(halves, "R", "right", [0, 1, 0, 0]);
    panel.appendChild(halves);
    panel.appendChild(el("p", null, t('intro.base')));
    panel.appendChild(el("div", "algo-title", t('intro.algoTitle')));
    const list = el("ul", "algo-list");
    for (let i = 1; i <= 7; i++) list.appendChild(el("li", null, t('intro.a' + i)));
    panel.appendChild(list);
    panel.appendChild(el("div", "algo-note", t('intro.notFeistel')));
    panel.appendChild(el("div", "disclaimer info", t('intro.tip')));
  }

  function renderTextPrep(panel) {
    panel.classList.add("input-panel");
    panel.appendChild(el("h2", null, t('textprep.h')));
    renderExplain(panel, "why", { head: t('x.head'), short: t('x.textprep'), full: [t('textprep.p1')] });

    // A <textarea> (not an <input>) so a whole few-line quatrain can be typed or pasted in
    // and stays visible as actual lines. Created once and never touched again while typing —
    // only the results box below gets its children swapped out. Rebuilding the whole panel
    // (as render() does) on every keystroke would tear it down mid-word, dropping focus/caret.
    const inputWrap = el("div", "text-input-wrap");
    const input = document.createElement("textarea");
    input.rows = 4;
    input.maxLength = 200;
    input.className = "text-input";
    input.value = state.textInput;
    input.placeholder = t('textprep.empty');
    inputWrap.appendChild(input);
    panel.appendChild(inputWrap);

    const results = el("div", "textprep-results");
    panel.appendChild(results);
    renderExplain(panel, "real", { head: t('textprep.disclaimerTeaser'), short: t('textprep.disclaimerShort'), full: [t('textprep.disclaimer')], kind: "warn" });

    function refreshResults() {
      results.innerHTML = "";
      const groups = utf8Groups(state.textInput);
      const flat = utf8FlatBytes(groups);
      if (flat.length === 0) return;
      state.textByteIndex = Math.min(state.textByteIndex, flat.length - 1);
      results.appendChild(el("div", "text-counter", t('textprep.counter', { chars: groups.length, bytes: flat.length })));
      results.appendChild(el("p", null, t('textprep.p2')));

      // One self-contained card per character (index, glyph, its byte chips) packed into a
      // wrapping grid — reads like several columns without the risk of losing track of which
      // byte belongs to which character, the way splitting them into separate table columns would.
      const grid = el("div", "char-grid");
      let flatIdx = 0;
      groups.forEach((g, gi) => {
        const startIdx = flatIdx;
        const endIdx = flatIdx + g.bytes.length - 1;
        const isNewline = g.ch === "\n";
        const card = el("div", "char-card" + (state.textByteIndex >= startIdx && state.textByteIndex <= endIdx ? " card-selected" : ""));
        card.appendChild(el("div", "char-idx", String(gi + 1)));
        card.appendChild(el("div", "char-glyph" + (isNewline ? " char-newline" : ""), isNewline ? "↵" : g.ch));
        const bytesRow = el("div", "char-bytes");
        g.bytes.forEach((b) => {
          const idx = flatIdx++;
          const cell = el("div", "utf8-byte" + (idx === state.textByteIndex ? " selected" : ""), String(b));
          cell.addEventListener("click", () => {
            state.textByteIndex = idx;
            syncPlaintextFromText();
            refreshResults();
            renderMap();
          });
          bytesRow.appendChild(cell);
        });
        card.appendChild(bytesRow);
        grid.appendChild(card);
      });
      results.appendChild(grid);

      const sel = flat[state.textByteIndex];
      const selCh = groups[sel.gi].ch === "\n" ? "↵" : groups[sel.gi].ch;
      const selCard = el("div", "selected-byte-card");
      selCard.appendChild(el("div", "selected-byte-label", t('textprep.selectedLabel', { ch: selCh })));
      staticByte(selCard, sel.value);
      selCard.appendChild(el("div", "selected-byte-value", t('textprep.selectedValue', { val: sel.value, bin: bin8(sel.value) })));
      results.appendChild(selCard);
    }

    input.addEventListener("input", (e) => {
      state.textInput = e.target.value;
      state.textByteIndex = 0;
      syncPlaintextFromText();
      refreshResults();
      renderMap();
    });

    refreshResults();
  }

  function renderPlaintext(panel) {
    panel.classList.add("input-panel");
    panel.appendChild(el("h2", null, t('msg.h')));
    const noByteChosen = utf8FlatBytes(utf8Groups(state.textInput)).length === 0;
    if (noByteChosen) {
      // No text was typed on the previous step, so there's no picked byte to show here —
      // let the user set the plaintext byte by hand instead of silently using a made-up one.
      panel.appendChild(el("p", null, t('msg.pManual')));
      renderByteToggle(panel, state.plaintextBits, render);
    } else {
      renderExplain(panel, "src", { head: t('x.head'), short: t('x.plain'), full: [t('msg.p')] });
      staticByte(panel, plaintextByte());
      panel.appendChild(el("div", "bit-readout", t('readout.bits', { d: plaintextByte() })));
    }
  }

  function renderKey(panel) {
    panel.classList.add("input-panel");
    panel.appendChild(el("h2", null, t('key.h')));
    renderExplain(panel, "key", { head: t('x.head'), short: t('x.key'), full: [t('key.p')] });
    renderByteToggle(panel, state.keyBits, render);
    panel.appendChild(randomBtn('btn.randKey', () => { state.keyBits = bits8(Math.floor(Math.random() * 256)); render(); }));
  }

  // A round's subkey counts as determined only once that round's own rotation has been carried
  // out (all its 1-bit steps, or "Show the result right away") — one round never reveals the
  // others, and "Next" on this screen waits for all four.
  function markKeyRevealed(round) { state.ksRevealed[round] = true; }
  function keysDeterminedCount() {
    let n = 0;
    for (let i = 1; i <= ROUNDS; i++) if (state.ksRevealed[i]) n++;
    return n;
  }

  // Animates exactly one "rotate left by 1 bit" step for the currently selected round:
  // the leftmost bit arcs over the row to land at the end, everything else slides one cell
  // to the left. Uses FLIP (measure old position, apply the state change, measure new
  // position, animate the delta) since the whole panel is torn down and rebuilt on render().
  function stepKeySchedule() {
    const r = state.ksRound;
    const shift = shiftFor(r);
    const s0 = state.ksStep[r];
    if (s0 >= shift) return;
    const wrapId = String(s0 % 8); // original key-bit index that wraps to the back on this step

    const row = document.getElementById("ksRotateRow");
    const beforeRects = {};
    if (row) {
      row.querySelectorAll(".bit-cell").forEach(cell => { beforeRects[cell.dataset.orig] = cell.getBoundingClientRect(); });
    }

    state.ksStep[r] = s0 + 1;
    if (state.ksStep[r] >= shift) markKeyRevealed(r);
    render();

    requestAnimationFrame(() => {
      const newRow = document.getElementById("ksRotateRow");
      if (!newRow) return;
      newRow.querySelectorAll(".bit-cell").forEach(cell => {
        const before = beforeRects[cell.dataset.orig];
        if (!before) return;
        const after = cell.getBoundingClientRect();
        const dx = before.left - after.left, dy = before.top - after.top;
        if (!dx && !dy) return;
        if (cell.dataset.orig === wrapId) {
          cell.style.setProperty("--dx", dx + "px");
          cell.style.setProperty("--dy", dy + "px");
          cell.classList.add("wrap-arc");
        } else {
          cell.style.transition = "none";
          cell.style.transform = `translate(${dx}px, ${dy}px)`;
          cell.getBoundingClientRect(); // force reflow so the next line animates
          cell.style.transition = "transform 0.4s ease";
          cell.style.transform = "translate(0px, 0px)";
        }
      });
    });
  }

  // Flies one small spark from the flipped P bit through the S-box arrow to each output bit
  // that changed, arriving exactly when that bit's own ripple glow starts (read off the inline
  // animation-delay renderSboxPrep already stamped on it) — a physical "watch the change
  // travel" complement to the color-only pulse, in the same spirit as stepKeySchedule's arc.
  function animateAvalancheSparks() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const source = document.querySelector("#avBody .flip-pulse");
    const arrow = document.querySelector("#avBody .arrow-pulse");
    const targets = document.querySelectorAll("#avBody .avalanche");
    if (!source || !arrow || !targets.length || typeof source.animate !== "function") return;
    const center = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
    const src = center(source.getBoundingClientRect());
    const via = center(arrow.getBoundingClientRect());
    targets.forEach((target) => {
      const dst = center(target.getBoundingClientRect());
      const arrival = parseFloat(target.style.animationDelay) || 0; // ms, set by renderSboxPrep
      const duration = Math.min(380, Math.max(200, arrival));
      const delay = Math.max(0, arrival - duration);
      const spark = document.createElement("div");
      spark.className = "avalanche-spark";
      spark.style.left = src.x + "px";
      spark.style.top = src.y + "px";
      document.body.appendChild(spark);
      let anim;
      try {
        anim = spark.animate([
          { transform: "translate(-50%, -50%) scale(0.5)", opacity: 0.9 },
          { transform: `translate(calc(-50% + ${via.x - src.x}px), calc(-50% + ${via.y - src.y}px)) scale(1.1)`, opacity: 1, offset: 0.55 },
          { transform: `translate(calc(-50% + ${dst.x - src.x}px), calc(-50% + ${dst.y - src.y}px)) scale(0.35)`, opacity: 0 },
        ], { duration, delay, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
      } catch (e) { spark.remove(); return; }
      anim.onfinish = () => spark.remove();
      anim.oncancel = () => spark.remove();
    });
  }

  function renderKeySchedule(panel) {
    panel.appendChild(el("h2", null, t('ks.h')));
    renderExplain(panel, "how", { head: t('x.head'), short: t('x.ks'), full: [t('ks.p1'), t('ks.p2'), t('ks.timing'), t('ks.shiftFixed'), t('ks.tabsHint'), t('ks.stepHint')] });

    let nextToVisit = null;
    for (let i = 1; i <= ROUNDS; i++) {
      if (state.ksStep[i] < shiftFor(i)) { nextToVisit = i; break; }
    }
    const tabs = el("div", "round-track ks-tabs");
    for (let i = 1; i <= ROUNDS; i++) {
      const isDone = state.ksStep[i] >= shiftFor(i);
      const isAttention = i === nextToVisit && i !== state.ksRound;
      const pip = el("div", "round-pip" + (i === state.ksRound ? " current" : "") + (isDone ? " done" : "") + (isAttention ? " attention" : ""), String(i));
      pip.addEventListener("click", () => { state.ksRound = i; render(); });
      tabs.appendChild(pip);
    }
    panel.appendChild(tabs);

    const shiftRow = el("div", "mf-bits");
    for (let i = 1; i <= ROUNDS; i++) {
      shiftRow.appendChild(el("div", "mf-chip" + (i === state.ksRound ? " known" : ""), t('ks.shiftChip', { i, shift: shiftFor(i) })));
    }
    panel.appendChild(shiftRow);

    const r = state.ksRound, shift = shiftFor(r), step = state.ksStep[r], done = step >= shift;
    panel.appendChild(el("p", null, t('ks.shiftLine', { r, shift })));

    panel.appendChild(el("div", "half-label", t('ks.masterLabel')));
    renderIndexedByte(panel, state.keyBits, [0, 1, 2, 3, 4, 5, 6, 7]);

    const current = rotateLeftBits(state.keyBits, step);
    const sourceOf = current.map((_, i) => (i + step) % 8);
    panel.appendChild(el("div", "half-label", done ? t('ks.rotatedLabel', { shift }) : t('ks.stepProgress', { step, shift })));
    const row = el("div", "byte-row");
    row.id = "ksRotateRow";
    current.forEach((b, i) => {
      const cls = "bit-cell static idx-bit" + (done && i >= 4 ? " key-slice" : "") + (!done && i === 0 ? " wrap-next" : "");
      const cell = el("div", cls);
      cell.dataset.orig = String(sourceOf[i]);
      cell.innerHTML = `<span class="idx-sub">${t('ks.wasPos', { j: sourceOf[i] })}</span><span class="bit-val">${b}</span>`;
      row.appendChild(cell);
    });
    panel.appendChild(row);

    const btnRow = el("div", "btn-row");
    if (!done) {
      const stepBtn = el("button", "btn btn-gold", t('ks.stepBtn'));
      stepBtn.addEventListener("click", stepKeySchedule);
      btnRow.appendChild(stepBtn);
      const skipBtn = el("button", "btn btn-ghost", t('ks.skipBtn'));
      skipBtn.addEventListener("click", () => { state.ksStep[r] = shift; markKeyRevealed(r); render(); });
      btnRow.appendChild(skipBtn);
    } else {
      const kBits = current.slice(4);
      panel.appendChild(el("div", "bit-readout", t('ks.result', { r, val: bitsToByte(kBits), bin: kBits.join('') })));
      const replayBtn = el("button", "btn btn-ghost", t('ks.replayBtn'));
      replayBtn.addEventListener("click", () => { state.ksStep[r] = 0; render(); });
      btnRow.appendChild(replayBtn);
    }
    panel.appendChild(btnRow);

    panel.appendChild(el("div", "bit-equation", ksSummaryText()));
    renderExplain(panel, "real", { head: t('ks.disclaimerTeaser'), short: t('ks.disclaimerShort'), full: [t('ks.disclaimer')], kind: "warn" });
  }

  // K-values summary string, e.g. "K1=11   K2=?   K3=2   K4=6" — shared by the key-schedule
  // screen and the side map, so both always agree on what's been revealed.
  function ksSummaryText() {
    const parts = [];
    for (let i = 1; i <= ROUNDS; i++) {
      parts.push(state.ksRevealed[i] ? `K${i}=${subkeyValue(i)}` : `K${i}=?`);
    }
    return parts.join('   ');
  }
  function subkeyValue(round) {
    return bitsToByte(rotateLeftBits(state.keyBits, (round * 3) % 8).slice(4));
  }

  function renderSboxPrep(panel) {
    panel.appendChild(el("h2", null, t('sboxprep.h')));
    renderExplain(panel, "what", { head: t('x.head'), short: t('x.sbox'), full: [t('sboxprep.p1'), t('sboxprep.p2'), t('sboxprep.matrixHint'), t('sboxprep.avalancheIntro'), t('sboxprep.bridge')] });

    const isPerm = new Set(SBOX).size === 16;
    panel.appendChild(el("div", "sbox-note " + (isPerm ? "ok" : "bad"), t(isPerm ? 'sboxprep.permYes' : 'sboxprep.permNo')));
    renderSbox(panel, -1, true);

    const demoRow = el("div", "btn-row");
    const demoBtn = el("button", "btn btn-gold", t('sboxprep.demoBtn'));
    demoBtn.addEventListener("click", openAvalancheOverlay);
    demoRow.appendChild(demoBtn);
    panel.appendChild(demoRow);

    renderExplain(panel, "real", { head: t('sboxprep.disclaimerTeaser'), short: t('sboxprep.disclaimerShort'), full: [t('sboxprep.disclaimer')], kind: "warn" });
  }

  // ===== Avalanche-effect demo (a modal opened from Step 5, same pattern as the map's
  // "Detailed status" overlay): flip one bit of a probe value P and watch, in one bigger
  // view, which matrix cell gets looked up and how many output bits F(P) that moves. =====
  function flipAvalancheBit(i) {
    const from = bitsToByte(state.avP);
    state.avP[i] = state.avP[i] ? 0 : 1;
    const to = bitsToByte(state.avP);
    const diff = bits4(SBOX[from]).filter((b, k) => b !== bits4(SBOX[to])[k]).length;
    state.avHistory.unshift({ from, to, bit: i, diff });
    if (state.avHistory.length > 10) state.avHistory.length = 10;
    state.avJustFlipped = true;
    renderAvalancheOverlay();
    requestAnimationFrame(animateAvalancheSparks);
  }

  function renderAvalancheOverlay() {
    // Consumed once: only the render right after a flip gets the animation, so a language
    // switch or any other re-render while the modal is open never replays it.
    const justFlipped = state.avJustFlipped;
    state.avJustFlipped = false;

    const body = document.getElementById("avBody");
    body.innerHTML = "";

    const curVal = bitsToByte(state.avP);
    const last = state.avHistory[0];
    const prevVal = last ? last.from : curVal;
    const flippedIdx = last ? last.bit : -1;
    const fCurBits = bits4(SBOX[curVal]);
    const fPrevBits = bits4(SBOX[prevVal]);
    const fDiffMask = fCurBits.map((b, i) => b !== fPrevBits[i]);

    body.appendChild(el("div", "disclaimer info", t('sboxprep.demoWhy')));
    body.appendChild(el("p", null, t('sboxprep.demoInstr')));

    // A small on-screen key: "solid gold = current lookup" vs "dashed = previous lookup" —
    // shown as swatches, not just described in prose, so it's easy to check the matrix against.
    const legend = el("div", "sbox-legend");
    const legendNow = el("span", "sbox-legend-item now");
    legendNow.appendChild(el("span", "dot")); legendNow.appendChild(document.createTextNode(t('sboxprep.legendNow')));
    legend.appendChild(legendNow);
    const legendPrev = el("span", "sbox-legend-item prev");
    legendPrev.appendChild(el("span", "dot")); legendPrev.appendChild(document.createTextNode(t('sboxprep.legendPrev')));
    legend.appendChild(legendPrev);
    body.appendChild(legend);
    // Where to look, spelled out once, short: which half of P picks the row vs the column —
    // this is the rule the per-flip sentence below always refers back to.
    body.appendChild(el("div", "sbox-axis-hint", t('sboxprep.matrixAxes')));

    // The matrix itself is the main visual: it shows both where P's old value used to look up
    // (dashed, dim gold) and where it looks up now (solid gold) — a bit flip literally moves the
    // highlight from one cell to another, on the same table already introduced in Step 5.
    renderSbox(body, curVal, true, last ? last.from : -1);

    const flow = el("div", "half-pair");

    const pBlock = el("div", "half-block");
    pBlock.appendChild(el("div", "half-label", "P"));
    const pRow = el("div", "byte-row");
    state.avP.forEach((b, i) => {
      const isLast = i === flippedIdx;
      const cell = el("div", "bit-cell" + (isLast ? " diff-bit" : "") + (justFlipped && isLast ? " flip-pulse" : ""), String(b));
      cell.addEventListener("click", () => flipAvalancheBit(i));
      pRow.appendChild(cell);
    });
    pBlock.appendChild(pRow);
    pBlock.appendChild(el("div", "swap-note" + (justFlipped ? " arrow-pulse" : ""), t('sboxprep.arrow')));
    flow.appendChild(pBlock);

    const fBlock = el("div", "half-block");
    fBlock.appendChild(el("div", "half-label", "F(P)"));
    const fRow = el("div", "byte-row");
    // The differing output bits ripple in one after another, left to right, so a single
    // flipped input bit visibly cascades into several changed output bits over time. They
    // then stay highlighted (persistent, not just mid-animation) until the next flip.
    let ripple = 0;
    fCurBits.forEach((b, i) => {
      const isDiff = fDiffMask[i];
      const cell = el("div", "bit-cell static" + (isDiff ? " diff-bit" : ""), String(b));
      if (justFlipped && isDiff) {
        cell.classList.add("avalanche");
        cell.style.animationDelay = (250 + ripple * 160) + "ms";
        ripple++;
      }
      fRow.appendChild(cell);
    });
    fBlock.appendChild(fRow);
    flow.appendChild(fBlock);
    body.appendChild(flow);

    if (last) {
      // Which axis actually moved: bits 0-1 are the matrix ROW (the high half of P), bits 2-3
      // are the COLUMN (the low half) — this is the concrete "why the dashed mark is exactly
      // there" answer for the flip that was just made, not just an abstract rule.
      const axisKey = last.bit < 2 ? 'sboxprep.diffRow' : 'sboxprep.diffCol';
      body.appendChild(el("div", "bit-equation done", t(axisKey, { bit: last.bit + 1, from: bin4(last.from), to: bin4(last.to), n: last.diff })));
    } else {
      body.appendChild(el("div", "bit-readout", t('sboxprep.demoEmpty')));
    }

    const btnRow = el("div", "btn-row");
    const randBtn = el("button", "btn btn-ghost", t('sboxprep.demoRandomBtn'));
    randBtn.addEventListener("click", () => flipAvalancheBit(Math.floor(Math.random() * 4)));
    btnRow.appendChild(randBtn);
    if (state.avHistory.length) {
      const resetBtn = el("button", "btn btn-ghost", t('sboxprep.demoResetBtn'));
      resetBtn.addEventListener("click", () => { state.avP = [0, 0, 0, 0]; state.avHistory = []; state.avJustFlipped = false; renderAvalancheOverlay(); });
      btnRow.appendChild(resetBtn);
    }
    body.appendChild(btnRow);

    if (state.avHistory.length) {
      const avg = (state.avHistory.reduce((sum, h) => sum + h.diff, 0) / state.avHistory.length).toFixed(1);
      body.appendChild(el("div", "map-detail", t('sboxprep.demoStats', { n: state.avHistory.length, avg })));

      const hist = el("div", "av-history");
      state.avHistory.forEach((h, i) => {
        const row = el("div", "av-hist-row" + (i === 0 ? " latest" : ""));
        row.appendChild(el("span", null, `${bin4(h.from)} → ${bin4(h.to)}`));
        row.appendChild(el("span", "av-hist-diff", `${h.diff}/4`));
        hist.appendChild(row);
      });
      body.appendChild(hist);
    }

    document.getElementById("avTitle").textContent = t('sboxprep.demoTitle');
    document.getElementById("avSub").textContent = t('sboxprep.demoSub');
    const avCloseBtn = document.getElementById("avClose");
    avCloseBtn.title = t('map.close');
    avCloseBtn.setAttribute("aria-label", t('map.close'));
  }

  let avOpen = false, avReturnFocus = null;
  function openAvalancheOverlay() {
    avOpen = true;
    avReturnFocus = document.activeElement;
    document.getElementById("avalancheOverlay").hidden = false;
    document.body.style.overflow = "hidden";
    renderAvalancheOverlay();
    document.getElementById("avClose").focus();
  }
  function closeAvalancheOverlay() {
    if (!avOpen) return;
    avOpen = false;
    document.getElementById("avalancheOverlay").hidden = true;
    document.body.style.overflow = "";
    if (avReturnFocus && avReturnFocus.focus) avReturnFocus.focus();
  }


  function renderRounds(panel) {
    const trace = encryptionTrace();
    const r = state.round, p = r - 1;
    const step = trace.trace[r];
    const prev = trace.trace[p];
    const Rp = bits4(step.prevR), Kr = bits4(step.K), Lp = bits4(step.prevL), Fv = bits4(step.Fv);

    panel.appendChild(el("h2", null, t('rounds.h', { r, tot: ROUNDS })));
    roundTrack(panel, r, ROUNDS);
    renderExplain(panel, "round", { head: t('x.head'), short: t('x.rounds'), full: [t('rounds.intro'), t('x.roundsFormula')] });

    const halves = el("div", "half-pair");
    renderHalf(halves, `L${p}`, "left", bits4(prev.L));
    renderHalf(halves, `R${p}`, "right", bits4(prev.R));
    panel.appendChild(halves);

    panel.appendChild(el("div", "stage-label", t('rounds.stage.' + state.roundStage)));

    if (state.roundStage === 'xor1') {
      panel.appendChild(el("p", null, t('rounds.a', { r, p })));
      renderBitStepper(panel, `R${p}`, Rp, `K${r}`, Kr, "X", state.revealed, state.xorPending);
    } else if (state.roundStage === 'sbox') {
      panel.appendChild(el("p", null, t('rounds.xor1.done', { p, r, x: step.X })));
      panel.appendChild(el("p", null, t('rounds.sboxRecap', { x: step.X })));
      renderSbox(panel, step.X, true);
      panel.appendChild(el("p", null, t('rounds.gotF', { f: step.Fv, fbin: bin4(step.Fv) })));
    } else if (state.roundStage === 'xor2') {
      panel.appendChild(el("p", null, t('rounds.c', { p, r })));
      renderBitStepper(panel, `L${p}`, Lp, "F", Fv, `R${r}`, state.revealed, state.xorPending);
    } else {
      panel.appendChild(el("div", "swap-note", t('rounds.swap', { r, p })));
      const halves2 = el("div", "half-pair");
      renderHalf(halves2, `L${r}`, "left", bits4(step.L));
      renderHalf(halves2, `R${r}`, "right", bits4(step.R));
      panel.appendChild(halves2);
      if (r === ROUNDS) panel.appendChild(el("div", "disclaimer info", t('rounds.last')));
    }
  }

  function renderCipher(panel) {
    const trace = encryptionTrace();
    panel.appendChild(el("h2", null, t('cipher.h')));
    renderExplain(panel, "swap", { head: t('x.head'), short: t('x.cipher'), full: [t('cipher.p')] });

    const halves = el("div", "half-pair");
    renderHalf(halves, t('cipher.lAfter'), "left", bits4(trace.finalSwapped.L));
    renderHalf(halves, t('cipher.rAfter'), "right", bits4(trace.finalSwapped.R));
    panel.appendChild(halves);

    staticByte(panel, trace.outByte);
    panel.appendChild(el("div", "bit-readout", t('cipher.readout', { v: trace.outByte })));
    panel.appendChild(el("p", null, t('cipher.alice')));
  }

  function renderDecrypt(panel) {
    const cipherByte = encryptionTrace().outByte;
    panel.appendChild(el("h2", null, t('dec.h')));
    renderExplain(panel, "bob", { head: t('x.head'), short: t('x.dec'), full: [t('dec.p', { c: cipherByte })] });

    if (!state.decRunning && state.decRound === 0) {
      panel.appendChild(el("div", "half-label", t('dec.cipherLabel')));
      staticByte(panel, cipherByte);
      const btnRow = el("div", "btn-row", "");
      const playBtn = el("button", "btn btn-gold", t('btn.decrypt'));
      playBtn.addEventListener("click", () => { state.decRunning = true; state.decRound = 1; render(); });
      btnRow.appendChild(playBtn);
      panel.appendChild(btnRow);
      return;
    }

    const dec = decryptionTrace(cipherByte);
    const r = Math.min(state.decRound, ROUNDS);
    const step = dec.trace[r];
    const prev = dec.trace[r - 1];

    roundTrack(panel, r, ROUNDS);
    panel.appendChild(el("p", null, t('dec.round', { r, tot: ROUNDS, k: step.usedKeyIndex })));

    const halves = el("div", "half-pair");
    renderHalf(halves, "L", "left", bits4(prev.L));
    renderHalf(halves, "R", "right", bits4(prev.R));
    panel.appendChild(halves);
    panel.appendChild(el("div", "swap-note", t('dec.newHalves')));
    const halves2 = el("div", "half-pair");
    renderHalf(halves2, "L", "left", bits4(step.L));
    renderHalf(halves2, "R", "right", bits4(step.R));
    panel.appendChild(halves2);

    if (r < ROUNDS) {
      const btnRow = el("div", "btn-row", "");
      const nextBtn = el("button", "btn btn-gold", t('btn.nextRound'));
      nextBtn.addEventListener("click", () => { state.decRound++; render(); });
      btnRow.appendChild(nextBtn);
      panel.appendChild(btnRow);
    } else {
      const recovered = dec.outByte, original = plaintextByte();
      panel.appendChild(el("p", null, t('dec.final')));
      staticByte(panel, recovered);
      panel.appendChild(el("div", "bit-readout", t('dec.readout', { rec: recovered, orig: original })));
      const match = recovered === original;
      panel.appendChild(el("div", "disclaimer " + (match ? "success" : "info"), t(match ? 'dec.ok' : 'dec.bad')));
    }
  }

  function renderSummary(panel) {
    panel.appendChild(el("h2", null, t('sum.h')));
    renderExplain(panel, "idea", { head: t('x.headIdea'), short: t('x.sumIdea'), full: [t('sum.p1')] });
    renderExplain(panel, "history", { head: t('x.headHist'), short: t('x.sumHist'), full: [t('sum.p2')] });
    renderExplain(panel, "real", { head: t('sum.disclaimerTeaser'), short: t('sum.disclaimerShort'), full: [t('sum.disclaimer')], kind: "warn" });
    const btnRow = el("div", "btn-row", "");
    const restartBtn = el("button", "btn btn-primary", t('btn.retry'));
    restartBtn.addEventListener("click", () => {
      state.phase = PHASES.indexOf('textprep'); state.round = 1; resetRoundStage();
      state.decRunning = false; state.decRound = 0;
      render();
    });
    btnRow.appendChild(restartBtn);
    panel.appendChild(btnRow);
  }

  const RENDERERS = [renderIntro, renderTextPrep, renderPlaintext, renderKey, renderKeyDelivery, renderKeySchedule, renderSboxPrep, renderRounds, renderCipher, renderTransmit, renderDecrypt, renderSummary];
  const ROUNDS_PHASE_IDX = PHASES.indexOf("rounds");


  // ===== Key centre & channels (same component in the Feistel and SPN games) =====
  // The key is never sent between Alice and Bob: a third party, the key centre, hands the
  // same key to both of them over protected channels before any message is exchanged. Only
  // the ciphertext travels over the open channel, where Eve can copy it but can't use it.
  // Each game supplies netKeyValue() / netCipherValue() — short display strings that also
  // tell whether what was delivered still matches the current key / ciphertext.
  const NET_POS = { kc: [50, 25], alice: [15, 60], bob: [85, 60], eve: [50, 82] };
  function netReduced() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  function keyDelivered() { return state.kdFor === netKeyValue(); }
  function cipherSent() { return state.txFor === netCipherValue(); }

  // o: { focus: 'key' | 'cipher', kc|alice|bob|eve: [{ cls, text }, ...] }
  function renderNet(container, o) {
    const net = el("div", "net net-" + o.focus);
    const line = (a, b, cls) => `<line class="ln ${cls}" x1="${NET_POS[a][0]}" y1="${NET_POS[a][1]}" x2="${NET_POS[b][0]}" y2="${NET_POS[b][1]}"/>`;
    net.innerHTML = '<svg class="net-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      line("kc", "alice", "ln-key") + line("kc", "bob", "ln-key") + line("alice", "bob", "ln-open") +
      `<line class="ln ln-eve" x1="50" y1="${NET_POS.alice[1]}" x2="50" y2="${NET_POS.eve[1]}"/></svg>`;
    const label = (text, x, y, cls) => { const l = el("div", "net-lbl " + cls, text); l.style.left = x + "%"; l.style.top = y + "%"; net.appendChild(l); };
    label(t('net.keyCh'), (NET_POS.kc[0] + NET_POS.alice[0]) / 2, (NET_POS.kc[1] + NET_POS.alice[1]) / 2, "key");
    label(t('net.keyCh'), (NET_POS.kc[0] + NET_POS.bob[0]) / 2, (NET_POS.kc[1] + NET_POS.bob[1]) / 2, "key");
    label(t('net.openCh'), 50, NET_POS.alice[1] - 6, "open");
    const node = (id, icon, name, sub) => {
      const n = el("div", "net-node nn-" + id);
      n.dataset.node = id;
      n.style.left = NET_POS[id][0] + "%"; n.style.top = NET_POS[id][1] + "%";
      n.innerHTML = `<div class="nn-icon">${icon}</div><div class="nn-name">${name}</div>` + (sub ? `<div class="nn-sub">${sub}</div>` : "");
      const slots = el("div", "nn-slots");
      (o[id] || []).forEach(c => slots.appendChild(el("span", "nn-chip " + c.cls, c.text)));
      n.appendChild(slots);
      net.appendChild(n);
    };
    node("kc", t('net.kcIcon'), t('net.kc'), t('net.kcSub'));
    node("alice", t('net.aliceIcon'), t('net.alice'));
    node("bob", t('net.bobIcon'), t('net.bob'));
    node("eve", t('net.eveIcon'), t('net.eve'));
    container.appendChild(net);
    return net;
  }

  // Flies packets between node icons (or from a point on the open channel, for Eve's copy).
  function netFly(list, onDone) {
    const net = document.querySelector(".net");
    let end = 0;
    if (net && !netReduced()) {
      const r0 = net.getBoundingClientRect();
      const at = id => { const r = net.querySelector(`[data-node="${id}"] .nn-icon`).getBoundingClientRect(); return { x: r.left + r.width / 2 - r0.left, y: r.top + r.height / 2 - r0.top }; };
      list.forEach(p => {
        const a = p.fromMid ? { x: r0.width * 0.5, y: r0.height * NET_POS.alice[1] / 100 } : at(p.from), b = at(p.to);
        const d = el("div", "net-packet " + p.cls, p.label);
        d.style.left = a.x + "px"; d.style.top = a.y + "px";
        net.appendChild(d);
        end = Math.max(end, (p.delay || 0) + p.dur);
        if (typeof d.animate !== "function") { d.remove(); return; }
        const move = `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px))`;
        const anim = d.animate([
          { transform: "translate(-50%, -50%) scale(0.5)", opacity: 0 },
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.12 },
          { transform: move + " scale(1)", opacity: 1, offset: 0.9 },
          { transform: move + " scale(0.4)", opacity: 0 },
        ], { duration: p.dur, delay: p.delay || 0, easing: "ease-in-out", fill: "forwards" });
        anim.onfinish = anim.oncancel = () => d.remove();
      });
    }
    setTimeout(onDone, end + 60);
  }
  function netSend(phaseName, packets, onArrive) {
    if (state.netBusy) return;
    state.netBusy = true;
    render();
    requestAnimationFrame(() => netFly(packets, () => {
      state.netBusy = false;
      if (PHASES[state.phase] === phaseName) { onArrive(); state.netPop = true; }
      render();
    }));
  }
  function deliverKey() {
    netSend("keydelivery", [
      { from: "kc", to: "alice", cls: "k", label: "K", dur: 1500 },
      { from: "kc", to: "bob", cls: "k", label: "K", dur: 1500 },
    ], () => { state.kdFor = netKeyValue(); });
  }
  function sendCipher() {
    netSend("transmit", [
      { from: "alice", to: "bob", cls: "c", label: "C", dur: 2000 },
      { fromMid: true, to: "eve", cls: "c ghost", label: "C", dur: 700, delay: 1000 },
    ], () => { state.txFor = netCipherValue(); });
  }
  function netButtons(panel, done, btnKey, action) {
    const row = el("div", "btn-row");
    const b = el("button", "btn " + (done ? "btn-ghost net-replay" : "btn-gold net-send"), t(done ? 'btn.netReplay' : btnKey));
    b.disabled = state.netBusy;
    b.addEventListener("click", action);
    row.appendChild(b);
    panel.appendChild(row);
  }

  function renderKeyDelivery(panel) {
    const pop = state.netPop ? " pop" : "";
    state.netPop = false;
    panel.appendChild(el("h2", null, t('kd.h')));
    renderExplain(panel, "why", { head: t('x.head'), short: t('x.kd'), full: [t('kd.p1'), t('kd.p2'), t('kd.p3')] });
    const k = netKeyValue(), done = keyDelivered() && !state.netBusy;
    const got = done ? { cls: "k" + pop, text: `K = ${k}` } : { cls: "none", text: "K = ?" };
    renderNet(panel, { focus: "key", kc: [{ cls: "k", text: `K = ${k}` }], alice: [got], bob: [got], eve: [{ cls: "no", text: "K = ?" }] });
    panel.appendChild(el("div", "bit-equation" + (done ? " done" : ""), t(done ? 'kd.done' : state.netBusy ? 'kd.flying' : 'kd.waiting')));
    renderExplain(panel, "real", { head: t('kd.realTeaser'), short: t('kd.realShort'), full: ['kd.real1', 'kd.real2', 'kd.real3'].filter(k => I18N.ru[k]).map(k => t(k)), kind: "warn" });
    netButtons(panel, done, 'kd.btn', deliverKey);
  }
  function renderTransmit(panel) {
    const pop = state.netPop ? " pop" : "";
    state.netPop = false;
    panel.appendChild(el("h2", null, t('tx.h')));
    renderExplain(panel, "why", { head: t('x.head'), short: t('x.tx'), full: [t('tx.p1'), t('tx.p2')] });
    const k = netKeyValue(), c = netCipherValue(), done = cipherSent() && !state.netBusy;
    const got = done ? { cls: "c" + pop, text: `C = ${c}` } : { cls: "none", text: "C = ?" };
    renderNet(panel, { focus: "cipher",
      kc: [{ cls: "k", text: `K = ${k}` }],
      alice: [{ cls: "k", text: "K" }, { cls: "c", text: `C = ${c}` }],
      bob: [{ cls: "k", text: "K" }, got],
      eve: [got, { cls: "no", text: "K = ?" }] });
    panel.appendChild(el("div", "bit-equation" + (done ? " done" : ""), t(done ? 'tx.done' : state.netBusy ? 'tx.flying' : 'tx.waiting')));
    netButtons(panel, done, 'tx.btn', sendCipher);
  }

  function netKeyValue() { return String(keyByte()); }
  function netCipherValue() { return String(encryptionTrace().outByte); }

  // ===== Navigation =====
  function enterPhase(name) {
    if (name === 'rounds') { state.round = 1; resetRoundStage(); revealNextXorBit(); }
    if (name === 'decrypt') { state.decRunning = false; state.decRound = 0; }
  }
  function enterPhaseFromBack(name) {
    if (name === 'rounds') { state.round = ROUNDS; state.roundStage = 'done'; state.revealed = 4; }
  }

  // Advances the bit-by-bit XOR reveal by one step, but not instantly: the slot stays a
  // glowing "?" for a beat after the request before the computed bit appears, so the reveal
  // reads as a small suspenseful "combine these two bits..." moment rather than a flat toggle.
  // While the automatic mode is on, the beat is shorter and the next bit follows by itself.
  function revealNextXorBit() {
    if (state.xorPending) return;
    const expect = { phase: state.phase, round: state.round, stage: state.roundStage, revealed: state.revealed };
    state.xorPending = true;
    render();
    setTimeout(() => {
      // If the user navigated away during the delay (e.g. jumped back via the map), drop it.
      if (state.phase !== expect.phase || state.round !== expect.round || state.roundStage !== expect.stage || state.revealed !== expect.revealed) { state.xorAuto = false; return; }
      state.xorPending = false;
      state.revealed++;
      if (state.xorAuto && state.revealed >= 4) state.xorAuto = false;
      render();
      if (state.xorAuto) revealNextXorBit();
    }, state.xorAuto ? 380 : 1000);
  }

  // "Finish automatically": runs every remaining bit of the current sum one after another.
  function autoRevealXor() {
    if (state.revealed >= 4) return;
    state.xorAuto = true;
    if (state.xorPending) return; // the in-flight bit will chain into the rest when it lands
    revealNextXorBit();
  }

  // Why the nav "Next" is currently disabled, or null if it can be used. The bit-by-bit sums are
  // advanced by their own buttons inside the form, and the key schedule has to actually be done.
  function nextLock() {
    const name = PHASES[state.phase];
    if (state.netBusy) return "busy";
    if (name === "keydelivery" && !keyDelivered()) return "kd";
    if (name === "transmit" && !cipherSent()) return "tx";
    if (name === "keyschedule") {
      if (keysDeterminedCount() < ROUNDS) return "ks";
    }
    if (name === "rounds" && (state.roundStage === "xor1" || state.roundStage === "xor2") && (state.revealed < 4 || state.xorPending)) return "xor";
    return null;
  }

  function goNext() {
    if (nextLock()) return;
    const name = PHASES[state.phase];
    if (name === "rounds") {
      if (state.roundStage === 'xor1') { state.roundStage = 'sbox'; render(); return; }
      if (state.roundStage === 'sbox') { state.roundStage = 'xor2'; state.revealed = 0; revealNextXorBit(); return; }
      if (state.roundStage === 'xor2') { state.roundStage = 'done'; render(); return; }
      // roundStage === 'done'
      if (state.round < ROUNDS) { state.round++; resetRoundStage(); revealNextXorBit(); return; }
      // else fall through and advance to the next phase
    }
    if (state.phase < PHASES.length - 1) {
      state.phase++;
      enterPhase(PHASES[state.phase]);
      render();
    }
  }

  function goBack() {
    if (state.xorPending || state.xorAuto || state.netBusy) return; // ignore Back while something is mid-animation
    const name = PHASES[state.phase];
    if (name === "rounds") {
      if (state.roundStage === 'done') { state.roundStage = 'xor2'; state.revealed = 4; render(); return; }
      if (state.roundStage === 'xor2') {
        if (state.revealed > 0) { state.revealed--; render(); return; }
        state.roundStage = 'sbox'; render(); return;
      }
      if (state.roundStage === 'sbox') { state.roundStage = 'xor1'; state.revealed = 4; render(); return; }
      // roundStage === 'xor1'
      if (state.revealed > 0) { state.revealed--; render(); return; }
      if (state.round > 1) { state.round--; state.roundStage = 'done'; state.revealed = 4; render(); return; }
      // else round === 1 and revealed === 0: fall through to the previous phase
    }
    if (state.phase > 0) {
      state.phase--;
      enterPhaseFromBack(PHASES[state.phase]);
      render();
    }
  }

  function renderNav(nav) {
    nav.innerHTML = "";
    const backBtn = el("button", "btn btn-ghost nav-back", t('btn.back'));
    backBtn.disabled = state.phase === 0 || state.xorPending || state.xorAuto || state.netBusy;
    backBtn.addEventListener("click", goBack);
    nav.appendChild(backBtn);

    const isLast = state.phase === PHASES.length - 1;
    const isDecryptPhase = PHASES[state.phase] === "decrypt";
    const decryptDone = state.decRunning && state.decRound >= ROUNDS;
    if (!isLast && (!isDecryptPhase || decryptDone)) {
      const nextBtn = el("button", "btn btn-primary nav-next", t('btn.next'));
      const lock = nextLock();
      nextBtn.disabled = state.xorPending || !!lock;
      nextBtn.addEventListener("click", () => { goNext(); document.querySelector(".main-layout").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
      nav.appendChild(nextBtn);
      const hint = { ks: 'nav.lockKs', xor: 'nav.lockXor', kd: 'nav.lockKd', tx: 'nav.lockTx' }[lock];
      if (hint) nav.appendChild(el("div", "nav-hint", t(hint, { n: keysDeterminedCount(), tot: ROUNDS })));
    }
  }

  function renderDots() {
    const dots = document.getElementById("stepDots");
    dots.innerHTML = "";
    PHASES.forEach((_, i) => dots.appendChild(el("div", "step-dot" + (i < state.phase ? " done" : i === state.phase ? " current" : ""))));
    document.getElementById("stepLabel").textContent = t('phase.' + PHASES[state.phase]);
  }

  // ===== Side map: the whole pipeline at a glance, with what's done, current and upcoming =====
  // Jumping is only ever allowed onto an already-"done" node — you can go back and review
  // any earlier result, but you can't skip ahead of where Next has actually taken you.
  function jumpToPhase(idx) {
    if (idx === state.phase || state.xorPending || state.xorAuto || state.netBusy) return;
    state.phase = idx;
    enterPhaseFromBack(PHASES[state.phase]);
    render();
  }
  function jumpToRound(round) {
    if (state.xorPending || state.xorAuto || state.netBusy) return;
    state.phase = ROUNDS_PHASE_IDX;
    state.round = round;
    state.roundStage = 'done';
    state.revealed = 4;
    render();
  }
  function statusOfPhaseNode(idx) {
    return state.phase < idx ? 'upcoming' : state.phase > idx ? 'done' : 'current';
  }
  function statusOfRoundNode(round) {
    if (state.phase < ROUNDS_PHASE_IDX) return 'upcoming';
    if (state.phase > ROUNDS_PHASE_IDX) return 'done';
    if (round < state.round) return 'done';
    if (round > state.round) return 'upcoming';
    return state.roundStage === 'done' ? 'done' : 'current';
  }

  const MAP_NODES = [
    { type: 'phase', name: 'textprep' }, { type: 'phase', name: 'plaintext' }, { type: 'phase', name: 'key' }, { type: 'phase', name: 'keydelivery' },
    { type: 'phase', name: 'keyschedule' }, { type: 'phase', name: 'sboxprep' },
    { type: 'round', round: 1 }, { type: 'round', round: 2 }, { type: 'round', round: 3 }, { type: 'round', round: 4 },
    { type: 'phase', name: 'cipher' }, { type: 'phase', name: 'transmit' }, { type: 'phase', name: 'decrypt' }, { type: 'phase', name: 'summary' },
  ];
  MAP_NODES.forEach(n => { if (n.type === 'phase') n.idx = PHASES.indexOf(n.name); });

  // Small bit-cell row, e.g. for showing the plaintext/key/ciphertext byte inside the map.
  function miniBits(bitsArray) {
    const row = el("div", "mf-bits");
    bitsArray.forEach(b => row.appendChild(el("div", "mf-bit" + (b ? " on" : ""), String(b))));
    return row;
  }

  // K1..K4 as small chips — gold once that round's subkey has been revealed, dim otherwise.
  function miniSubkeys() {
    const row = el("div", "mf-bits");
    for (let i = 1; i <= ROUNDS; i++) {
      const known = state.ksRevealed[i];
      row.appendChild(el("div", "mf-chip" + (known ? " known" : ""), known ? `K${i}=${subkeyValue(i)}` : `K${i}=?`));
    }
    return row;
  }

  function miniPips(current, total) {
    const row = el("div", "mf-bits");
    for (let i = 1; i <= total; i++) {
      row.appendChild(el("div", "mf-pip" + (i < current ? " done" : i === current ? " current" : "")));
    }
    return row;
  }

  // Compact schematic of one Feistel round: R⊕K -> S-box -> ⊕L, with the active stage
  // highlighted, and numbers filled in only as far as the main panel has already revealed
  // them (so the map never spoils a bit-by-bit reveal in progress).
  function miniFeistelDiagram(round, status) {
    const box = el("div", "mf mf-" + status);
    const p = round - 1;
    if (status === "upcoming") {
      box.innerHTML =
        `<div class="mf-row"><div class="mf-cell mf-hd">L${p}</div><div class="mf-cell mf-hd">R${p}</div></div>` +
        `<div class="mf-down">↓</div><div class="mf-step"><span class="mf-tag">⊕ K${round}</span></div>` +
        '<div class="mf-down">↓</div><div class="mf-step"><span class="mf-tag">S-box</span></div>' +
        `<div class="mf-down">↓</div><div class="mf-step"><span class="mf-tag">⊕ L${p}</span></div>` +
        `<div class="mf-down">↓</div><div class="mf-row"><div class="mf-cell mf-hd">L${round}</div><div class="mf-cell mf-hd">R${round}</div></div>`;
      return box;
    }
    const step = encryptionTrace().trace[round];
    const stage = status === "done" ? "done" : state.roundStage;
    const knowXF = stage !== "xor1";
    const knowDone = stage === "done";
    // K's own value is never a spoiler here: the round's main panel already shows K's bits
    // directly as soon as this round starts, regardless of the key-schedule screen.
    box.innerHTML =
      `<div class="mf-row"><div class="mf-cell">L${p}=${step.prevL}</div><div class="mf-cell">R${p}=${step.prevR}</div></div>` +
      '<div class="mf-down">↓</div>' +
      `<div class="mf-step${stage === "xor1" ? " active" : ""}"><span class="mf-tag">⊕ K${round}=${step.K}</span>${knowXF ? `<span class="mf-eq">= ${step.X}</span>` : ""}</div>` +
      '<div class="mf-down">↓</div>' +
      `<div class="mf-step${stage === "sbox" ? " active" : ""}"><span class="mf-tag">S-box</span>${knowXF ? `<span class="mf-eq">= ${step.Fv}</span>` : ""}</div>` +
      '<div class="mf-down">↓</div>' +
      `<div class="mf-step${stage === "xor2" ? " active" : ""}"><span class="mf-tag">⊕ L${p}</span>${knowDone ? `<span class="mf-eq">= ${step.R}</span>` : ""}</div>` +
      '<div class="mf-down">↓</div>' +
      `<div class="mf-row"><div class="mf-cell">${knowDone ? `L${round}=${step.L}` : "?"}</div><div class="mf-cell">${knowDone ? `R${round}=${step.R}` : "?"}</div></div>`;
    return box;
  }

  // Appends whatever rich visual (and short text) belongs inside a given map node's body.
  function appendMapVisual(bodyEl, node, status) {
    if (node.type === "round") {
      bodyEl.appendChild(miniFeistelDiagram(node.round, status));
      return;
    }
    if (status === "upcoming") return;
    switch (node.name) {
      case 'textprep': {
        const flat = utf8FlatBytes(utf8Groups(state.textInput));
        const sel = flat[Math.min(state.textByteIndex, Math.max(flat.length - 1, 0))];
        const shown = textPreview(state.textInput, 22);
        bodyEl.appendChild(el("div", "map-detail", !state.textInput ? t('map.noText') : sel ? `"${shown}" → ${sel.value}` : `"${shown}"`));
        return;
      }
      case 'plaintext': bodyEl.appendChild(miniBits(state.plaintextBits)); return;
      case 'key': bodyEl.appendChild(miniBits(state.keyBits)); return;
      case 'keyschedule': bodyEl.appendChild(miniSubkeys()); return;
      case 'sboxprep': bodyEl.appendChild(el("div", "map-detail", t('map.sboxReady'))); return;
      case 'cipher': bodyEl.appendChild(miniBits(bits8(encryptionTrace().outByte))); return;
      case 'keydelivery': bodyEl.appendChild(el("div", "map-detail", t(keyDelivered() ? 'map.kdDone' : 'map.kdWait'))); return;
      case 'transmit': bodyEl.appendChild(el("div", "map-detail", cipherSent() ? `C = ${netCipherValue()} → ${t('map.txDone')}` : t('map.txWait'))); return;
      case 'decrypt': {
        if (!state.decRunning) return;
        bodyEl.appendChild(miniPips(state.decRound >= ROUNDS ? ROUNDS + 1 : state.decRound, ROUNDS));
        if (state.decRound < ROUNDS) {
          bodyEl.appendChild(el("div", "map-detail", t('map.progress', { r: state.decRound, tot: ROUNDS })));
        } else {
          const dec = decryptionTrace(encryptionTrace().outByte);
          bodyEl.appendChild(el("div", "map-detail", dec.outByte === plaintextByte() ? t('map.match') : t('map.mismatch')));
        }
        return;
      }
      default: return;
    }
  }

  // The map scrolls inside its card. Re-rendering rebuilds it from scratch, so the scroll
  // position is restored each time, and only glides to the current node when that node changes.
  let lastMapFocus = -1, mapGlideUntil = 0;
  function renderMap() {
    const body = document.getElementById("mapBody");
    const prevTop = body.scrollTop;
    body.innerHTML = "";
    let focusRow = null, focusIdx = -1;
    MAP_NODES.forEach((node, i) => {
      const status = nodeStatus(node);
      const label = node.type === 'round' ? t('map.round', { r: node.round }) : t('phase.' + node.name);

      const row = el("div", "map-node " + status);
      const dotCol = el("div", "map-dot-col");
      dotCol.appendChild(el("div", "map-dot"));
      if (i < MAP_NODES.length - 1) dotCol.appendChild(el("div", "map-line"));
      row.appendChild(dotCol);

      const body_ = el("div", "map-body");
      body_.appendChild(el("div", "map-label", label));
      appendMapVisual(body_, node, status);
      row.appendChild(body_);

      if (status === 'done') {
        row.classList.add("clickable");
        row.addEventListener("click", () => node.type === 'round' ? jumpToRound(node.round) : jumpToPhase(node.idx));
      }
      if (status === 'current') { focusRow = row; focusIdx = i; }
      body.appendChild(row);
    });
    body.scrollTop = prevTop;
    if (focusRow && focusIdx !== lastMapFocus) { lastMapFocus = focusIdx; mapGlideUntil = performance.now() + 700; }
    // Navigation can trigger several renders back-to-back, and each rebuild cancels a smooth scroll
    // in flight — so for a moment after the current node changes, every render re-issues the glide.
    if (focusRow && performance.now() < mapGlideUntil) {
      // Centre it (not pin it to the top), so the steps already done stay visible above.
      const centred = focusRow.offsetTop + focusRow.offsetHeight / 2 - body.clientHeight / 2;
      body.scrollTo({ top: Math.max(0, centred), behavior: "smooth" });
    }
  }

  // ===== Detailed-status overlay (the map's expand button) =====
  // A floating window over the page: every step with its status, what it does, and — once it's
  // done — what it produced. Upcoming steps only say what they will do (no spoilers).
  const overlayEl = document.getElementById("mapOverlay");
  let overlayOpen = false, overlayReturnFocus = null;

  function nodeStatus(node) { return node.type === 'round' ? statusOfRoundNode(node.round) : statusOfPhaseNode(node.idx); }
  function bytePreview(byte) { return t('textprep.selectedValue', { val: byte, bin: bin8(byte) }); }

  function appendOverlayDetail(main, node, status) {
    if (node.type === "round") {
      const r = node.round, p = r - 1, step = encryptionTrace().trace[r];
      const stageIdx = status === "done" ? 4 : status === "upcoming" ? -1 : ["xor1", "sbox", "xor2", "done"].indexOf(state.roundStage);
      const subs = [
        ["xor1", `R${p} ⊕ K${r} = ${bin4(step.X)} (${step.X})`],
        ["sbox", `S(${step.X}) = ${bin4(step.Fv)} (${step.Fv})`],
        ["xor2", `L${p} ⊕ F = ${bin4(step.R)} → R${r} = ${step.R}`],
        ["swap", `L${r} = ${step.L}, R${r} = ${step.R}`],
      ];
      const list = el("div", "ov-subs");
      subs.forEach(([key, val], i) => {
        const st = i < stageIdx ? "done" : i === stageIdx ? "current" : "upcoming";
        const row = el("div", "ov-sub " + st);
        row.appendChild(el("span", "ov-sub-ico", st === "done" ? "✓" : st === "current" ? "▶" : "○"));
        row.appendChild(el("span", null, t('map.sub.' + key)));
        if (st === "done") row.appendChild(el("span", "ov-sub-val", val));
        else if (st === "current" && (key === "xor1" || key === "xor2")) row.appendChild(el("span", "ov-sub-val", t('map.bitsProgress', { i: state.revealed })));
        list.appendChild(row);
      });
      main.appendChild(list);
      return;
    }
    if (status === "upcoming") return;
    switch (node.name) {
      case 'textprep': {
        const flat = utf8FlatBytes(utf8Groups(state.textInput));
        const sel = flat[Math.min(state.textByteIndex, Math.max(flat.length - 1, 0))];
        main.appendChild(el("div", "ov-result", sel ? `«${textPreview(state.textInput, 40)}» → ${bytePreview(sel.value)}` : t('map.noText')));
        return;
      }
      case 'plaintext': main.appendChild(miniBits(state.plaintextBits)); main.appendChild(el("div", "ov-result", bytePreview(plaintextByte()))); return;
      case 'key': main.appendChild(miniBits(state.keyBits)); main.appendChild(el("div", "ov-result", bytePreview(keyByte()))); return;
      case 'keyschedule': appendMapVisual(main, node, status); return;
      case 'sboxprep': main.appendChild(el("div", "ov-result", t('map.sboxReady'))); return;
      case 'cipher': { const c = encryptionTrace().outByte; main.appendChild(miniBits(bits8(c))); main.appendChild(el("div", "ov-result", bytePreview(c))); return; }
      case 'keydelivery': case 'transmit': appendMapVisual(main, node, status); return;
      case 'decrypt':
        if (state.decRunning) appendMapVisual(main, node, status);
        else main.appendChild(el("div", "map-detail", t('map.decNotStarted')));
        return;
      default: return;
    }
  }

  function renderOverlay(scrollToCurrent) {
    const body = document.getElementById("ovBody");
    const prevTop = body.scrollTop;
    body.innerHTML = "";
    let done = 0, currentEl = null;
    MAP_NODES.forEach((node, i) => {
      const status = nodeStatus(node);
      if (status === "done") done++;
      const label = node.type === 'round' ? t('map.round', { r: node.round }) : t('phase.' + node.name);
      const card = el("div", "ov-step " + status);
      card.appendChild(el("div", "ov-icon", status === "done" ? "✓" : status === "current" ? "▶" : String(i + 1)));
      const main = el("div", "ov-main");
      const top = el("div", "ov-top");
      top.appendChild(el("div", "ov-name", `${i + 1}. ${label}`));
      top.appendChild(el("div", "ov-pill", t('map.st.' + status)));
      main.appendChild(top);
      main.appendChild(el("div", "ov-what", t(node.type === 'round' ? 'map.d.round' : 'map.d.' + node.name)));
      appendOverlayDetail(main, node, status);
      if (status === "done") {
        main.appendChild(el("div", "ov-goto", t('map.goto')));
        card.classList.add("clickable");
        card.tabIndex = 0; card.setAttribute("role", "button");
        const go = () => { closeOverlay(); if (node.type === 'round') jumpToRound(node.round); else jumpToPhase(node.idx); };
        card.addEventListener("click", go);
        card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      }
      card.appendChild(main);
      if (status === "current") currentEl = card;
      body.appendChild(card);
    });
    document.getElementById("ovTitle").textContent = t('map.detailTitle');
    document.getElementById("ovSub").textContent = t('map.progressAll', { done, tot: MAP_NODES.length });
    document.getElementById("ovBar").style.width = Math.round(done / MAP_NODES.length * 100) + "%";
    const closeBtn = document.getElementById("ovClose");
    closeBtn.title = t('map.close'); closeBtn.setAttribute("aria-label", t('map.close'));
    body.scrollTop = prevTop;
    if (scrollToCurrent && currentEl) body.scrollTop = Math.max(0, currentEl.offsetTop - 70);
  }

  function openOverlay() {
    overlayOpen = true;
    overlayReturnFocus = document.activeElement;
    overlayEl.hidden = false;
    document.body.style.overflow = "hidden";
    renderOverlay(true);
    document.getElementById("ovClose").focus();
  }
  function closeOverlay() {
    if (!overlayOpen) return;
    overlayOpen = false;
    overlayEl.hidden = true;
    document.body.style.overflow = "";
    if (overlayReturnFocus && overlayReturnFocus.focus) overlayReturnFocus.focus();
  }

  function render() {
    renderDots();
    const panel = el("div", "panel");
    RENDERERS[state.phase](panel);
    const holder = document.getElementById("stepPanel");
    const prevScroll = holder.firstElementChild ? holder.firstElementChild.scrollTop : 0;
    holder.innerHTML = "";
    holder.appendChild(panel);
    // A new step starts at the top of the card; re-renders inside a step (clicking a bit,
    // switching a tab) keep whatever the player had scrolled to.
    const stepKey = [state.phase, state.round, state.roundStage, state.decRunning ? state.decRound : -1].join(":");
    panel.scrollTop = stepKey === lastStepKey ? prevScroll : 0;
    lastStepKey = stepKey;
    renderNav(document.getElementById("navRow"));
    renderMap();
    if (overlayOpen) renderOverlay(false);
    if (avOpen) renderAvalancheOverlay();
  }
  let lastStepKey = "";

  document.getElementById("infoToggle").addEventListener("click", function () { this.classList.toggle("open"); });
  document.getElementById("mapExpand").addEventListener("click", openOverlay);
  document.getElementById("ovClose").addEventListener("click", closeOverlay);
  overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closeOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (!overlayOpen) return;
    if (e.key === "Escape") { closeOverlay(); return; }
    if (e.key !== "Tab") return;
    const f = Array.from(overlayEl.querySelectorAll('button:not([disabled]), [tabindex="0"]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  const avalancheOverlayEl = document.getElementById("avalancheOverlay");
  document.getElementById("avClose").addEventListener("click", closeAvalancheOverlay);
  avalancheOverlayEl.addEventListener("click", (e) => { if (e.target === avalancheOverlayEl) closeAvalancheOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (!avOpen) return;
    if (e.key === "Escape") { closeAvalancheOverlay(); return; }
    if (e.key !== "Tab") return;
    const f = Array.from(avalancheOverlayEl.querySelectorAll('button:not([disabled]), [tabindex="0"]'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => applyLanguage(btn.dataset.langBtn)));
  initLanguage();
})();
</script>
</body>
</html>
