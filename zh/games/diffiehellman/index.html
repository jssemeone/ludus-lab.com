  /* One fixed-size "game window": the step card (left) and the encryption map (right) are

  :root { --game-h: clamp(440px, calc(100vh - 112px), 660px); }

  /* Character grid: each character and its UTF-8 byte(s) live together in one self-contained
     card, so packing several per row (instead of one table column per byte) never loses the

  .explain-more { background: none; border: none; padding: 6px 0 0; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent-blue); }
  .explain-more:hover { color: var(--accent-gold); }

  .info-body .explain-body { padding: 0; }

  .byte-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .bit-cell {
    width: 42px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.7);
    font-family: 'Oswald', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-primary);
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .bit-cell:not(.static):hover { border-color: var(--accent-gold); transform: translateY(-2px); }
  .bit-cell.static { cursor: default; }
  .bit-cell.pending { color: var(--text-muted); border-style: dashed; background: rgba(5,15,25,0.4); }
  .bit-cell.bit-active { color: #fff; background: rgba(0,162,255,0.22); border-color: var(--accent-blue); box-shadow: var(--glow-blue); }
  .bit-cell.bit-active.resolving { animation: resolvePulse 0.5s ease-in-out infinite; }
  @keyframes resolvePulse { 0%, 100% { box-shadow: var(--glow-blue); } 50% { box-shadow: 0 0 16px rgba(0,162,255,0.9), 0 0 28px rgba(0,162,255,0.5); } }
  .bit-cell.bit-worked { color: var(--text-primary); background: rgba(0,162,255,0.07); border-color: rgba(0,162,255,0.35); animation: dimBlink 1.8s ease-in-out infinite; }
  .bit-cell.just-revealed { animation: popIn 0.35s ease; }
  @keyframes dimBlink { 0%, 100% { box-shadow: 0 0 3px rgba(0,162,255,0.2); } 50% { box-shadow: 0 0 9px rgba(0,162,255,0.55); } }
  .bit-cell.key-slice { border-color: var(--accent-gold) !important; box-shadow: var(--glow-gold) !important; color: #fff; }
  .bit-cell.diff-bit { border-color: var(--accent-red) !important; box-shadow: 0 0 10px rgba(255,85,102,0.7), 0 0 20px rgba(255,85,102,0.35) !important; color: #fff; }
  .bit-cell.idx-bit { flex-direction: column; gap: 2px; height: 58px; }
  .bit-cell.idx-bit .idx-sub { font-size: 0.58rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
  .bit-cell.idx-bit.key-slice .idx-sub { color: rgba(255,255,255,0.7); }
  /* Avalanche-effect animation: flipping one S-box probe bit visibly ripples through the
     output. The flipped input bit gets an immediate ring pulse, the S-box arrow it flows
     through pulses a beat later, and each differing output bit lights up in a left-to-right
     cascade (staggered animation-delay set per element) instead of just snapping to red. */
  .bit-cell.flip-pulse { animation: flipPulse 0.6s ease-out; }
  @keyframes flipPulse {
    0% { transform: scale(1.35); box-shadow: 0 0 0 rgba(255,85,102,0); }
    35% { box-shadow: 0 0 16px rgba(255,85,102,0.85), 0 0 30px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  .swap-note.arrow-pulse { animation: arrowPulse 0.5s ease-out; }
  @keyframes arrowPulse {
    0%, 100% { text-shadow: none; }
    50% { color: #fff; text-shadow: 0 0 10px rgba(212,175,55,0.9); }
  }
  .bit-cell.diff-bit.avalanche { animation: avalancheRipple 0.55s ease-out backwards; }
  @keyframes avalancheRipple {
    0% { transform: scale(1.4); box-shadow: 0 0 0 rgba(255,85,102,0); }
    40% { box-shadow: 0 0 18px rgba(255,85,102,0.9), 0 0 34px rgba(255,85,102,0.5); }
    100% { transform: scale(1); }
  }
  /* A small gold/red spark physically flies from the flipped P bit, via the S-box arrow, to
     each output bit that changed — the same "watch it actually move" idea as the key-schedule
     rotation arc, applied to the avalanche demo so cause -> effect reads as motion, not just
     a color change. Positioned in JS (real screen coordinates), timed to land exactly when
     that bit's ripple glow (.avalanche above) starts. */
  .avalanche-spark {
    position: fixed; width: 11px; height: 11px; border-radius: 50%; left: 0; top: 0;
    background: radial-gradient(circle, #fff 0%, var(--accent-gold) 45%, var(--accent-red) 100%);
    box-shadow: 0 0 8px rgba(255,85,102,0.85), 0 0 16px rgba(212,175,55,0.55);
    pointer-events: none; z-index: 150;
  }
  @media (prefers-reduced-motion: reduce) {
    .bit-cell.flip-pulse, .swap-note.arrow-pulse, .bit-cell.diff-bit.avalanche { animation: none; }
  }

  .bit-cell.wrap-next { border-color: var(--accent-gold); animation: pulseGold 1.2s ease-in-out infinite; }
  .bit-cell.wrap-arc { animation: wrapArc 0.55s cubic-bezier(.4,0,.2,1) both; position: relative; z-index: 5; }
  @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: var(--glow-gold); } }
  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wrapArc {
    0%   { transform: translate(var(--dx), var(--dy)); }
    45%  { transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5 - 34px)); }
    100% { transform: translate(0, 0); }
  }
  .bit-readout { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }
  .bit-readout span { color: var(--accent-gold); font-family: 'Oswald', sans-serif; }

  .bit-equation .num { color: var(--accent-gold); }

  .half-block { text-align: center; }

  .op-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
  .op-symbol { font-size: 1.6rem; color: var(--accent-gold); font-family: 'Oswald', sans-serif; }

  /* S-box as a matrix: row = the two high bits of the input, column = the two low bits,
     the cell holds the output. Row/column headers light up for the entry being looked up. */
  .sbox-matrix { display: grid; grid-template-columns: 38px repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 440px; margin: 6px auto 4px; }
  .sm-head { display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.8px; color: var(--text-muted); transition: all 0.3s ease; }
  .sm-head.hl { color: var(--accent-gold); text-shadow: 0 0 8px rgba(212,175,55,0.6); }
  .sm-corner { font-size: 0.6rem; line-height: 1.1; color: var(--text-muted); text-align: center; align-self: center; }
  .sbox-cell { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 4px 2px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.6); transition: all 0.3s ease; }
  .sbox-cell .val { font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: var(--text-secondary); }
  .sbox-cell .bin { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.5px; }
  .sbox-cell.active { background: rgba(212,175,55,0.18); border-color: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-cell.active .val { color: #fff; }
  .sbox-cell.active .bin { color: rgba(255,255,255,0.75); }
  .sbox-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; margin: 8px auto 2px; }
  .sbox-note.ok { color: var(--accent-green); }
  .sbox-note.bad { color: var(--accent-orange); }
  /* In the avalanche demo, the matrix shows both the previous S-box lookup (dashed, muted —
     "where P used to point") and the current one (solid gold, from the existing .hl/.active
     rules) at once, so a bit flip visibly moves the lookup from one matrix cell to another. */
  .sm-head.hl-prev { color: rgba(212,175,55,0.6); text-decoration: underline dashed rgba(212,175,55,0.6); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .sbox-cell.was { border-style: dashed; border-width: 2px; border-color: rgba(212,175,55,0.45); background: rgba(212,175,55,0.05); }
  .sbox-cell.was .val { color: var(--text-primary); }
  /* Small on-screen key so "solid gold = now, dashed = before" isn't only explained in prose. */
  .sbox-legend { display: flex; gap: 18px; justify-content: center; align-items: center; margin: 2px 0 10px; font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .sbox-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
  .sbox-legend-item .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .sbox-legend-item.now { color: var(--accent-gold); }
  .sbox-legend-item.now .dot { background: var(--accent-gold); box-shadow: var(--glow-gold); }
  .sbox-legend-item.prev { color: rgba(212,175,55,0.75); }
  .sbox-legend-item.prev .dot { background: transparent; border: 2px dashed rgba(212,175,55,0.6); }
  .av-history { margin-top: 10px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; }

  .av-hist-row:first-child { border-top: none; }

  .round-track { display: flex; justify-content: center; gap: 6px; margin: 2px 0 10px; }

  /* Detailed-status overlay opened from the map's expand button */
  .overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(2, 8, 14, 0.78); backdrop-filter: blur(3px); animation: ovFade 0.2s ease; }

  .overlay-card { width: 100%; max-width: 760px; max-height: min(86vh, 820px); display: flex; flex-direction: column; text-align: left; background: #08192a; border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 0 40px rgba(0,162,255,0.25); animation: popIn 0.25s ease; }

  .overlay-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-blue); font-size: 1.1rem; }

  .overlay-close:hover { color: var(--accent-gold); border-color: var(--accent-gold); }

  .overlay-progress > div { height: 100%; background: #00ff80; transition: width 0.3s ease; }

  .ov-main { flex: 1; min-width: 0; }

  .ov-name { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.95rem; color: var(--text-secondary); }

  footer { margin-top: 50px; font-size: 0.85rem; color: var(--text-muted); }

  @media (max-width: 900px) { h1 { font-size: 2rem; } }
  @media (max-width: 600px) {

    .panel { padding: 18px; }
    .half-pair { gap: 16px; }
    /* The 3-operand XOR equation (R ⊕ K = X) doesn't fit one line on a phone; instead of an
       unpredictable mid-row wrap, stack operand / operator / operand / "=" / result top to
       bottom so it still reads left-to-right as one sequence. */
    .op-row { flex-direction: column; gap: 8px; }

    background: radial-gradient(circle at 50% 84%, rgba(255,85,102,0.06) 0%, transparent 30%), rgba(5,15,25,0.45); }

    font-family: 'Oswald', sans-serif; font-size: 0.66rem; letter-spacing: 0.6px; text-transform: uppercase; white-space: nowrap; }

  .nn-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent-blue); color: var(--accent-blue);
    background: rgba(5,20,30,0.95); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.25rem; box-shadow: var(--glow-blue); }
  .nn-top .nn-icon { width: 62px; height: 46px; border-radius: 12px; font-size: 0.9rem; letter-spacing: 0.5px; }
  .nn-top.ca .nn-icon { border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: var(--glow-gold); }
  .nn-top.ghost { opacity: 0.55; }
  .nn-top.ghost .nn-icon { border-color: rgba(138,176,197,0.4); color: var(--text-muted); box-shadow: none; text-decoration: line-through; border-style: dashed; }
  .nn-eve .nn-icon { width: 38px; height: 38px; font-size: 0.95rem; border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 10px rgba(255,85,102,0.45); }
  .nn-eve.active .nn-icon { width: 50px; height: 50px; font-size: 1.2rem; box-shadow: 0 0 16px rgba(255,85,102,0.75); }
  .nn-name { font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); line-height: 1.2; }
  .nn-sub { font-size: 0.62rem; color: var(--text-muted); line-height: 1.15; }
  .nn-name, .nn-sub { text-shadow: 0 0 4px rgba(5,15,25,0.95), 0 0 2px rgba(5,15,25,0.95); }
  .nn-slots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 19px; }
  .nn-chip { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.3px; padding: 1px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .nn-chip.k { color: var(--accent-gold); border-color: rgba(212,175,55,0.6); background: rgba(212,175,55,0.12); }
  .nn-chip.c { color: #7fd0ff; border-color: rgba(0,162,255,0.6); background: rgba(0,162,255,0.12); }
  .nn-chip.p { color: #8af5b8; border-color: rgba(72,187,120,0.6); background: rgba(72,187,120,0.12); }
  .nn-chip.none { color: var(--text-muted); border-color: var(--card-border); border-style: dashed; }
  .nn-chip.no { color: #ff8a98; border-color: rgba(255,85,102,0.5); background: rgba(255,85,102,0.08); }
  .nn-chip.pop { animation: popIn 0.4s ease; }
  .net-packet { position: absolute; left: 0; top: 0; z-index: 3; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; pointer-events: none;
    display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
  .net-packet.k { background: #d4af37; color: #1a0c00; border: 2px solid #ffd700; box-shadow: 0 0 14px rgba(212,175,55,0.9); }
  .net-packet.c { background: #00a2ff; color: #001a2d; border: 2px solid #00c2ff; box-shadow: 0 0 14px rgba(0,162,255,0.9); }
  .net-packet.p { background: #48bb78; color: #02200f; border: 2px solid #8af5b8; box-shadow: 0 0 14px rgba(72,187,120,0.9); }
  .net-packet.ghost { min-width: 24px; height: 24px; font-size: 0.72rem; background: rgba(255,85,102,0.9); border: 2px solid #ff8a98; color: #2a0008; box-shadow: 0 0 12px rgba(255,85,102,0.8); }
  .net-packet.bad { background: #ff5566; color: #2a0008; border: 2px solid #ff8a98; box-shadow: 0 0 14px rgba(255,85,102,0.9); }
  @media (prefers-reduced-motion: reduce) { .nn-chip.pop { animation: none; } }
  @media (max-width: 600px) {
    .net { height: 300px; }
    .net.net-middle { height: 230px; }
    .net.net-flat { height: 250px; }
    .net-node { width: min(104px, 31%); }
    .nn-icon { width: 40px; height: 40px; font-size: 1rem; }
    .nn-top .nn-icon { width: 52px; height: 40px; font-size: 0.75rem; }
    .nn-eve.active .nn-icon { width: 40px; height: 40px; }
    .nn-name { font-size: 0.66rem; }
    .nn-sub { display: none; }
    .nn-chip { font-size: 0.6rem; padding: 1px 4px; white-space: normal; }
    .net-lbl { font-size: 0.55rem; padding: 1px 4px; }
  }

  /* Value cards: a labelled number, gold = secret, green = public, blue = sent */
  .vals { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px 0; }
  .val { min-width: 92px; padding: 7px 12px 8px; border: 1px solid var(--card-border); border-radius: 8px; background: rgba(5,15,25,0.6); text-align: center; }
  .val .vl { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); line-height: 1.3; }
  .val .vv { font-family: 'Oswald', sans-serif; font-size: 1.35rem; color: var(--text-primary); line-height: 1.25; word-break: break-all; }
  .val.secret { border-color: rgba(212,175,55,0.55); background: rgba(212,175,55,0.08); }
  .val.secret .vv { color: var(--accent-gold); }
  .val.secret .vl::before { content: "🔒 "; }
  .val.public { border-color: rgba(72,187,120,0.5); background: rgba(72,187,120,0.07); }
  .val.public .vv { color: #8af5b8; }
  .val.sent .vv { color: #7fd0ff; }
  .val.bad { border-color: rgba(255,85,102,0.6); background: rgba(255,85,102,0.08); }
  .val.bad .vv { color: #ff8a98; }
  .val.ok { border-color: rgba(0,255,128,0.55); box-shadow: 0 0 12px rgba(0,255,128,0.2); }
  .val.ok .vv { color: #00ff80; }
  .val.pending .vv { color: var(--text-muted); }
  .val.pop { animation: popIn 0.35s ease; }

  /* Number pickers: a row of clickable chips */
  .picker { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0 10px; }
  .pick { min-width: 38px; height: 34px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(5,15,25,0.7);
    font-family: 'Oswald', sans-serif; font-size: 0.95rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease; user-select: none; }
  .pick:hover { border-color: var(--accent-gold); color: var(--text-primary); }
  .pick.on { color: #fff; border-color: var(--accent-gold); background: rgba(212,175,55,0.2); box-shadow: var(--glow-gold); }
  .pick.off { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
  .pick.off:hover { border-color: var(--card-border); }
  .pick-label { font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-top: 8px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 10px; }
  .stepper button { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--card-border); background: rgba(5,15,25,0.7); color: var(--accent-gold); font-size: 1.2rem; cursor: pointer; }
  .stepper button:hover { border-color: var(--accent-gold); }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper .sv { min-width: 70px; text-align: center; font-family: 'Oswald', sans-serif; font-size: 1.6rem; color: var(--accent-gold); }
  .num-input { width: 130px; padding: 8px 10px; text-align: center; font-family: 'Oswald', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: var(--accent-gold);
    background: rgba(5,15,25,0.75); border: 1px solid rgba(212,175,55,0.4); border-radius: 6px; outline: none; }
  .num-input:focus { border-color: var(--accent-gold); box-shadow: var(--glow-gold); }

  /* Step log: one line per elementary operation */
  .log { display: grid; gap: 5px; margin: 8px 0 4px; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1px solid var(--card-border); border-radius: 7px; background: rgba(5,15,25,0.5); font-size: 0.9rem; }
  .log-row .ln-n { flex: none; width: 26px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(0,162,255,0.12); font-family: 'Oswald', sans-serif; font-size: 0.72rem; color: var(--text-muted); }
  .log-row .ln-t { flex: 1; min-width: 0; font-family: 'Oswald', sans-serif; letter-spacing: 0.3px; color: var(--text-secondary); }
  .log-row .ln-t b { color: var(--accent-gold); font-weight: 500; }
  .log-row .ln-r { flex: none; font-family: 'Oswald', sans-serif; font-size: 1.05rem; color: var(--text-primary); }
  .log-row.cur { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
  .log-row.cur .ln-r { color: var(--accent-gold); }
  .log-row.hit { border-color: rgba(0,255,128,0.55); background: rgba(0,255,128,0.06); }
  .log-row.hit .ln-r { color: #00ff80; }
  .log-row.miss .ln-r { color: var(--text-muted); }
  .log-row.new { animation: fadeUp 0.35s ease; }
  .log-more { text-align: center; font-size: 0.78rem; color: var(--text-muted); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Exponent bits for square-and-multiply */
  .ebits { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 6px 0 2px; }
  .ebit { width: 30px; height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--card-border); border-radius: 5px; background: rgba(5,15,25,0.7);
    font-family: 'Oswald', sans-serif; font-size: 1.05rem; color: var(--text-primary); }
  .ebit.done { border-color: rgba(72,187,120,0.5); background: rgba(72,187,120,0.08); color: var(--text-secondary); }
  .ebit.cur { border-color: var(--accent-gold); box-shadow: var(--glow-gold); color: #fff; }
  .ebit-cap { text-align: center; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
  @media (max-width: 480px) { .ebit { width: 24px; height: 30px; font-size: 0.9rem; } }

  /* Big result banner */
  .verdict { margin: 10px auto 4px; max-width: 520px; padding: 10px 16px; border-radius: 8px; text-align: center; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; font-size: 1rem; }
  .verdict.ok { color: #b9ffd9; border: 1px solid rgba(0,255,128,0.5); background: rgba(0,255,128,0.08); box-shadow: 0 0 16px rgba(0,255,128,0.15); }
  .verdict.bad { color: #ffc2ca; border: 1px solid rgba(255,85,102,0.55); background: rgba(255,85,102,0.08); box-shadow: 0 0 16px rgba(255,85,102,0.15); }
  .verdict.pop { animation: popIn 0.35s ease; }

  /* Scale table (toy numbers vs real ones) */
  .scale { width: 100%; max-width: 560px; margin: 8px auto; border-collapse: collapse; font-size: 0.86rem; }
  .scale th, .scale td { padding: 6px 8px; border-bottom: 1px solid var(--card-border); text-align: left; color: var(--text-secondary); }
  .scale th { font-family: 'Oswald', sans-serif; font-weight: 400; letter-spacing: 0.8px; text-transform: uppercase; font-size: 0.7rem; color: var(--text-muted); }
  .scale tr.toy td { color: var(--accent-gold); }
  .scale td.r { text-align: right; font-family: 'Oswald', sans-serif; white-space: nowrap; }

  /* Two side-by-side columns (Alice | Bob) that stack on a phone */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
  .duo > div { border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 10px; background: rgba(5,15,25,0.35); min-width: 0; }
  .duo .who { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; color: var(--accent-blue); text-align: center; margin-bottom: 4px; }
  .duo .who.eve { color: var(--accent-red); }
  @media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }

  .eq { text-align: center; font-family: 'Oswald', sans-serif; font-size: 1.15rem; letter-spacing: 0.5px; color: var(--text-primary); margin: 8px 0; }
  .eq .s { color: var(--accent-gold); }
  .eq .p { color: #8af5b8; }
  .eq .c { color: #7fd0ff; }
  .eq .x { color: #ff8a98; }
  .eq small { display: block; font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.3px; }
  .counter { text-align: center; font-family: 'Oswald', sans-serif; font-size: 2rem; color: var(--accent-gold); line-height: 1.2; }
  .counter small { display: block; font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
  .toggle-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .tgl { padding: 7px 14px; border-radius: 18px; border: 1px solid var(--card-border); background: rgba(5,15,25,0.6); cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); transition: all 0.2s ease; }
  .tgl.on { color: #fff; border-color: var(--accent-red); background: rgba(255,85,102,0.18); box-shadow: 0 0 10px rgba(255,85,102,0.4); }
  .tgl.on.good { border-color: #00ff80; background: rgba(0,255,128,0.12); box-shadow: 0 0 10px rgba(0,255,128,0.35); }
  .tgl:disabled { opacity: 0.35; cursor: not-allowed; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .cmp > div { border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 10px; font-size: 0.86rem; color: var(--text-secondary); background: rgba(5,15,25,0.4); }
  .cmp .cmp-h { font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
  .cmp > div.new { border-color: rgba(212,175,55,0.5); }
  .cmp > div.new .cmp-h { color: var(--accent-gold); }
  @media (max-width: 560px) { .cmp { grid-template-columns: 1fr; } }
  .log-row.next { border-style: dashed; opacity: 0.7; }
  .log-row.next .ln-r { color: var(--text-muted); }
  .mx-count { text-align: center; font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 0.4px; color: var(--text-muted); margin: 6px 0 2px; }
  @media (max-width: 480px) { .log-row { padding: 5px 8px; gap: 6px; font-size: 0.8rem; } .log-row .ln-r { font-size: 0.92rem; } .log-row .ln-t { word-break: break-word; } }
  .eq sup, .log-row sup { font-size: 0.7em; }

  /* Standard bottom navigation under the game, the same block as in Feistel / BB84 / Caesar */
  .nav-link-icon { flex: none; }
  .navigation-links { display: flex; justify-content: center; gap: 15px; margin: 25px auto 15px; flex-wrap: wrap; }
  .nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; background: rgba(0, 10, 20, 0.7); color: #8ab0c5;
    text-decoration: none; border: 1px solid rgba(0, 162, 255, 0.3); border-radius: 6px; font-size: 0.9rem; transition: all 0.2s; }
  .nav-link:hover { color: #00a2ff; border-color: #00a2ff; background: rgba(0, 20, 35, 0.7); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 162, 255, 0.2); }
  .nav-link.primary { background: rgba(0, 40, 80, 0.7); color: #00a2ff; border-color: rgba(0, 162, 255, 0.5); }
  .nav-link.secondary { background: rgba(212, 175, 55, 0.1); color: #d4af37; border-color: rgba(212, 175, 55, 0.3); }
  .nav-link.secondary:hover { color: #ffd700; border-color: #d4af37; }
  @media (max-width: 768px) { .navigation-links { gap: 10px; margin: 20px auto 12px; } .nav-link { padding: 6px 12px; font-size: 0.85rem; } }

  .math-toggle { text-align: center; margin: 4px 0 -2px; }
  .math-btn { background: none; border: none; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.74rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); padding: 2px 6px; }
  .math-btn:hover { color: var(--accent-blue); }
  .lead { text-align: center; color: var(--text-secondary); font-size: 0.95rem; margin: 4px 0 8px; }
  .lead b { color: var(--accent-gold); font-weight: 500; }
  .own-box { margin: 6px 0; padding: 6px 10px 8px; border: 1px dashed var(--card-border); border-radius: 8px; }

  /* ===== Visualizations: picture + one-line caption ===== */
  .viz { margin: 10px 0 8px; padding: 8px 8px 7px; border: 1px solid var(--card-border); border-radius: 10px; background: rgba(5,15,25,0.42); }
  .viz-title { font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.9px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 4px; }
  .viz-cap { text-align: center; font-size: 0.8rem; line-height: 1.35; color: var(--text-muted); margin: 5px 4px 0; }
  .viz-cap b { color: var(--text-secondary); font-weight: 500; }
  .viz svg { display: block; width: 100%; height: auto; overflow: visible; }
  .viz svg text { font-family: 'Oswald', sans-serif; }
  [data-link] { cursor: pointer; }
  .log-row.lnk { border-color: rgba(255,255,255,0.75); box-shadow: 0 0 10px rgba(255,255,255,0.18); }

  /* Exponent ladder for square-and-multiply */
  .ladder { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 104px; max-width: 560px; margin: 0 auto; }
  .ld-col { flex: 1 1 0; min-width: 0; max-width: 40px; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .ld-v { font-family: 'Oswald', sans-serif; font-size: 0.72rem; line-height: 1.3; color: var(--text-secondary); white-space: nowrap; }
  .ld-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .ld-bar { width: 100%; border-radius: 3px 3px 0 0; background: rgba(212,175,55,0.45); transition: height 0.35s ease; }
  .ld-col.mul .ld-bar { background: rgba(212,175,55,0.75); }
  .ld-col.plan .ld-bar { background: transparent; border: 1px dashed rgba(138,176,197,0.35); border-bottom: none; }
  .ld-col.plan .ld-v, .ld-col.plan .ld-op { color: var(--text-muted); opacity: 0.6; }
  .ld-col.cur .ld-bar { background: var(--accent-gold); box-shadow: 0 0 10px rgba(212,175,55,0.7); }
  .ld-col.cur .ld-v { color: var(--accent-gold); font-weight: 700; }
  .ld-op { font-family: 'Oswald', sans-serif; font-size: 0.66rem; line-height: 1.4; color: var(--text-muted); border-top: 1px solid var(--card-border); width: 100%; text-align: center; }
  .ld-col.mul .ld-op { color: var(--accent-gold); }
  .ld-col.lnk .ld-bar { outline: 2px solid #fff; }
  .ld-col.lnk .ld-v { color: #fff; visibility: visible !important; }
  @media (prefers-reduced-motion: reduce) { .ld-bar { transition: none; } }
  @media (max-width: 520px) {
    .ladder { gap: 2px; height: 92px; }
    .ladder.many .ld-col:not(.cur):not(:first-child):not(:last-child) .ld-v { visibility: hidden; }
    .ld-v { font-size: 0.66rem; }
    .ld-op { font-size: 0.58rem; }
  }

  /* Scale chart: horizontal bars on a log scale */
  .lb { max-width: 560px; margin: 0 auto; padding: 0 4px; }
  .lb-row { margin: 0 0 8px; }
  .lb-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 0.82rem; line-height: 1.3; }
  .lb-l { color: var(--text-secondary); min-width: 0; }
  .lb-v { flex: none; font-family: 'Oswald', sans-serif; letter-spacing: 0.3px; color: var(--text-primary); white-space: nowrap; }
  .lb-track { position: relative; height: 12px; margin: 3px 0 2px; }
  .lb-track i, .lb-axis span::before { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,162,255,0.16); }
  .lb-track i:first-child { background: rgba(138,176,197,0.45); }
  .lb-bar { position: absolute; left: 0; top: 2px; bottom: 2px; min-width: 3px; border-radius: 0 4px 4px 0; background: #3f8fc4; }
  .lb-row.toy .lb-bar { background: var(--accent-gold); box-shadow: 0 0 8px rgba(212,175,55,0.8); }
  .lb-row.toy .lb-l, .lb-row.toy .lb-v { color: var(--accent-gold); }
  .lb-note { font-size: 0.74rem; color: var(--text-muted); line-height: 1.3; }
  .lb-axis { position: relative; height: 18px; margin: 6px 0 0; border-top: 1px solid rgba(138,176,197,0.35); }
  .lb-axis span { position: absolute; top: 2px; transform: translateX(-50%); font-family: 'Oswald', sans-serif; font-size: 0.66rem; color: var(--text-muted); white-space: nowrap; }
  .lb-axis span:first-child { transform: none; }
  .lb-axis span:last-child { transform: translateX(-100%); }
  .lb-axis-t { text-align: center; font-family: 'Oswald', sans-serif; font-size: 0.66rem; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
  .lb-viz .scale { margin-top: 4px; }
  @media (max-width: 480px) { .lb-axis span:nth-child(even) { display: none; } }

  /* ===== Sections: idea on an example / the protocol / Eve's attacks / defence ===== */
  .sec-idea { --sec: #d4af37; --sec-bg: rgba(212,175,55,0.1); }
  .sec-proto { --sec: #00a2ff; --sec-bg: rgba(0,162,255,0.1); }
  .sec-attack { --sec: #ff5566; --sec-bg: rgba(255,85,102,0.1); }
  .sec-defense { --sec: #48bb78; --sec-bg: rgba(72,187,120,0.1); }
  .sec-badge { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 8px; padding: 4px 10px; border-radius: 6px; border-left: 3px solid var(--sec); background: var(--sec-bg);
    font-family: 'Oswald', sans-serif; font-size: 0.74rem; letter-spacing: 0.9px; text-transform: uppercase; color: var(--sec); }
  .sec-badge b { font-weight: 500; opacity: 0.85; white-space: nowrap; }
  /* step dots: one cluster per section, underlined in its colour */
  .step-dots { gap: 18px; }
  .dot-grp { display: flex; gap: 10px; padding-bottom: 5px; border-bottom: 2px solid var(--sec, transparent); }
  /* map: each section is a block with its own rail and title */
  .map-group { position: relative; margin-bottom: 12px; padding: 6px 0 2px 10px; border-left: 2px solid var(--sec, var(--card-border)); }
  .map-group.sec-none, .map-group.sec-end { border-left-color: transparent; }
  .map-group:last-child { margin-bottom: 0; }
  .map-sec { font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.9px; text-transform: uppercase; color: var(--sec); margin: -2px 0 8px; }
  .map-group .map-node:last-child .map-body { padding-bottom: 4px; }
  .map-group.sec-end { border-top: 1px dashed var(--card-border); padding-top: 12px; }
  /* detailed overlay */
  .ov-sec { margin: 14px 0 8px; padding: 6px 12px; border-left: 3px solid var(--sec); background: var(--sec-bg); border-radius: 6px; }
  .ov-sec:first-child { margin-top: 0; }
  .ov-sec-h { font-family: 'Oswald', sans-serif; font-size: 0.85rem; letter-spacing: 0.9px; text-transform: uppercase; color: var(--sec); }
  .ov-sec-d { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
  @media (max-width: 480px) { .step-dots { gap: 12px; } .dot-grp { gap: 7px; } }

  /* ===== "How it looks for real": a terminal under the game (collapsed until clicked) ===== */
  /* docked at the bottom of the step card, like in the protocol pages: collapsed it is one row,
     open it takes a bit under half of the card and the step text scrolls above it */
  .term { flex: none; display: flex; flex-direction: column; min-height: 0; margin-top: 8px; border: 1px solid var(--card-border, rgba(0,162,255,0.25)); border-radius: 10px; background: rgba(3,8,12,0.6); }
  .term.open { flex: 0 0 46%; }
  .term[hidden] { display: none; }
  .term-tgl { flex: none; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: none; background: none; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 0.9rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-secondary); text-align: left; }
  .term-tgl:hover { color: var(--accent-blue); }
  .term-arrow { display: inline-block; transition: transform 0.2s ease; color: var(--accent-blue); }
  .term.open .term-arrow { transform: rotate(90deg); }
  .term-sub { margin-left: auto; padding-left: 10px; font-family: 'Roboto', sans-serif; text-transform: none; letter-spacing: 0; font-size: 0.75rem; color: var(--text-muted); }
  .term-win { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 8px 8px; border-radius: 8px; overflow: hidden; border: 1px solid #1d2a36; background: #04080c; }
  .term-win[hidden] { display: none; }
  .term-bar { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: #0d151d; border-bottom: 1px solid #1d2a36; }
  .term .dots { display: flex; gap: 6px; flex: none; }
  .term .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .term .dots i:nth-child(2) { background: #febc2e; } .term .dots i:nth-child(3) { background: #28c840; }
  .term-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .term-tab { padding: 2px 10px; border-radius: 5px; border: 1px solid transparent; background: none; cursor: pointer; font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 0.76rem; color: #6c8496; }
  .term-tab.on { color: #d7e3ec; background: #04080c; border-color: #26384a; }
  .term-body { flex: 1; min-height: 0; margin: 0; padding: 8px 12px; overflow: auto; font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 0.76rem; line-height: 1.5; color: #9fb3c2; white-space: pre-wrap; word-break: break-word; text-align: left; tab-size: 4; }
  .term-body .ln { display: block; opacity: 0.6; }
  .term-body .ln.now { opacity: 1; background: rgba(212,175,55,0.08); }
  .term-body .ln.cmd { color: #8af5b8; }
  .term-body .ln.cmt { color: #5f7686; font-style: italic; }
  .term-body .ln.hl { color: var(--accent-gold); }
  .term-body .caret { display: inline-block; width: 7px; height: 13px; background: #8af5b8; vertical-align: -2px; animation: termBlink 1s steps(1) infinite; }
  .term-body .empty { color: #5f7686; font-style: italic; }
  @keyframes termBlink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .term-body .caret { animation: none; } }
  .term-note { padding: 6px 12px 7px; font-size: 0.76rem; line-height: 1.45; color: #6c8496; border-top: 1px solid #1d2a36; text-align: left; }
  .term-note { flex: none; }
  @media (max-width: 520px) { .term.open { flex-basis: 52%; } .term-body { font-size: 0.68rem; } .term-tgl { font-size: 0.78rem; padding: 8px 12px; } .term-sub { display: none; } .term-note { font-size: 0.7rem; } }

  /* ===== Diffie–Hellman: the textbook protocol ===== */
  .eq sup, .calc sup, .try sup { font-size: 0.7em; }
  .duo .who.eve, .pt-cell .who.eve { color: var(--accent-red); }
  .duo .btn-row { margin-top: 6px; }

  /* "From the previous steps": what is already on the table */
  .carry { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; margin: 6px 0 10px; }
  .carry-h { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); }
  .cchip { font-family: 'Oswald', sans-serif; font-size: 0.85rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--card-border); white-space: nowrap; }
  .cchip.p { border-color: rgba(72,187,120,0.55); color: #8af5b8; background: rgba(72,187,120,0.07); }
  .cchip.k { border-color: rgba(212,175,55,0.6); color: var(--accent-gold); background: rgba(212,175,55,0.08); }
  .cchip.c { border-color: rgba(0,162,255,0.55); color: #7fd0ff; background: rgba(0,162,255,0.07); }
  .duo .carry { margin: 2px 0 6px; }

  /* A power worked out in full: formula, power, division with remainder, result */
  .calc { display: flex; flex-direction: column; align-items: center; gap: 3px; margin: 4px 0; font-family: 'Oswald', sans-serif; }
  .calc-row { font-size: 1.05rem; color: var(--text-primary); text-align: center; line-height: 1.35; overflow-wrap: anywhere; }
  .calc-row.head { color: var(--text-secondary); }
  .calc-row small { display: block; font-family: 'Roboto', sans-serif; font-size: 0.7rem; color: var(--text-muted); }
  .calc-row b { color: var(--accent-gold); font-weight: 500; }
  .calc-row.res { font-size: 1.45rem; padding: 2px 14px; border-radius: 8px; border: 1px solid rgba(72,187,120,0.55); background: rgba(72,187,120,0.08); }
  .calc-row.res b { color: #8af5b8; }
  .calc-row.res.pending { border-style: dashed; border-color: var(--card-border); background: none; color: var(--text-muted); }
  .calc-row.pop { animation: popIn 0.35s ease; }

  /* Secrets: a stepper under each secret paint, Eve in the middle knows nothing */
  .sec-grid .pt-row { align-items: start; }
  .sec-grid .stepper { margin: 6px 0 0; }
  .sec-grid .stepper button { width: 32px; height: 32px; font-size: 1.05rem; }
  .sec-grid .stepper .sv { min-width: 84px; font-size: 1.25rem; }
  .sec-eve { font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: #ff8a98; text-align: center; line-height: 1.3; }
  .sec-eve small { display: block; font-family: 'Roboto', sans-serif; font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; }
  @media (max-width: 480px) { .sec-grid .stepper { gap: 4px; } .sec-grid .stepper button { width: 28px; height: 28px; } .sec-grid .stepper .sv { min-width: 0; font-size: 1rem; } }

  /* Eve's brute force: one row per exponent tried */
  .tries { display: flex; flex-direction: column; align-items: center; gap: 3px; margin: 6px 0; font-family: 'Oswald', sans-serif; }
  .try { display: grid; grid-template-columns: 9em 3.2em 1.4em; align-items: baseline; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--card-border); background: rgba(5,15,25,0.6); font-size: 1rem; }
  .try .tx { color: var(--text-secondary); text-align: right; padding-right: 6px; }
  .try .tr { color: var(--text-primary); }
  .try .tm { color: #ff8a98; text-align: center; }
  .try.cur { border-color: rgba(255,85,102,0.6); }
  .try.hit { border-color: #00ff80; box-shadow: 0 0 10px rgba(0,255,128,0.35); }
  .try.hit .tm, .try.hit .tr { color: #00ff80; }
  .try.pending { border-style: dashed; color: var(--text-muted); }


  /* ===== Paint analogy ===== */
  .pt-grid { margin: 8px 0; display: grid; gap: 4px; }
  .pt-title { font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-top: 6px; }
  .pt-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; }
  .pt-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 10px; }
  .pt-cell .who { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; color: var(--accent-blue); }
  .pt-cell .who.pub { color: #8af5b8; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .sw-c { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); box-shadow: inset 0 -6px 12px rgba(0,0,0,0.25); }
  .sw.secret .sw-c { border-color: rgba(212,175,55,0.8); box-shadow: 0 0 10px rgba(212,175,55,0.45), inset 0 -6px 12px rgba(0,0,0,0.25); }
  .sw.public .sw-c { border-color: rgba(72,187,120,0.7); }
  .sw.sent .sw-c { border-color: rgba(0,162,255,0.8); }
  .sw.ok .sw-c { border-color: #00ff80; box-shadow: 0 0 14px rgba(0,255,128,0.5), inset 0 -6px 12px rgba(0,0,0,0.25); }
  .sw.bad .sw-c { border-color: var(--accent-red); box-shadow: 0 0 14px rgba(255,85,102,0.5), inset 0 -6px 12px rgba(0,0,0,0.25); }
  .sw.pop { animation: popIn 0.35s ease; }
  .sw-l { font-size: 0.72rem; color: var(--text-secondary); line-height: 1.25; }
  .sw-r { display: flex; gap: 3px; }
  .sw-r i { width: 9px; height: 9px; border-radius: 50%; display: block; border: 1px solid rgba(255,255,255,0.25); }
  .sw-pick { gap: 6px; margin: 2px 0; }
  .pick.sw-dot { min-width: 28px; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); }
  .pick.sw-dot.on { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.6); }
  .pt-arrow, .pt-eve, .pt-eq { font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.4px; color: var(--text-muted); text-align: center; align-self: center; line-height: 1.3; }
  .pt-eve { color: #ff8a98; }
  .pt-eq { font-size: 2rem; }
  @media (max-width: 480px) { .sw-c { width: 46px; height: 46px; } .pt-row { gap: 4px; } .sw-l { font-size: 0.66rem; } }
  .sw-dot:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ===== Paints: the swirl of a fresh mix ===== */
  .sw-c { position: relative; overflow: hidden; }
  .sw-swirl { position: absolute; inset: -20%; border-radius: 50%; animation: swirlMix 1.3s ease-in forwards; }
  @keyframes swirlMix { 0% { transform: rotate(0); opacity: 1; filter: blur(0); } 60% { opacity: 0.85; filter: blur(3px); } 100% { transform: rotate(540deg); opacity: 0; filter: blur(8px); } }
  @media (prefers-reduced-motion: reduce) { .sw-swirl { display: none; } }
  @media (max-width: 480px) { .pick.sw-dot { min-width: 22px; width: 22px; height: 22px; } .sw-pick { gap: 4px; } }

  /* ===== Man in the middle: two tunnels ===== */
  .tun-wrap { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 360 / 100; }
  .tun { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tun .tn { stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .tun .tn1 { fill: rgba(212,175,55,0.16); stroke: rgba(212,175,55,0.8); }
  .tun .tn2 { fill: rgba(255,165,0,0.12); stroke: rgba(255,165,0,0.75); stroke-dasharray: 6 3; }
  .tun .tn-k { text-anchor: middle; font-size: 10px; letter-spacing: 0.3px; }
  .tun .tn-k.k1 { fill: var(--accent-gold); }
  .tun .tn-k.k2 { fill: var(--accent-orange); }
  .tun-node { position: absolute; top: 51%; margin-top: -19px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1px; z-index: 1; }
  .tun-ic { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent-blue); color: var(--accent-blue); background: rgba(5,20,30,0.95);
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1rem; }
  .tn-eve .tun-ic { border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 12px rgba(255,85,102,0.6); }
  .tun-nm { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-secondary); }
  .tun-env { position: absolute; top: 51%; left: 50%; transform: translate(-50%, -50%); z-index: 2; opacity: 0; padding: 2px 8px; border-radius: 12px; white-space: nowrap;
    font-family: 'Oswald', sans-serif; font-size: 0.8rem; font-weight: 500; pointer-events: none; }
  .tun-env.e1 { background: #d4af37; color: #1a0c00; box-shadow: 0 0 12px rgba(212,175,55,0.8); }
  .tun-env.e2 { background: #ffa500; color: #1f1000; box-shadow: 0 0 12px rgba(255,165,0,0.8); }
  .tun-env.open { top: 13%; background: rgba(255,85,102,0.95); color: #2a0008; box-shadow: 0 0 12px rgba(255,85,102,0.8); }
  @media (max-width: 480px) { .tun-node { margin-top: -15px; } .tun-nm { font-size: 0.6rem; } .tun-ic { width: 30px; height: 30px; font-size: 0.85rem; } .tun-env { font-size: 0.68rem; padding: 1px 6px; } .tun .tn-k { font-size: 14px; } }

  /* ===== A power walked one multiplication at a time ===== */
  .pw { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 4px 0; font-family: 'Oswald', sans-serif; }
  .pw-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  .pw-tile { min-width: 34px; padding: 3px 7px; border-radius: 7px; border: 1px solid rgba(0,162,255,0.6); background: rgba(0,162,255,0.12); color: #7fd0ff; font-size: 1.1rem; text-align: center; transition: opacity 0.3s ease; }
  .pw-tile.used { opacity: 0.22; border-style: dashed; }
  .pw-tile.next { border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: 0 0 10px rgba(212,175,55,0.45); animation: pwNext 1.4s ease-in-out infinite; }
  @keyframes pwNext { 50% { transform: translateY(-3px); } }
  .pw-hist { display: flex; flex-direction: column; align-items: center; font-size: 0.78rem; color: var(--text-muted); line-height: 1.35; }
  .pw-acc { display: flex; flex-direction: column; align-items: center; min-width: 92px; padding: 3px 14px 5px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.55); background: rgba(212,175,55,0.07); }
  .pw-acc-l { font-size: 0.64rem; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); }
  .pw-acc-v { font-size: 1.9rem; line-height: 1.1; color: var(--accent-gold); }
  .pw.done .pw-acc { border-color: rgba(72,187,120,0.7); background: rgba(72,187,120,0.08); }
  .pw.done .pw-acc-v { color: #8af5b8; }
  .pw-check { font-family: 'Roboto', sans-serif; font-size: 0.72rem; color: var(--text-muted); text-align: center; }
  .pw .calc-row.res { margin-top: 2px; }
  .pw-ghost { position: fixed; z-index: 1000; pointer-events: none; padding: 3px 9px; border-radius: 7px; font-family: 'Oswald', sans-serif; font-size: 1.15rem; }
  .pw-ghost.tile { border: 1px solid var(--accent-gold); background: rgba(212,175,55,0.9); color: #1a0c00; box-shadow: 0 0 14px rgba(212,175,55,0.8); }
  .pw-ghost.key { border: 1px solid #00ff80; background: rgba(0,255,128,0.85); color: #002a14; font-size: 1.5rem; box-shadow: 0 0 18px rgba(0,255,128,0.8); }

  /* Both keys meet in the middle */
  .key-meet { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 4px; font-family: 'Oswald', sans-serif; }
  .key-meet .km { min-width: 64px; padding: 4px 14px; border-radius: 10px; border: 1px solid #00ff80; color: #00ff80; font-size: 2rem; text-align: center; box-shadow: 0 0 14px rgba(0,255,128,0.35); }
  .key-meet .km-eq { font-size: 2rem; color: #8af5b8; }
  @keyframes kmIn { 0% { opacity: 0; transform: scale(0.5); } 70% { opacity: 1; transform: scale(1.2); } 100% { transform: scale(1); } }

  /* Why: every received tile opens into the fives it is made of */
  .uf-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; margin: 6px 0; font-family: 'Oswald', sans-serif; }
  .uf-who { min-width: 90px; text-align: right; color: var(--text-secondary); }
  .uf-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .uf-grp { display: flex; flex-direction: column; align-items: center; padding: 2px 5px 4px; border-radius: 8px; border: 1px dashed rgba(0,162,255,0.5); }
  .uf-was { font-size: 0.68rem; color: var(--text-muted); }
  .uf-fives { display: flex; gap: 3px; }
  .uf-five { display: inline-block; min-width: 20px; padding: 1px 4px; border-radius: 5px; background: rgba(72,187,120,0.18); border: 1px solid rgba(72,187,120,0.6); color: #8af5b8; font-size: 0.9rem; text-align: center; animation: ufPop 0.35s ease both; }
  @keyframes ufPop { 0% { opacity: 0; transform: translateY(-10px) scale(0.4); } 100% { opacity: 1; transform: none; } }
  .uf-sum { color: #8af5b8; font-size: 1.1rem; }
  @media (max-width: 480px) { .uf-who { min-width: 0; width: 100%; text-align: center; } .uf-five { min-width: 16px; font-size: 0.8rem; } }
  @media (prefers-reduced-motion: reduce) {
    .pw-tile.next, .key-meet.fresh .km, .key-meet.fresh .km-eq, .uf-five, .lamps i::after, .wait { animation: none !important; }
  }

  .pw-work { font-size: 1.05rem; color: var(--text-primary); text-align: center; }
  .pw-prod { color: #7fd0ff; font-weight: 500; }
  .pw-eq { font-size: 0.82rem; color: var(--text-secondary); text-align: center; line-height: 1.35; }
  .pw-eq b { color: var(--accent-gold); font-weight: 500; }
  .wait { animation: pwShow 0.45s ease var(--at) both; }
  @keyframes pwShow { 0% { opacity: 0; transform: scale(0.6); } 60% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: none; } }
  .pw-acc-v.wait { display: inline-block; }
  .key-meet.fresh .km { animation: kmIn 0.5s ease calc(var(--at) + 950ms) both; }
  .key-meet.fresh .km-eq { animation: kmIn 0.4s ease calc(var(--at) + 1300ms) both; }
  .verdict.late { animation-delay: calc(var(--at) + 1450ms); animation-fill-mode: both; }
  .pw-eq.wait { animation-name: pwFade; }
  @keyframes pwFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .pw-acc.pending .pw-acc-v { color: var(--text-muted); }

  /* The board of neon lamps under every power: art-deco frame, tubes that stutter on and twitch */
  .lamps { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 9px 9px 8px; margin: 6px 0 4px; border-radius: 5px;
    background: linear-gradient(180deg, rgba(10,22,30,0.95), rgba(2,9,14,0.98)); border: 1px solid rgba(212,175,55,0.6);
    box-shadow: inset 0 0 0 3px rgba(2,9,14,1), inset 0 0 0 4px rgba(212,175,55,0.28), 0 0 16px rgba(0,162,255,0.12); }
  .lamps::before, .lamps::after { content: ""; position: absolute; left: 50%; width: 9px; height: 9px; transform: translateX(-50%) rotate(45deg); background: #0a1a2a; border: 1px solid rgba(212,175,55,0.7); }
  .lamps::before { top: -5px; } .lamps::after { bottom: -5px; }
  .lamp-row { display: grid; grid-template-columns: repeat(var(--n, 23), var(--lamp, 9px)); gap: 2px; }
  .lamps i { position: relative; width: var(--lamp, 9px); height: var(--lamp, 9px); border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.09), rgba(255,255,255,0.02)); border: 1px solid rgba(212,175,55,0.16); }
  .lamps i.on::after { content: ""; position: absolute; inset: -1px; border-radius: 50%;

      'info.toggle': 'ℹ️ How does the protocol work?',
      'info.short': 'The Diffie–Hellman protocol (1976) lets two people obtain a shared secret key while exchanging only public messages. No key centre is needed: the key is born right in the open channel. It is not a cipher but a way to obtain a key for a cipher (such as AES).',

      'intro.oldH': 'Before: until 1976',

      'x.sumIdea': 'A shared secret can be obtained over an open channel if there is an operation that’s easy to do and hard to undo. But this only protects against eavesdropping, not against substitution.',

      'sum.p3': 'At Britain’s GCHQ, James Ellis described “non-secret encryption” in 1970, and Malcolm Williamson found essentially the same protocol in 1974. All of this was declassified only in 1997. In 2015 Diffie and Hellman received the Turing Award.',
      'sum.realTeaser': '⚠️ The real exchange is bigger',

      'x.headIdea': '🎓 La idea principal',

      'x.sumHist': 'Whitfield Diffie y Martin Hellman publicaron la idea en 1976. El servicio británico GCHQ llegó a lo mismo antes, pero lo mantuvo en secreto hasta 1997.',
      'sum.p2': 'En noviembre de 1976, Whitfield Diffie y Martin Hellman, de Stanford, publicaron el artículo «New Directions in Cryptography». Empezaba con las palabras «Estamos hoy al borde de una revolución en la criptografía». Antes, cualquier cifrado necesitaba una clave entregada de antemano. En la idea influyó el trabajo de Ralph Merkle: más tarde Hellman propuso llamar al protocolo intercambio de Diffie–Hellman–Merkle.',
      'sum.p3': 'En el GCHQ británico, James Ellis describió en 1970 el «cifrado no secreto», y Malcolm Williamson encontró en 1974 en esencia el mismo protocolo. Todo esto se desclasificó solo en 1997. En 2015 Diffie y Hellman recibieron el premio Turing.',

      'sum.realShort': 'En TLS 1.3 los números secretos se eligen de nuevo en cada conexión y se borran después, y el intercambio en sí se hace sobre la curva elíptica X25519. La clave obtenida no se usa directamente: de ella se derivan las claves para AES.',
      'sum.real1': 'Cada conexión recibe nuevos a y b, que se borran tras la conversación. Aunque después hackeen el servidor, las conversaciones antiguas no se podrán descifrar: sus claves ya no existen en ninguna parte. Esta propiedad se llama secreto perfecto hacia delante (forward secrecy).',
      'sum.real2': 'El número común g<sup>ab</sup> no se convierte en la clave directamente: se pasa por una función de derivación de claves (HKDF) y se obtienen las claves de un cifrado simétrico, por ejemplo AES-GCM. Así trabajan juntos Diffie–Hellman y la red SP.',
      'sum.real3': 'En los dispositivos criptográficos rusos la clave común se obtiene con el algoritmo VKO sobre las curvas elípticas de GOST R 34.10-2012 (recomendaciones R 50.1.113-2016). La idea es la misma que en el juego.',

    if (done || keys.every(raised)) return [];
    return [{ label: t('pw.raiseAll'), cls: "btn-primary", onClick: () => autoStages(keys, () => keys.every(raised), 'mul') }];
  }
  // "Show the result": finish both walks without any motion.
  function finishAll(keys) {
    const w = walks();
    keys.forEach(k => { w[k] = WALKS[k]()[1]; w.div[k] = 1; });
    state.fx = { skip: true, list: [] };
    render();
    state.fx = null;
  }
  // A copy of an element that flies from one place to another along an arc, then vanishes.
  function flyGhost(fromEl, toEl, html, cls, delay, dur) {
    if (!fromEl || !toEl || reducedMotion() || typeof document.body.animate !== "function") return;
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const g = el("div", "pw-ghost " + (cls || ""), html);
    g.style.left = (a.left + a.width / 2) + "px"; g.style.top = (a.top + a.height / 2) + "px";
    g.style.opacity = "0";   // invisible until its flight starts: a delayed ghost must not hang at the start point
    document.body.appendChild(g);
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    const lift = -Math.max(28, Math.abs(dx) * 0.25);
    const an = g.animate([
      { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx / 2}px), calc(-50% + ${dy / 2 + lift}px)) scale(1.15)`, opacity: 1, offset: 0.5 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.7)`, opacity: 0.2 },
    ], { duration: dur || 520, delay: delay || 0, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    an.onfinish = an.oncancel = () => g.remove();
  }
  function playFx() {
    const fx = state.fx;
    if (!fx) return;
    state.fx = null;
    (fx.list || []).forEach(m => {
      const box = document.querySelector(`.pw[data-walk="${m.k}"]`);
      if (!box) return;
      const lamp = i => box.querySelector(`.lamps i[data-i="${i}"]`);
      if (m.kind === 'mul') {
        // the factor tile arcs into the product, then the product's digits drop onto the new lamps
        const [base] = WALKS[m.k](), raw = rawOf(m.k), prev = walks()[m.k] > 1 ? raw / base : 0;
        const tile = box.querySelector(`.pw-tile[data-i="${walks()[m.k] - 1}"]`), pr = box.querySelector(".pw-prod");
        flyGhost(tile, pr, tile ? tile.textContent : "", "tile", 0, 520);
        const digits = String(raw).split("");
        digits.forEach((d, i) => flyGhost(pr, lamp(Math.floor(prev + (i + 0.5) / digits.length * (raw - prev))), d, "digit", 540 + i * 90, 420));
      } else {
        // the remainder leaves the lamps for the result
        const { raw, q, r, chunk, beats, beat, gold, fly } = divTimes(m.k);
        // the line under the board subtracts along with the rows going out
        const eq = box.querySelector(".pw-eq.live");
        if (eq) {
          for (let j = 0; j < beats; j++) {
            const before = raw - j * chunk * P, k = Math.min(q, (j + 1) * chunk), after = raw - k * P;
            later(beat(j) + 200, () => { eq.innerHTML = t('pw.count', { a: fmt(before), m: (k - j * chunk) * P, b: fmt(after), p: P, k }); eq.classList.remove("tick"); void eq.offsetWidth; eq.classList.add("tick"); });
          }
          later(gold, () => { eq.innerHTML = eq.dataset.final; eq.classList.remove("live", "tick"); void eq.offsetWidth; eq.classList.add("tick"); });
        }
        flyGhost(lamp(q * P + Math.floor(r / 2)), box.querySelector(".pw-res b"), String(r), "rem", fly, 600);
      }
    });
  }
  // the key is ready on both sides: both results fly into the verdict and meet there
  function meetFx() {
    const v = document.getElementById("keyMeet");
    if (v && v.dataset.fresh) {
      const at = +v.dataset.at || 0;
      ['sa', 'sb'].forEach((k, i) => {
        const acc = document.querySelector(`.pw[data-walk="${k}"] .pw-acc-v`);
        flyGhost(acc, v.querySelector(i ? ".km-b" : ".km-a"), acc ? acc.textContent : "", "key", at + 300, 700);
      });
    }
  }

  function secretStepper(who) {
    const n = state[who], st = el("div", "stepper");
    const minus = el("button", null, "−"), plus = el("button", null, "+");
    minus.type = plus.type = "button";
    minus.disabled = n <= SECRET_MIN; plus.disabled = n >= SECRET_MAX;
    minus.addEventListener("click", () => { state[who] = n - 1; render(); });
    plus.addEventListener("click", () => { state[who] = n + 1; render(); });
    st.appendChild(minus); st.appendChild(el("div", "sv", `🔒 ${who} = ${n}`)); st.appendChild(plus);
    return st;
  }

  // ===== Phases =====

    cmp.appendChild(el("div", "new", `<div class="cmp-h">${t('intro.newH')}</div>${t('intro.new')}`));

  // A paint blob. Its colour is recomputed in place while a hue slider moves (data-parts), and a
  // freshly mixed blob swirls its ingredients together before settling.
  function swatch(parts, label, cls, fresh) {
    const dots = parts.map(p => `<i data-parts="${p}" style="background:${mixRGB([p])}"></i>`).join("");
    const swirl = fresh && parts.length > 1 ? `<i class="sw-swirl" style="background:conic-gradient(${parts.map(p => mixRGB([p])).join(",")},${mixRGB([parts[0]])})"></i>` : "";
    return `<div class="sw ${cls || ""}${fresh ? " pop" : ""}"><div class="sw-c" data-parts="${parts.join(",")}" style="background:${mixRGB(parts)}">${swirl}</div><div class="sw-l">${label}</div><div class="sw-r">${dots}</div></div>`;
  }
  function paintRow(grid, cells, title) {
    if (title) grid.appendChild(el("div", "pt-title", title));
    const row = el("div", "pt-row");
    cells.forEach(c => row.appendChild(el("div", "pt-cell", c || "")));
    grid.appendChild(row);
    return row;
  }
  // Ready-made paints only. who: 'a' / 'b' (secret paints) or 'y' (the common paint).
  // Alice and Bob can't take the same secret paint, otherwise both mixes would look alike.
  function huePicker(grid, who) {
    const pt = state.paint, common = who === 'y', presets = common ? PRESETS_COMMON : PRESETS, rgb = common ? commonRGB : hueRGB;
    const other = who === 'a' ? pt.b : who === 'b' ? pt.a : null;
    const dots = el("div", "picker sw-pick");
    presets.forEach(([k, h]) => {
      const x = el("button", "pick sw-dot" + (pt[who] === h ? " on" : ""), "");
      x.type = "button"; x.style.background = `rgb(${rgb(h).join(",")})`; x.title = t('paint.c.' + k);
      x.setAttribute("aria-label", t('paint.c.' + k));
      x.disabled = h === other;
      x.addEventListener("click", () => { pt[who] = h; render(); });
      dots.appendChild(x);
    });
    return dots;
  }
  function renderPaint(panel) {
    const pt = state.paint, fresh = k => pt.stage === k && pt.fresh;
    h2(panel, 'paint.h');
    explainKeys(panel, 'paint');
    const grid = el("div", "pt-grid");
    paintRow(grid, [`<div class="who">${t('net.alice')}</div>`, `<div class="who pub">${t('paint.public')}</div>`, `<div class="who">${t('net.bob')}</div>`]);
    paintRow(grid, [swatch(['a'], t('paint.secret'), "secret"), swatch(['Y'], t('paint.common'), "public"), swatch(['b'], t('paint.secret'), "secret")], t('paint.row0'));
    const prow = paintRow(grid, ["", "", ""], t('paint.pickHint'));
    ['a', 'y', 'b'].forEach((who, i) => prow.children[i].appendChild(huePicker(grid, who)));
    if (pt.stage >= 1) paintRow(grid, [swatch(['Y', 'a'], t('paint.mix'), "public", fresh(1)), `<div class="pt-arrow">${t('paint.sendArrow')}</div>`, swatch(['Y', 'b'], t('paint.mix'), "public", fresh(1))], t('paint.row1'));
    if (pt.stage >= 2) paintRow(grid, [swatch(['Y', 'b'], t('paint.got'), "sent"), `<div class="pt-eve">${t('paint.eveSees')}</div>`, swatch(['Y', 'a'], t('paint.got'), "sent")], t('paint.row2'));
    if (pt.stage >= 3) paintRow(grid, [swatch(['Y', 'b', 'a'], t('paint.final'), "ok", fresh(3)), `<div class="pt-eq green">=</div>`, swatch(['Y', 'a', 'b'], t('paint.final'), "ok", fresh(3))], t('paint.row3'));
    if (pt.stage >= 4) paintRow(grid, ["", swatch(['Y', 'a', 'Y', 'b'], t('paint.eveMix'), "bad", fresh(4)), ""], t('paint.row4'));
    panel.appendChild(grid);
    pt.fresh = false;
    if (pt.stage >= 3) note(panel, t('paint.same'), "done");
    if (pt.stage >= 4) panel.appendChild(el("div", "verdict bad pop", t('paint.eveFail')));
    if (pt.stage >= 4) warnKeys(panel, 'paint.real');
    const labels = ['paint.btn0', 'paint.btn1', 'paint.btn2', 'paint.btn3'];
    actionRow(panel, [
      pt.stage < 4 ? { label: t(labels[pt.stage]), onClick: () => { pt.stage++; pt.fresh = true; state.focusNext = true; render(); } } : null,
      pt.stage > 0 ? { label: t('paint.reset'), cls: "btn-ghost", onClick: () => { pt.stage = 0; render(); } } : null,
    ]);
    if (pt.stage < 4 && pt.stage > 0) panel.querySelector(".pt-grid").lastChild.classList.add("scroll-focus");
  }

  // Step 1: p and g are agreed in the open, Eve hears them too.
  // p or g card: a small gray line says what the number is for; ‹ › step through the allowed values.
  function pgCard(container, label, value, cap, list, onPick) {
    const card = el("div", "val public pg-card");
    card.appendChild(el("div", "vl", label));
    const row = el("div", "pg-row"), at = list.indexOf(value);
    const arrow = (txt, to) => {
      const b = el("button", "pg-arrow", txt);
      b.type = "button";
      b.disabled = to < 0 || to >= list.length || state.netBusy;
      b.addEventListener("click", () => onPick(list[to]));
      return b;
    };
    row.appendChild(arrow("‹", at - 1));
    row.appendChild(el("div", "vv", String(value)));
    row.appendChild(arrow("›", at + 1));
    card.appendChild(row);
    card.appendChild(el("div", "pg-cap", cap));
    container.appendChild(card);
  }
  // Step 1: p and g are agreed in the open, Eve hears them too.
  function renderPub(panel) {
    h2(panel, 'pub.h');
    const n = P + 7;
    renderExplain(panel, "why", { head: t('x.head'), short: t('x.pub'), full: [t('pub.p1', { n, p: P, r: n % P }), t('pub.p2')] });
    const v = vals(panel);
    v.classList.add("pg-vals");
    pgCard(v, t('pub.pLbl'), P, t('pub.pCap'), PS, x => { P = x; if (!PG[P].includes(G)) G = PG[P][0]; render(); });
    pgCard(v, t('pub.gLbl'), G, t('pub.gCap'), PG[P], x => { G = x; render(); });
    panel.appendChild(el("div", "eq", `${n} mod ${P} = ${n % P}<small>${t('pub.modCap', { n, q: 1, p: P, r: n % P })}</small>`));
    const done = pgDone() && !state.netBusy, pop = popCls(), pg = `p = ${P}, g = ${G}`;
    renderNet(panel, {
      alice: [{ cls: "p", text: pg }],
      bob: [done ? { cls: "p" + pop, text: pg } : { cls: "none", text: "p, g = ?" }],
      eve: [done ? { cls: "c" + pop, text: pg } : { cls: "none", text: "p, g = ?" }],
    });
    note(panel, t(done ? 'pub.done' : state.netBusy ? 'pub.flying' : 'pub.waiting', { p: P, g: G }), done ? "done" : "");
    actionRow(panel, [{
      label: t(done ? 'btn.netReplay' : 'pub.btn'), cls: done ? "btn-ghost" : "btn-gold",
      onClick: () => netSend([
        { from: "alice", to: "bob", cls: "p", label: "p, g", dur: 1600 },
        { fromMid: true, to: "eve", cls: "ghost", label: "p, g", dur: 700, delay: 800 },
      ], () => { state.pgFor = `${P},${G}`; }),
    }]);
  }

  // Step 2: each side picks a secret, next to the secret paint it stands for.
  function renderSecrets(panel) {
    h2(panel, 'sec.h');
    explainKeys(panel, 'sec');
    carry(panel, [[`p = ${P}`, "p"], [`g = ${G}`, "p"]]);
    const grid = el("div", "pt-grid sec-grid");

    const row = paintRow(grid, [swatch(['a'], t('paint.secret'), "secret"), `<div class="sec-eve">a = ?<br>b = ?<small>${t('sec.eve')}</small></div>`, swatch(['b'], t('paint.secret'), "secret")]);

  // Step 3: A = g^a mod p and B = g^b mod p, one multiplication per click. Sending is a step of its own,
  // so the channel doesn't sit below the lamp boards, out of sight.
  function renderOpen(panel) {
    h2(panel, 'open.h');
    explainKeys(panel, 'open');
    carry(panel, [[`p = ${P}`, "p"], [`g = ${G}`, "p"], [`🔒 a = ${state.a}`, "k"], [`🔒 b = ${state.b}`, "k"]]);
    const shown = computed();
    const rows = Math.max(rowsFor('A'), rowsFor('B'));
    const duo = el("div", "duo calc-duo");
    [['A', 'net.alice'], ['B', 'net.bob']].forEach(([k, who]) => {
      const box = el("div");
      box.appendChild(el("div", "who", t(who)));
      powWalk(box, k, rows);
      box.style.setProperty("--span", box.children.length - 1 + box.querySelector(".pw").children.length);
      duo.appendChild(box);
    });
    panel.appendChild(duo);
    if (shown) note(panel, t('open.ready', { A: A(), B: B() }), "done");
    actionRow(panel, [
      ...powerButtons(['A', 'B'], shown),
      !shown ? { label: t('btn.skip'), cls: "btn-ghost", onClick: () => finishAll(['A', 'B']) } : null,
    ]);
  }

  // Step 4: A and B go over the open channel; Eve takes copies.
  function renderSend(panel) {
    h2(panel, 'send.h');
    explainKeys(panel, 'send');
    carry(panel, [[`p = ${P}`, "p"], [`g = ${G}`, "p"], [`🔒 a = ${state.a}`, "k"], [`🔒 b = ${state.b}`, "k"], [`A = ${A()}`, "p"], [`B = ${B()}`, "p"]]);
    const done = exchanged() && !state.netBusy, pop = popCls();
    renderNet(panel, {
      top: { icon: t('net.kcIcon'), name: t('net.kc'), sub: t('net.kcSub'), ghost: true },
      alice: [{ cls: "k", text: `a = ${state.a}` }, { cls: "p", text: `A = ${A()}` }].concat(done ? [{ cls: "c" + pop, text: `B = ${B()}` }] : []),
      bob: [{ cls: "k", text: `b = ${state.b}` }, { cls: "p", text: `B = ${B()}` }].concat(done ? [{ cls: "c" + pop, text: `A = ${A()}` }] : []),
      eve: [{ cls: "p", text: `p = ${P}, g = ${G}` }].concat(done ? [{ cls: "c" + pop, text: `A = ${A()}` }, { cls: "c" + pop, text: `B = ${B()}` }, { cls: "no", text: "a, b = ?" }] : [{ cls: "none", text: "A, B = ?" }]),
    });
    note(panel, t(done ? 'ex.done' : state.netBusy ? 'ex.flying' : 'ex.waiting'), done ? "done" : "");
    actionRow(panel, [{
      label: t(done ? 'btn.netReplay' : 'open.sendBtn'), cls: done ? "btn-ghost" : "btn-gold",
      onClick: () => netSend([
        { from: "alice", to: "bob", cls: "p", label: `A=${A()}`, dur: 1800 },
        { from: "bob", to: "alice", cls: "p", label: `B=${B()}`, dur: 1800, delay: 250 },
        { fromMid: true, to: "eve", cls: "ghost", label: "A", dur: 700, delay: 900 },
        { fromMid: true, to: "eve", cls: "ghost", label: "B", dur: 700, delay: 1150 },
      ], () => { state.txFor = pair(); }),
    }]);
  }

  // Step 5: Alice walks B^a, Bob walks A^b; both land on the same number, which then meets in the
  // middle. "Why" unfolds every received tile into the fives it is made of: a·b fives on each side.
  function renderShared(panel) {
    h2(panel, 'sh.h');
    explainKeys(panel, 'sh');
    const rows = Math.max(rowsFor('sa'), rowsFor('sb'));
    const done = keyDone(), fresh = !!(done && state.fx && (state.fx.skip || state.fx.list.some(m => m.k === 'sa' || m.k === 'sb')));
    const duo = el("div", "duo calc-duo");
    [['sa', 'a', 'net.alice', B(), 'B'], ['sb', 'b', 'net.bob', A(), 'A']].forEach(([k, x, who, got, gotName]) => {
      const box = el("div");
      box.appendChild(el("div", "who", t(who)));
      carry(box, [[`🔒 ${x} = ${state[x]}`, "k"], [`${gotName} = ${got}`, "c"]]);
      powWalk(box, k, rows);
      box.style.setProperty("--span", box.children.length - 1 + box.querySelector(".pw").children.length);
      duo.appendChild(box);
    });
    panel.appendChild(duo);
    if (done) {
      const meet = el("div", "key-meet" + (fresh ? " fresh" : ""), `<span class="km km-a">${S()}</span><span class="km-eq">=</span><span class="km km-b">${S()}</span>`);
      meet.id = "keyMeet";
      // wait until the last multiplication on either side has finished its rows
      const at = Math.max(0, ...[...duo.querySelectorAll(".pw")].map(b => +b.dataset.end || 0));
      if (fresh) { meet.dataset.fresh = "1"; meet.dataset.at = at; requestAnimationFrame(meetFx); }
      meet.style.setProperty("--at", at + "ms");
      panel.appendChild(meet);
      const verdict = el("div", "verdict ok" + (fresh ? " pop late" : ""), t('sh.same', { s: S() }));
      verdict.style.setProperty("--at", at + "ms");
      panel.appendChild(verdict);
      if (state.unfold) unfoldViz(panel);
    }
    actionRow(panel, [
      ...powerButtons(['sa', 'sb'], done),
      !done ? { label: t('btn.skip'), cls: "btn-ghost", onClick: () => finishAll(['sa', 'sb']) } : null,
      done && !state.unfold ? { label: t('sh.unfoldBtn', { g: G }), onClick: () => { state.unfold = true; render(); } } : null,
    ]);
  }
  // Every B Alice multiplied is 5^b (mod 23), every A Bob multiplied is 5^a: open them up.
  function unfoldViz(panel) {
    const a = state.a, b = state.b;
    const body = vizBox(panel, t('unf.title'), t('unf.cap', { a, b, n: a * b, g: G, s: S(), p: P }), "unfold-viz");
    let d = 0;
    [['net.alice', a, B(), b], ['net.bob', b, A(), a]].forEach(([who, groups, val, size]) => {
      const row = el("div", "uf-row");

      const line = el("div", "uf-line");

        const fives = el("div", "uf-fives");
        for (let j = 0; j < size; j++) { const f = el("span", "uf-five", String(G)); f.style.animationDelay = (d++ * 45) + "ms"; fives.appendChild(f); }
        grp.appendChild(fives);
        line.appendChild(grp);
      }
