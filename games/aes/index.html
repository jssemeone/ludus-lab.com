<script>
/* ============ CRYPTO CORE (verified against 500 random round-trips offline) ============ */
const MUL2 = [0,2,4,6,8,10,12,14,3,1,7,5,11,9,15,13];
const MUL3 = [0,3,6,5,12,15,10,9,11,8,13,14,7,4,1,2];
const SBOX = [14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7];
const INV_SBOX = (() => { const a = new Array(16); SBOX.forEach((v,i)=>a[v]=i); return a; })();
const RCON = [0,1,2];

function subNibbles(s, box) { return s.map(x => box[x]); }
function shiftRow(s) { return [s[0], s[1], s[3], s[2]]; } // swap row1 (self-inverse)
function mixColumn(s, mulA, mulB) {
  // MIX = [[3,2],[2,3]] ; mulA=table-for-3, mulB=table-for-2 when encrypting (same matrix both directions here)
  const [s0,s1,s2,s3] = s;
  return [ mulA[s0]^mulB[s2], mulA[s1]^mulB[s3], mulB[s0]^mulA[s2], mulB[s1]^mulA[s3] ];
}
function xorState(a,b){ return a.map((x,i)=>x^b[i]); }

function keySchedule(master) {
  let w0 = [master[0], master[2]], w1 = [master[1], master[3]];
  const keys = [master.slice()];
  for (const rnd of [1,2]) {
    const rotated = [w1[1], w1[0]];
    const subbed = [SBOX[rotated[0]] ^ RCON[rnd], SBOX[rotated[1]]];
    const nw0 = [w0[0]^subbed[0], w0[1]^subbed[1]];
    const nw1 = [nw0[0]^w1[0], nw0[1]^w1[1]];
    keys.push([nw0[0], nw1[0], nw0[1], nw1[1]]);
    w0 = nw0; w1 = nw1;
  }
  return keys; // [RK0, RK1, RK2]
}

function encryptFull(plain, keys) {
  const trace = { rk: keys };
  let s = xorState(plain, keys[0]);
  trace.afterAK0 = s.slice();
  for (const rnd of [1,2]) {
    const afterSub = subNibbles(s, SBOX);
    const afterShift = shiftRow(afterSub);
    let afterMix = afterShift;
    if (rnd !== 2) afterMix = mixColumn(afterShift, MUL3, MUL2);
    const afterKey = xorState(afterMix, keys[rnd]);
    trace['round'+rnd] = { input: s.slice(), sub: afterSub, shift: afterShift, mix: afterMix, key: afterKey };
    s = afterKey;
  }
  trace.cipher = s.slice();
  return trace;
}

function nibbleBits(n) { return [(n>>3)&1,(n>>2)&1,(n>>1)&1,n&1]; }
function bitsToNibble(b) { return (b[0]<<3)|(b[1]<<2)|(b[2]<<1)|b[3]; }

/* ============ I18N ============ */
const I18N = {
ru: {
'meta.title': 'AES — Подстановочно-перестановочная сеть',
'header.h1': 'AES', 'header.subtitle': 'Подстановочно-перестановочная сеть · Rijndael, 2001',
'proto.head': 'ℹ️ Как работает шифр?',
'proto.p1': 'AES (Rijndael) — не сеть Фейстеля, а подстановочно-перестановочная сеть (SPN). Данные хранятся не как две половины L/R, а как матрица байт. Каждый раунд: замена байт по таблице (SubBytes), сдвиг строк матрицы (ShiftRows), перемешивание столбцов через умножение в конечном поле (MixColumns) и сложение с раундовым ключом (AddRoundKey). Настоящий AES — 128-битный блок (4×4 байта), здесь для наглядности — уменьшенная версия: 2×2 полубайта (нибла) в поле GF(2⁴).',
'proto.step1.t': '1. Замена (SubNibbles)', 'proto.step1.d': 'Каждый нибл состояния заменяется по фиксированной таблице (аналог S-box настоящего AES).',

  return s;
}
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ STATE ============ */
const PHASES = ["intro","textprep","plaintext","key","keyschedule","sboxprep","rounds","cipher","decrypt","summary"];
function randNibble(){ return Math.floor(Math.random()*16); }
function randKey(){ return [randNibble(),randNibble(),randNibble(),randNibble()]; }

const state = {
  phase: 0,
  text: '', bytes: [], selA: null, selB: null,
  plain: null, // [n0,n1,n2,n3]
  master: randKey(),
  keys: null, trace: null,
  ksStep: 0, // 0=none,1=RK1 shown,2=RK2 shown
  round: 1, roundStage: 0, // 0=start,1=sub done,2=shift done,3=mix done(or skipped),4=key done
  decRound: 2, decStage: 0, decRunning: false,
  avOpen: false, avP: null, avHistory: [], avJustFlipped: false,
  explain: {}, more: {},
};

function roundStagesFor(r){ return r===2 ? ['sub','shift','key'] : ['sub','shift','mix','key']; }

function computeAll(){
  state.keys = keySchedule(state.master);
  state.trace = encryptFull(state.plain, state.keys);
}

/* ============ RENDER HELPERS ============ */
function nibbleCell(val, cls, sub){
  const c = el('div','bit-cell'+(cls?(' '+cls):''));
  const v = el('div','bc-val', val===null||val===undefined?'?':String(val));
  c.appendChild(v);
  if (sub) c.appendChild(el('div','bc-sub', sub));
  return c;
}
function stateMatrix(vals, cls, subs){
  const wrap = el('div','matrix-wrap');
  const m = el('div','state-matrix');
  for (let i=0;i<4;i++) m.appendChild(nibbleCell(vals?vals[i]:null, cls, subs?subs[i]:null));
  wrap.appendChild(m);
  return wrap;
}
function bitRow(nibbleVal, activeIdx, colorCls){
  const row = el('div','bit-row');
  const bits = nibbleVal===null||nibbleVal===undefined ? [null,null,null,null] : nibbleBits(nibbleVal);
  bits.forEach((b,i)=>{
    const c = nibbleCell(b===null?'?':b, activeIdx===i?colorCls:'');
    row.appendChild(c);
  });
  return row;
}
function sboxGrid(box, activeIn, prevIn){
  const wrap = el('div','grid-wrap');
  const g = el('div','grid-4x4');
  for (let i=0;i<16;i++){
    const cell = el('div','grid-cell');
    if (i===activeIn) cell.classList.add('active');
    else if (i===prevIn) cell.classList.add('was');
    cell.appendChild(el('div','gc-in', String(i)));
    cell.appendChild(el('div','gc-out', '→ '+String(box[i])));
    g.appendChild(cell);
  }
  wrap.appendChild(g);
  return wrap;
}
function explainRow(container, key, headTxt, bodyHtml, warnCls){
  const box = el('div','explain'+(warnCls?' warn':''));
  const row = el('div','explain-row');
  row.appendChild(el('span',null,headTxt));
  const chevron = el('span',null,'▸');
  row.appendChild(chevron);
  const body = el('div','explain-body');
  body.innerHTML = bodyHtml;
  const isOpen = !!state.explain[key];
  if (isOpen) { body.classList.add('open'); chevron.textContent='▾'; }
  row.addEventListener('click', () => { state.explain[key] = !state.explain[key]; render(); });
  box.appendChild(row); box.appendChild(body);
  container.appendChild(box);
}

  } else {

RENDERERS.decrypt = function(panel){
  panel.appendChild(el('h2','step-h', t('decrypt.h')));
  panel.appendChild(Object.assign(el('p','step-p'), {textContent: t('decrypt.p')}));
  if (!state.decRunning) {
    panel.appendChild(el('div','nibble-label','CIPHERTEXT'));
    panel.appendChild(stateMatrix(state.trace.cipher, 'on-blue'));
    const btn = el('button','btn btn-gold', t('decrypt.runBtn'));
    btn.style.cssText='display:block;margin:10px auto;';
    btn.addEventListener('click', () => { state.decRunning=true; state.decRound=2; state.decStage=0; render(); updateNav(); });
    panel.appendChild(btn);
    return;
  }
  const r = state.decRound;
  const dots = el('div','stage-indicator');
  const total = 3;
  for (let i=0;i<total;i++) dots.appendChild(el('div','stage-dot'+(i<state.decStage?' completed':i===state.decStage?' active':'')));
  panel.appendChild(dots);

  // compute decrypt trace live for current round
  let s = r===2 ? state.trace.cipher.slice() : state.decR1Input;
  const afterKey = xorState(s, state.keys[r]);
  let afterMix = afterKey;
  if (r!==2) { /* round1's forward had mix, so inverse-mix applies when undoing round1 */ }
  const dots2 = document.createElement('div');
  opHeader(panel, 'INPUT');
  panel.appendChild(stateMatrix(s, 'on-blue'));

  opHeader(panel, 'ADDROUNDKEY (⊕ RK'+r+')');
  if (state.decStage>=1) panel.appendChild(stateMatrix(afterKey, 'on-gold'));
  else { const b=el('button','btn btn-gold', t('rounds.keyBtn')); b.style.cssText='display:block;margin:6px auto;'; b.addEventListener('click',()=>{state.decStage=1;render();}); panel.appendChild(b); return; }

  let afterInvMix = afterKey;
  if (r!==2) {
    afterInvMix = mixColumn(afterKey, MUL3, MUL2); // matrix coincides with its own inverse in this tiny field
    opHeader(panel, 'INV-MIXCOLUMN');
    if (state.decStage>=2) panel.appendChild(stateMatrix(afterInvMix, 'on-gold'));
    else { const b=el('button','btn btn-gold', t('rounds.mixBtn')); b.style.cssText='display:block;margin:6px auto;'; b.addEventListener('click',()=>{state.decStage=2;render();updateNav();}); panel.appendChild(b); return; }
  } else {
    panel.appendChild(Object.assign(el('div','disclaimer info'), {textContent: t('rounds.skipMix')}));
    state.decStage = Math.max(state.decStage,1);
  }

  const afterInvShift = shiftRow(afterInvMix);
  const afterInvSub = subNibbles(afterInvShift, INV_SBOX);
  const finalStage = r===2?2:3;
  opHeader(panel, 'INV-SHIFTROW → INV-SUBNIBBLES');
  if (state.decStage>=finalStage) {
    panel.appendChild(stateMatrix(afterInvSub, 'on-green'));
    if (r===2) state.decR1Input = afterInvSub;
    else {
      const finalPlain = xorState(afterInvSub, state.keys[0]);
      const matchBox = el('div','disclaimer success');
      const match = finalPlain.every((v,i)=>v===state.plain[i]);
      matchBox.textContent = t('decrypt.matched', {a: finalPlain.join(', '), b: state.plain.join(', ')});
      panel.appendChild(el('div','nibble-label','RECOVERED (⊕ RK0)'));
      panel.appendChild(stateMatrix(finalPlain, 'on-green'));
      panel.appendChild(matchBox);
    }
  } else {
    const b=el('button','btn btn-gold', t('rounds.shiftBtn')+' / '+t('rounds.subBtn'));
    b.style.cssText='display:block;margin:6px auto;';
    b.addEventListener('click',()=>{ state.decStage=finalStage; render(); updateNav(); });
    panel.appendChild(b);
    return;
  }

  if (r===2 && state.decStage>=finalStage) {
    const btn = el('button','btn btn-gold', t('decrypt.nextRoundBtn'));
    btn.style.cssText='display:block;margin:10px auto;';
    btn.addEventListener('click', () => { state.decRound=1; state.decStage=0; render(); updateNav(); });
    panel.appendChild(btn);
  }
};

/* ============ AVALANCHE / DIFFUSION OVERLAY ============ */
function openAvOverlay(){
  if (!state.avP) state.avP = [0,0,0,0];
  state.avOpen = true;
  document.getElementById('avOverlay').hidden = false;
  render();
}
function closeAvOverlay(){
  state.avOpen = false;
  document.getElementById('avOverlay').hidden = true;
}
function avComputeF(p){
  const sub = subNibbles(p, SBOX);
  const mixed = mixColumn(sub, MUL3, MUL2);
  return mixed;
}
function renderAvOverlay(){
  const body = document.getElementById('avBody');
  body.innerHTML = '';
  const h = el('h2', null, t('av.title'));
  body.appendChild(h);
  body.appendChild(Object.assign(el('div','ov-sub'), {textContent: t('av.sub')}));
  const why = el('div','disclaimer info'); why.textContent = t('av.why');
  body.appendChild(why);
  body.appendChild(Object.assign(el('p','step-p'), {textContent: t('av.instr')}));

  const F = avComputeF(state.avP);
  const Fprev = state.avHistory.length ? state.avHistory[0].Fbefore : F;

  const legend = el('p',null); legend.style.cssText='text-align:center;font-size:0.78rem;color:var(--text-muted);';
  legend.innerHTML = '<span style="color:var(--accent-blue)">'+esc(t('av.legendNow'))+'</span>';
  body.appendChild(legend);

  body.appendChild(el('div','nibble-label','P'));
  const pRow = el('div','bit-row');
  state.avP.forEach((v,i)=>{
    const changed = state.avHistory.length && state.avHistory[0].idx===i;
    const c = nibbleCell(v, changed?'on-blue':'');
    c.style.cursor='pointer';
    c.addEventListener('click', () => {
      const prevP = state.avP.slice();
      const prevF = avComputeF(state.avP);
      state.avP[i] ^= 8; // flip MSB of nibble for a visible, consistent diffusion demo
      const newF = avComputeF(state.avP);
      const diff = newF.filter((v2,j)=>v2!==prevF[j]).length;
      state.avHistory.unshift({idx:i, before:prevP, after:state.avP.slice(), Fbefore:prevF, Fafter:newF, diff});
      if (state.avHistory.length>10) state.avHistory.pop();
      render();
    });
    pRow.appendChild(c);
  });
  body.appendChild(pRow);

  body.appendChild(el('div','arrow-down','↓ SubNibbles + MixColumn'));

  body.appendChild(el('div','nibble-label','F(P)'));
  const fRow = el('div','bit-row');
  const newestDiffIdxs = state.avHistory.length ? F.map((v,i)=>v!==Fprev[i]?i:-1).filter(i=>i>=0) : [];
  F.forEach((v,i)=>{
    const changed = newestDiffIdxs.includes(i);
    fRow.appendChild(nibbleCell(v, changed?'on-blue':''));
  });
  body.appendChild(fRow);

  if (state.avHistory.length) {
    const n = state.avHistory.length;
    const avg = (state.avHistory.reduce((a,h)=>a+h.diff,0)/n).toFixed(1);
    body.appendChild(Object.assign(el('p',null), {textContent: t('av.flipHint',{n, avg}), style:'text-align:center;color:var(--text-muted);font-size:0.8rem;'}));
  }

  const btnRow = el('div'); btnRow.style.cssText='display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;';
  const randBtn = el('button','btn btn-ghost', t('av.randomBtn'));
  randBtn.addEventListener('click', () => {
    const i = Math.floor(Math.random()*4);
    const prevP = state.avP.slice();
    const prevF = avComputeF(state.avP);
    state.avP[i] ^= 8;
    const newF = avComputeF(state.avP);
    const diff = newF.filter((v2,j)=>v2!==prevF[j]).length;
    state.avHistory.unshift({idx:i, before:prevP, after:state.avP.slice(), Fbefore:prevF, Fafter:newF, diff});
    if (state.avHistory.length>10) state.avHistory.pop();
    render();
  });
  btnRow.appendChild(randBtn);
  const resetBtn = el('button','btn btn-ghost', t('av.resetBtn'));
  resetBtn.addEventListener('click', () => { state.avP=[0,0,0,0]; state.avHistory=[]; render(); });
  btnRow.appendChild(resetBtn);
  body.appendChild(btnRow);
}

/* ============ NAV / MAP / BOOT ============ */
function nextLocked(){
  if (PHASES[state.phase]==='keyschedule') return state.ksStep<2;
  if (PHASES[state.phase]==='rounds') return state.roundStage < roundStagesFor(state.round).length;
  if (PHASES[state.phase]==='textprep') return !(state.selA!==null && state.selB!==null);
  if (PHASES[state.phase]==='decrypt') return !(state.decRunning && state.decRound===1 && state.decStage>=3);
  return false;
}
function goNext(){
  if (nextLocked()) return;
  const name = PHASES[state.phase];
  if (name==='rounds') {
    if (state.round===1) { state.round=2; state.roundStage=0; render(); updateNav(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  }
  if (state.phase < PHASES.length-1) { state.phase++; render(); updateNav(); }
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  const name = PHASES[state.phase];
  if (name==='rounds' && state.round===2) { state.round=1; state.roundStage=roundStagesFor(1).length; render(); updateNav(); return; }
  if (name==='decrypt' && state.decRunning) { state.decRunning=false; render(); updateNav(); return; }
  if (state.phase>0) { state.phase--; render(); updateNav(); }
}
function updateNav(){
  document.getElementById('backBtn').disabled = state.phase===0;
  const nb = document.getElementById('nextBtn');
  const isLast = state.phase===PHASES.length-1;
  nb.style.display = isLast ? 'none' : '';
  nb.disabled = nextLocked();
  let hint='';
  if (PHASES[state.phase]==='keyschedule' && nextLocked()) hint = t('nav.lockKs');
  if (PHASES[state.phase]==='rounds' && nextLocked()) hint = t('nav.lockRound');
  let hintEl = document.getElementById('navHint');
  if (hintEl) hintEl.remove();
  if (hint) { hintEl = el('div','nav-hint'); hintEl.id='navHint'; hintEl.textContent = hint; document.getElementById('navRow').appendChild(hintEl); }
}

function renderStageDots(){
  const dots = document.getElementById('stageDots');
  dots.innerHTML='';
  PHASES.forEach((ph,i) => {
    dots.appendChild(el('div','stage-dot'+(i<state.phase?' completed':i===state.phase?' active':'')));
  });
  document.getElementById('stepLabel').textContent = t('phase.'+PHASES[state.phase]);
}

function mapStatus(idx){
  if (state.phase>idx) return 'done';
  if (state.phase===idx) return 'current';
  return 'upcoming';
}
function renderMap(){
  const body = document.getElementById('mapBody');
  body.innerHTML='';
  const nodeDefs = [
    {idx:1, label:() => t('map.text'), data: () => (state.selA!==null&&state.selB!==null) ? (state.bytes[state.selA]+', '+state.bytes[state.selB]) : ''},
    {idx:2, label:() => t('map.message'), data: () => state.plain ? state.plain.join(' ') : ''},
    {idx:3, label:() => t('map.key'), data: () => state.master.join(' ')},
    {idx:4, label:() => t('map.keyschedule'), data: () => state.keys ? 'RK1='+state.keys[1].join('')+(state.ksStep>=2?' RK2='+state.keys[2].join(''):'') : ''},
    {idx:5, label:() => t('map.sbox'), data: () => ''},
    {idx:6, label:() => t('map.round',{r: state.phase===6 ? state.round : 2}), data: () => (state.phase===6 ? 'r'+state.round+': '+t('rounds.stageOf',{a:Math.min(state.roundStage+1,roundStagesFor(state.round).length), b:roundStagesFor(state.round).length}) : '')},
    {idx:7, label:() => t('map.cipher'), data: () => state.trace ? state.trace.cipher.join(' ') : ''},
    {idx:8, label:() => t('map.decrypt'), data: () => ''},
    {idx:9, label:() => t('map.summary'), data: () => ''},
  ];
  nodeDefs.forEach(nd => {
    const status = mapStatus(nd.idx);
    const node = el('div','map-node '+status);
    node.appendChild(el('div','map-dot'));
    const nbody = el('div','map-node-body');
    nbody.appendChild(el('div','map-node-title', nd.label()));
    const d = nd.data();
    if (d && status!=='upcoming') nbody.appendChild(el('div','map-node-data', d));
    node.appendChild(nbody);
    if (status==='done') { node.classList.add('clickable'); node.addEventListener('click', () => { state.phase = nd.idx; render(); updateNav(); }); }
    body.appendChild(node);
  });
}

function render(){
  document.getElementById('h1Title').textContent = t('header.h1');
  document.getElementById('subtitle').textContent = t('header.subtitle');
  document.getElementById('protoHeadTxt').textContent = t('proto.head');
  const pc = document.getElementById('protocolContent');
  pc.innerHTML = '<p>'+esc(t('proto.p1'))+'</p>'
    + '<div class="protocol-step"><b>'+esc(t('proto.step1.t'))+'</b><p>'+esc(t('proto.step1.d'))+'</p></div>'
    + '<div class="protocol-step"><b>'+esc(t('proto.step2.t'))+'</b><p>'+esc(t('proto.step2.d'))+'</p></div>'
    + '<div class="protocol-step"><b>'+esc(t('proto.step3.t'))+'</b><p>'+esc(t('proto.step3.d'))+'</p></div>'
    + '<div class="protocol-step"><b>'+esc(t('proto.step4.t'))+'</b><p>'+esc(t('proto.step4.d'))+'</p></div>';
  document.getElementById('mapTitle').textContent = t('map.title');
  document.getElementById('backBtn').textContent = t('btn.back');
  document.getElementById('nextBtn').textContent = t('btn.next');
  document.getElementById('footerTxt').textContent = t('footer.txt');
  document.getElementById('footerHome').textContent = t('footer.home');
  document.title = t('meta.title');

  renderStageDots();
  const panel = document.getElementById('stepPanel');
  panel.className = 'panel';
  panel.innerHTML='';
  RENDERERS[PHASES[state.phase]](panel);
  renderMap();
  if (state.avOpen) renderAvOverlay();
}

/* ============ BOOT ============ */
document.getElementById('protocolHeader').addEventListener('click', () => {
  const header = document.getElementById('protocolHeader');
  const content = document.getElementById('protocolContent');
  const isOpen = content.classList.contains('open');
  content.classList.toggle('open', !isOpen);
  header.classList.toggle('open', !isOpen);
});
document.getElementById('backBtn').addEventListener('click', goBack);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('avClose').addEventListener('click', closeAvOverlay);
document.getElementById('avOverlay').addEventListener('click', (e) => { if (e.target.id==='avOverlay') closeAvOverlay(); });
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.langBtn;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b===btn));
    render();
  });
});
document.querySelector('[data-lang-btn="ru"]').classList.add('active');

render();
updateNav();
</script>
</body>
</html>
